<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>YBM 토익 550+ Part 5·6 변형문제 시험</title>
<style>
:root{
  --bg:#f5f6f3; --card:#fff; --ink:#15181d; --dim:#5b6472; --line:#dfe3ea;
  --acc:#1d4ed8; --acc2:#eef2ff; --ok:#15803d; --ok2:#ecfdf5; --no:#b91c1c; --no2:#fef2f2;
  --warn:#b45309; --warn2:#fffbeb;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0;overscroll-behavior-y:contain}   /* 당겨서 새로 고침을 막는다(시험 중 실수로 새로 고침 → 이탈) */
body{background:var(--bg);color:var(--ink);font-family:'Malgun Gothic','Apple SD Gothic Neo',-apple-system,BlinkMacSystemFont,'Segoe UI',system-ui,sans-serif;
  font-size:calc(16px*var(--fz,1));line-height:1.6;-webkit-text-size-adjust:100%}
.wrap{max-width:720px;margin:0 auto;padding:16px 16px 120px}
h1{font-size:calc(19px*var(--fz,1));margin:0}
h1 small{display:block;font-size:calc(13px*var(--fz,1));color:var(--dim);font-weight:400;margin-top:3px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;margin:12px 0}
.card.warn{border-color:#fcd34d;background:var(--warn2)}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
input[type=text],input[type=password],select{flex:1;min-width:120px;font:inherit;padding:11px 12px;border:1px solid var(--line);
  border-radius:10px;background:#fff;color:var(--ink)}
input.code{font-family:ui-monospace,Menlo,monospace;font-size:calc(22px*var(--fz,1));letter-spacing:3px;text-align:center;text-transform:uppercase}
button{font:inherit;font-weight:600;padding:12px 16px;border:0;border-radius:10px;background:var(--acc);color:#fff;cursor:pointer}
button:disabled{background:#c7cdd8;cursor:default}
button.ghost{background:#fff;color:var(--ink);border:1px solid var(--line)}
button.small{padding:8px 12px;font-size:calc(14px*var(--fz,1))}
.muted{color:var(--dim);font-size:calc(14px*var(--fz,1))}
.logo{display:block;height:34px;width:auto;margin:0 0 10px}
.by{margin-top:7px;padding-top:7px;border-top:1px solid var(--line);font-size:calc(13px*var(--fz,1));color:var(--dim)}
.by b{color:var(--ink);font-weight:600}
.bar{position:fixed;left:0;right:0;bottom:0;background:rgba(245,246,243,.95);backdrop-filter:blur(6px);
  border-top:1px solid var(--line);padding:10px 16px calc(10px + env(safe-area-inset-bottom));z-index:5}
.bar .wrap{padding:0;display:flex;gap:8px;align-items:center}
.bar button{flex:1}
.clockbar{position:sticky;top:0;z-index:4;background:var(--card);border:1px solid var(--line);border-radius:12px;
  padding:10px 14px;margin:0 0 12px;display:flex;justify-content:space-between;align-items:center;gap:10px}
.clock{font-family:ui-monospace,Menlo,monospace;font-size:calc(24px*var(--fz,1));font-weight:700;letter-spacing:1px}
.clock.hot{color:var(--no)}
.q{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin:12px 0}
.qh{display:flex;gap:8px;align-items:center;margin-bottom:8px}
.no{background:var(--acc);color:#fff;border-radius:999px;font-size:calc(12.5px*var(--fz,1));font-weight:700;padding:2px 10px}
.tag{font-size:calc(12.5px*var(--fz,1));color:var(--dim)}
.stem{font-family:'Malgun Gothic','Noto Sans KR',sans-serif;font-size:calc(19px*var(--fz,1));line-height:1.7;margin:2px 0 12px}
.stem u{text-decoration:none;border-bottom:2px solid var(--ink);padding:0 22px}
label.opt{display:flex;gap:10px;align-items:flex-start;padding:11px 12px;border:1px solid var(--line);border-radius:10px;
  margin:6px 0;background:#fff;cursor:pointer;font-family:'Malgun Gothic','Noto Sans KR',sans-serif;font-size:calc(17px*var(--fz,1))}
label.opt input{margin:4px 0 0}
label.opt.pick{border-color:var(--acc);background:var(--acc2)}
label.opt.right{border-color:var(--ok);background:var(--ok2)}
label.opt.wrong{border-color:var(--no);background:var(--no2)}
.mark{font-weight:700;font-size:calc(14px*var(--fz,1));font-family:'Malgun Gothic',system-ui,sans-serif}
.mark.o{color:var(--ok)} .mark.x{color:var(--no)}
.ex{margin-top:8px;padding:10px 12px;background:#f8fafc;border-left:3px solid var(--acc);border-radius:0 8px 8px 0;
  font-size:calc(14px*var(--fz,1));color:#334155}
.big{text-align:center;padding:22px 16px}
.big .n{font-size:calc(44px*var(--fz,1));font-weight:800;letter-spacing:-1px}
.big.pass .n{color:var(--ok)} .big.fail .n{color:var(--no)}
.big .m{font-size:calc(15px*var(--fz,1));color:var(--dim);margin-top:4px}
.codebox{text-align:center;padding:16px;background:#0f172a;color:#fff;border-radius:14px;margin:12px 0}
.codebox .c{font-family:ui-monospace,Menlo,monospace;font-size:calc(38px*var(--fz,1));font-weight:800;letter-spacing:4px;line-height:1.25}
.codebox .s{font-size:calc(13px*var(--fz,1));color:#94a3b8;margin-top:6px}
pre.msg{white-space:pre-wrap;word-break:break-all;background:#0f172a;color:#e2e8f0;border-radius:10px;padding:12px;
  font-size:calc(14px*var(--fz,1));font-family:ui-monospace,Menlo,monospace;margin:10px 0 0}
textarea{width:100%;min-height:110px;font:inherit;font-size:calc(14px*var(--fz,1));padding:10px;border:1px solid var(--line);border-radius:10px}
table{width:100%;border-collapse:collapse;font-size:calc(14px*var(--fz,1));margin-top:8px}
th,td{border:1px solid var(--line);padding:6px 8px;text-align:left}
th{background:#f1f5f9}
tr.bad td{background:var(--no2)}
tr.absent td{background:#f8fafc;color:var(--dim)}
.tabs{display:flex;gap:6px;margin-bottom:4px}
.tabs button{flex:1;background:#fff;color:var(--dim);border:1px solid var(--line)}
.tabs button.on{background:var(--acc);color:#fff;border-color:var(--acc)}
.set{margin-top:12px}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.chip{display:flex;align-items:center;gap:6px;border:1px solid var(--line);border-radius:10px;padding:4px 6px 4px 10px;background:#fff;font-size:calc(14px*var(--fz,1))}
.chip input{width:54px;font:inherit;font-size:calc(16px*var(--fz,1));padding:6px 4px;border:1px solid var(--line);border-radius:8px;text-align:center;background:#fff}
.chip.lv0{border-color:#86efac} .chip.lv1{border-color:#93c5fd} .chip.lv2{border-color:#fca5a5}
.hide{display:none!important}
a.link{color:var(--acc);font-size:calc(13px*var(--fz,1));cursor:pointer;text-decoration:underline}
.kpi{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.kpi div{flex:1;min-width:84px;background:#f8fafc;border:1px solid var(--line);border-radius:10px;padding:8px 10px;text-align:center;font-size:calc(13px*var(--fz,1))}
.kpi b{display:block;font-size:calc(22px*var(--fz,1))}
/* 이탈 방지(2026-11-11): 시험 화면은 글자를 고를 수 없고, 화면을 벗어난 동안에는 문제를 가린다 */
#quiz{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
body.away #qs{visibility:hidden}
.guardline{font-size:calc(12.5px*var(--fz,1));color:var(--dim)}
.guardline.hot{color:var(--no);font-weight:700}
#cover{position:fixed;inset:0;z-index:2000;background:#0f172a;color:#fff;display:flex;align-items:center;
  justify-content:center;padding:24px;text-align:center}
#cover .in{max-width:440px}
#cover .t{display:block;font-size:calc(22px*var(--fz,1));font-weight:800;margin-bottom:10px}
#cover p{margin:8px 0;font-size:calc(16px*var(--fz,1));color:#e2e8f0}
#cover p b{color:#fde68a}
#cover button{margin-top:16px;width:100%}
#cover button.ghost{margin-top:8px;background:transparent;color:#cbd5e1;border-color:#475569}
label.pledge{display:flex;gap:10px;align-items:flex-start;padding:11px 12px;border:1px solid var(--line);border-radius:10px;
  background:#fff;cursor:pointer;font-size:calc(15px*var(--fz,1))}
label.pledge input{margin:5px 0 0}
tr.out td{background:var(--no2);color:var(--no);font-weight:700}
@media print{#quiz{display:none!important}}
</style>
<!--LEESS-GATE2--><script src="/leess/roster.js"></script><script src="/leess/gate.js"></script><style id="ipadCss">
/* 아이패드 기준 화면(2026-11-09) — 폭 740px 이상(아이패드 세로·가로, 컴퓨터)에서 본문 폭을 넓히고 글자를 키운다. 휴대폰은 그대로. */
@media (min-width:740px) and (min-height:560px){
:root{--fz:1.19}
.wrap{max-width:1100px!important}
.wrap{padding-left:26px!important;padding-right:26px!important}
.brand img{max-width:640px!important}
input[type=radio],input[type=checkbox]{width:19px;height:19px}
.lock,.gate{max-width:600px!important}
#pwaSheet .pwa-box{max-width:620px!important}
}
</style>

<body>
<div class="wrap">
  <header class="card" style="padding:14px 16px">
    <img id="logo" class="logo hide" alt="">
    <h1 id="appTitle"><small id="appSub"></small></h1>
    <div class="by" id="appBy"></div>
  </header>

  <!-- ───────── 학생: 대기 화면 ───────── -->
  <section id="home">
    <div class="card warn">
      <b>대기 중입니다</b>
      <p class="muted" style="margin:6px 0 0">교수님이 <b>시험 코드</b>를 알려주시면 아래에 입력하세요.
        코드를 넣기 전에는 문제가 나오지 않습니다.</p>
    </div>
    <div class="card">
      <div class="row"><input type="text" id="name" placeholder="이름 (필수)" autocomplete="off"></div>
      <div class="row" style="margin-top:8px">
        <input type="text" id="code" class="code" placeholder="XXXX-XXXX" maxlength="9" autocomplete="off"
               autocapitalize="characters" spellcheck="false"></div>
      <p class="muted" id="codeMsg" style="margin:8px 0 0"></p>
    </div>
    <div class="card">
      <b>시험 중 지킬 것</b>
      <p class="muted" id="pledgeText" style="margin:6px 0 10px"></p>
      <label class="pledge"><input type="checkbox" id="pledge">
        <span>확인했습니다. 시험이 끝날 때까지 이 화면을 벗어나지 않겠습니다.</span></label>
    </div>
    <div class="card">
      <div class="row" style="justify-content:space-between">
        <b>내 응시 기록</b>
        <span></span>
      </div>
      <div id="myLog" class="muted" style="margin-top:6px">아직 기록이 없습니다.</div>
    </div>
  </section>

  <!-- ───────── 학생: 시험 ───────── -->
  <section id="quiz" class="hide">
    <div class="clockbar">
      <div><b id="quizWho"></b><div class="muted" id="quizSub"></div><div class="guardline" id="guardLine"></div></div>
      <div class="clock" id="clock">--:--</div>
    </div>
    <div id="qs"></div>
  </section>

  <!-- ───────── 학생: 제출 완료(종료 대기) ───────── -->
  <section id="waitEnd" class="hide">
    <div class="card big"><div class="n" id="waitClock">--:--</div>
      <div class="m">제출되었습니다. <b>시험 종료 시각</b>이 되면 점수와 해설이 열립니다.<br>
        그때까지 이 화면을 그대로 두세요.</div></div>
    <div class="card warn hide" id="waitNote"></div>
    <div class="card"><div class="muted" id="waitInfo"></div></div>
  </section>

  <!-- ───────── 학생: 결과 ───────── -->
  <section id="result" class="hide">
    <div class="card big" id="scoreCard"><div class="n" id="scoreN"></div><div class="m" id="scoreM"></div></div>
    <div class="card"><p class="muted" style="margin:0">채점은 서버에서 이루어졌고, 결과는 <b>교수님께 자동으로 전송</b>되었습니다.
      따로 보내실 필요가 없습니다.</p></div>
    <div id="review"></div>
  </section>

  
</div>

<div id="cover" class="hide"><div class="in"><span class="t" id="coverT"></span><p id="coverM"></p>
  <button id="coverGo" class="hide"></button><button id="coverNo" class="ghost hide"></button></div></div>
<div class="bar"><div class="wrap" id="barIn"></div></div>

  v = v * 16 + ((n - 5) & 15);                         // 4bit  문제 수 5~20
  v = v * 32 + (pass & 31);                            // 5bit  합격선(맞혀야 하는 문제 수)

/* ── 배분: 어느 단원에서 몇 문제, 난이도별로 몇 문제 ──────────────────

function defaultCfg(unit, n) {
  n = Math.min(20, Math.max(5, n || N_DEF));
  const u = {}, prev = rangeOf(unit).filter(k => k !== unit).sort((a, b) => b - a);
  u[unit] = Math.min(FRAMES[unit], prev.length ? Math.max(1, Math.round(n * TODAY_DEF / N_DEF)) : n);   // 오늘 단원 몫은 문제 수에 비례(기본 4/10)
  prev.forEach(k => { u[k] = 0; });
  let rest = n - u[unit];
  for (let i = 0; rest > 0 && prev.length && i < 400; i++) {   // 앞 단원을 최근 것부터 돌아가며 한 문제씩
    const k = prev[i % prev.length];
    if (u[k] < FRAMES[k]) { u[k]++; rest--; }

/* ── 출제: 코드(단원·시드)와 배분(cfg)만으로 정해진다 — 반 전체가 같은 문제 ─
   · 단원별 몫은 그대로 지킨다(오늘 단원부터).
   · 난이도 몫은 목표다: 슬롯마다 가장 많이 남은 난이도를 먼저 찾고, 그 단원에 없으면 다른 난이도로 채운다.

function examItems(unit, seed, cfg) {
  cfg = cfg || defaultCfg(unit, N_DEF);

  const picked = [], usedFrame = new Set(), short = { u: {}, l: [0, 0, 0] };

  const N = Math.min(20, Math.max(1, cfgSum(units.map(k => cfg.u[k]))));
  const X = new Set(cfg.x || []);                      // 앞 회차에 이미 낸 문장 틀(2026-11-11) — 교수 화면이 시험을 열 때 정해 넣는다
  const free = it => !usedFrame.has(frameOf(it.id)) && !X.has(frameOf(it.id)) && !picked.includes(it);
  const take = it => { picked.push(it); usedFrame.add(frameOf(it.id)); };
  units.forEach(k => {
    const want = Math.max(0, Math.min(FRAMES[k], +cfg.u[k] || 0));
    const pool = shuf(D.items[k], rnd), partCnt = {};
    let got = 0;
    for (let s = 0; s < want && picked.length < N; s++) {

      let hit = null;
      for (const lv of order) {

    for (const it of shuf(rangeOf(unit).flatMap(k => D.items[k]), rnd)) {

    }

    for (const it of shuf(rangeOf(unit).flatMap(k => D.items[k]), rnd)) {
      if (picked.length >= N) break;

function paperFor(items, name, code) {
  const rnd = mulberry32(hashNum(name.trim() + '@' + code + '|' + D.salt) >>> 0);
  const qs = items.map(it => {
    const perm = shuf([0, 1, 2, 3], rnd);
    return { id: it.id, u: it.u, part: it.part, point: it.point, lv: it.lv, q: it.q, ex: it.ex,
             opts: perm.map(i => it.opts[i]), ans: perm.indexOf(it.ans) };
  });
  const cap = Math.ceil(qs.length / 4) + 1;            // 정답이 한 자리에 몰리지 않게
  for (let p = 0; p < 12; p++) {
    const h = [0, 0, 0, 0]; qs.forEach(q => h[q.ans]++);
    const hi = h.indexOf(Math.max(...h)), lo = h.indexOf(Math.min(...h));
    if (h[hi] <= cap) break;
    const q = qs.find(x => x.ans === hi);
    [q.opts[hi], q.opts[lo]] = [q.opts[lo], q.opts[hi]]; q.ans = lo;
  }
  return qs;
}

  let j; try { j = JSON.parse(t); } catch (e) { throw new Error('서버 응답을 읽지 못했습니다.'); }
  if (!j.ok) {
    if (D.role === 'teacher' && /비밀번호/.test(j.msg || '')) { store.del('auth'); store.del('pinText'); }   // 비밀번호가 바뀌었으면 다시 묻는다
    if (/알 수 없는 요청/.test(j.msg || '')) throw new Error('채점 서버가 옛 버전입니다. Apps Script 「새 버전 배포」가 필요합니다.');
    throw new Error(j.msg || '서버가 요청을 거절했습니다.');
  }
  return j;
}

/* ── 화면 전환 ──────────────────────────────────────────────────── */
let view = 'home', cur = null, tick = null;
/* 이탈 방지 기준: 이탈 GUARD회째(0 = 기록만)이거나 한 번에 AWAY_MAX 넘게 나가 있으면 자동 제출. 회차마다 교수님이 정하고(서버 cfg), 없으면 이 기본값 */
const GUARD_DEF = D.guard === undefined ? 2 : +D.guard, AWAY_MAX = 10e3, BLIP = 2e3, BEAT_GAP = 5e3, IDLE_OFF = 15e3;
const T0 = Date.now();                                  // 이 페이지가 뜬 시각 — 새로 고침으로 돌아왔을 때 「나간 시각 ~ 다시 뜬 시각」만 이탈로 센다
let resumed = false;
const guardOf = v => v === undefined || v === null ? GUARD_DEF : Math.max(0, Math.min(3, Math.floor(+v) || 0));
const pledged = code => $('#pledge').checked || !!store.get('run:' + code, null);   // 이미 풀던 시험이면 다시 묻지 않는다
function show(v) {

  window.scrollTo(0, 0); bar();
}
function bar() {
  const b = $('#barIn'); b.innerHTML = '';

    const c = unpackCode($('#code').value), opened = c && endTime(c.endMin), k = c && CFG[c.code];
    const done = c && store.get('done:' + c.code, null), pend = c && store.get('pend:' + c.code, null);
    const live_ = k && !k.err && k.end && Date.now() < k.end;                 // 교수님이 「시작」을 눌렀고 아직 종료 전
    const needPledge = !!c && !done && !pend && !pledged(c.code);
    const go = el('button', '', done ? '내 결과 보기' : (k && !k.err && !k.end ? '교수님이 「시작」을 누르면 열립니다'
      : (needPledge && live_ ? '위 「시험 중 지킬 것」에 체크하세요' : '시험 시작')));
    go.disabled = !($('#name').value.trim() && c && opened && (done || pend || live_)) || needPledge;
    go.onclick = start; b.append(go);
  } else if (view === 'quiz') {
    const n = cur.pick.filter(x => x !== null).length;
    const g = el('button', '', `제출하기 (${n}/${cur.n} 답함)`);
    g.disabled = n < cur.n;
    // 브라우저 confirm 창은 스크립트를 멈춰 그 사이의 이탈을 못 잡는다 → 페이지 안 확인 창을 쓴다(떠 있는 동안에도 이탈은 그대로 잡힌다)
    g.onclick = () => cover('제출할까요?', '제출하면 고칠 수 없습니다.', '제출', () => { if (view === 'quiz') submit('제출'); }, '취소');
    b.append(g);
  } else if (view === 'waitEnd') {
    if (cur && store.get('pend:' + cur.code, null)) {
      const r = el('button', '', '다시 보내기'); r.onclick = () => { $('#waitInfo').textContent = '채점 서버로 보내는 중…'; sendPending(); };
      b.append(r);
    } else b.append(el('span', 'muted', '시험이 끝날 때까지 기다려 주세요.'));
  } else if (view === 'result') {
    const h = el('button', '', '처음 화면으로'); h.onclick = () => { cur = null; home(); show('home'); };
    b.append(h);

    const h = el('button', 'ghost', '학생 화면으로'); h.onclick = () => { home(); show('home'); };
    b.append(h);
  }
}

/* ── 학생 ───────────────────────────────────────────────────────── */
function home() {
  $('#waitNote').classList.add('hide');
  const log = store.get('log', []);
  $('#myLog').innerHTML = log.length
    ? '<table><tr><th>단원</th><th>점수</th><th>결과</th><th>시각</th></tr>'
      + log.slice(-10).reverse().map(r => `<tr><td>U${r.u}</td><td>${r.score}/${r.n}</td>`
        + `<td style="color:${r.pass ? 'var(--ok)' : 'var(--no)'}">${r.pass ? '합격' : '불합격'}</td><td>${r.at}</td></tr>`).join('')
      + '</table>'
    : '아직 기록이 없습니다.';

}
/* 배분(cfg)은 서버에서 코드로 받아 온다. 한 번 받으면 이 기기에 저장해 두고 다시 묻지 않는다. */
const CFG = {};                                        // 코드 → {cfg} 또는 {err}
let cfgWait = null;
async function loadCfg(code) {
  if (CFG[code] && !CFG[code].err && CFG[code].end) return CFG[code];
  const saved = store.get('cfg:' + code, null);
  if (saved && saved.end) return (CFG[code] = saved);
  try {
    const r = await post('cfg', { code: code });
    // end = 서버 시계로 정한 종료 시각(0 이면 교수님이 아직 「시작」 전) → 이 기기 시계로 옮겨 둔다
    const end = r.end ? r.end - ((r.now || Date.now()) - Date.now()) : 0;
    // 이탈 기준: 새 서버는 guard 로, 옛 서버는 설정(cfg) 안의 g 로 온다(교수 앱이 두 곳에 다 싣는다). 둘 다 없으면 기본값
    CFG[code] = { cfg: r.cfg || null, n: r.n, pass: r.pass, mins: r.mins || 0, end: end,
                  guard: guardOf(r.guard !== undefined && r.guard !== null ? r.guard : (r.cfg ? r.cfg.g : undefined)) };
    if (end) store.set('cfg:' + code, CFG[code]);
  } catch (e) {
    // 옛 서버(cfg 요청이 없는 버전)면 학생이 알아들을 수 있는 말로 바꾼다
    CFG[code] = { err: /알 수 없는 요청/.test(e.message) ? '채점 서버가 아직 옛 버전입니다. 교수님께 「스크립트 새 버전 배포」가 필요하다고 알려 주세요.' : e.message };
  }
  return CFG[code];
}
function codeCheck() {
  const raw = $('#code').value.trim(), m = $('#codeMsg');
  pledgeDraw();
  if (!raw) { m.textContent = ''; return bar(); }
  const c = unpackCode(raw);
  if (!c) { m.innerHTML = '<span style="color:var(--no)">코드가 올바르지 않습니다. 다시 확인하세요.</span>'; return bar(); }
  const opened = endTime(c.endMin);                    // 코드를 연 시각 — 12시간 넘으면 지난 코드
  if (!opened) { m.innerHTML = '<span style="color:var(--no)">지난 시험 코드입니다.</span>'; return bar(); }
  const done = store.get('done:' + c.code, null), pend = store.get('pend:' + c.code, null);
  const k0 = CFG[c.code];
  if (k0 && k0.end && Date.now() >= k0.end && !done && !pend) {
    m.innerHTML = `<span style="color:var(--no)">이미 종료된 시험입니다(종료 ${hhmm(new Date(k0.end))}). 응시할 수 없습니다.</span>`; return bar(); }
  if (!SRV) { m.innerHTML = '<span style="color:var(--no)">채점 서버가 아직 연결되지 않았습니다. 교수님께 알려 주세요.</span>'; return bar(); }
  if (done) { m.innerHTML = '<span style="color:var(--warn)">이미 응시한 시험입니다. 「시험 시작」을 누르면 제출한 결과를 봅니다.</span>'; return bar(); }
  const info = `Unit ${c.unit} · 범위 ${rangeLabel(c.unit)} · ${c.n}문제 · ${c.pass}문제 이상 합격`
    + (k0 && k0.end ? ` · 종료 ${hhmm(new Date(k0.end))}` : (k0 && k0.mins ? ` · 제한 ${k0.mins}분` : ''));
  if (pend) { m.innerHTML = info; return bar(); }
  const k = CFG[c.code];
  if (!k) {                                            // 배분을 서버에서 받아 온다 — 받기 전에는 시작 단추가 잠긴다
    m.innerHTML = info + '<br><span style="color:var(--warn)">시험 설정을 서버에서 받는 중…</span>';
    if (cfgWait !== c.code) {
      cfgWait = c.code;
      loadCfg(c.code).then(() => { cfgWait = null; const cc = unpackCode($('#code').value); if (cc && cc.code === c.code) codeCheck(); });
    }
    return bar();
  }
  if (k.err) {
    m.innerHTML = info + `<br><span style="color:var(--no)">${esc(k.err)}</span> <a class="link" id="cfgRetry">다시 확인</a>`;
    $('#cfgRetry').onclick = () => { delete CFG[c.code]; codeCheck(); };
    return bar();
  }
  if (!k.end) {                                        // 코드는 맞지만 교수님이 아직 「시작」 전 — 몇 초마다 다시 묻고, 시작되면 바로 연다
    m.innerHTML = info + '<br><span style="color:var(--warn)">대기 중 — 교수님이 「시작」을 누르면 바로 시험이 열립니다. 이 화면을 그대로 두세요.</span>'
      + (pledged(c.code) ? '' : '<br><b style="color:var(--no)">아래 「시험 중 지킬 것」에 체크해 두어야 자동으로 열립니다.</b>');
    clearTimeout(startPoll);
    startPoll = setTimeout(async () => {
      const cc = unpackCode($('#code').value); if (!cc || cc.code !== c.code || view !== 'home') return;
      delete CFG[c.code]; await loadCfg(c.code); codeCheck();
      const k2 = CFG[c.code]; if (k2 && k2.end && Date.now() < k2.end && $('#name').value.trim() && pledged(c.code)) start();   // 시작되면 자동으로 연다
    }, 3000);

  }
  m.innerHTML = info; bar();
}
let startPoll = null;
function start() {
  const name = $('#name').value.replace(/^[=+@\s]+/, '').trim(), c = unpackCode($('#code').value);   // 시트에서 수식으로 읽힐 머리 기호는 뗀다(서버도 같은 식)
  if (!name || !c) return; if (window.LEESS && !LEESS.ok(name)) { $('#codeMsg').innerHTML = '<span style="color:var(--warn)">' + LEESS.msg() + '</span>'; $('#name').focus(); window.scrollTo(0, 0); return; } /*LEESS*/
  store.set('name', name); store.set('last', $('#code').value);
  if (!endTime(c.endMin)) return codeCheck();
  const kk = CFG[c.code] || store.get('cfg:' + c.code, null);
  const end = new Date(kk && kk.end ? kk.end : 0);    // 서버가 정한 종료 시각(시작 전이면 0)
  const pend = store.get('pend:' + c.code, null);
  if (pend) {                                          // 보내지 못한 답안이 있으면 먼저 보낸다
    const qs = paperFor(examItems(c.unit, c.seed, pend.cfg || null).items, pend.name || name, c.code);
    cur = { ...c, name: pend.name || name, cfg: pend.cfg || null, n: qs.length, end: end.getTime() || pend.endAt || 0,
            pick: pend.pick || [], leave: pend.leave || 0, qs: qs };
    show('waitEnd'); $('#waitInfo').textContent = '채점 서버로 보내는 중…'; return sendPending();
  }
  const done = store.get('done:' + c.code, null);
  if (done) {                                          // 재응시 차단 — 제출본 결과만 보여준다
    const qs = paperFor(examItems(done.unit, done.seed, done.cfg || null).items, done.name, done.code);
    cur = { ...done, end: end.getTime() || done.endAt || 0, n: qs.length, qs: qs };
    show('waitEnd'); $('#waitInfo').textContent = '제출한 답안을 확인하는 중…'; return fetchResult();
  }
  const k = CFG[c.code];
  if (!k || k.err || !k.end) return codeCheck();       // 배분을 못 받았거나 아직 「시작」 전이면 열지 않는다
  if (Date.now() >= end.getTime()) return codeCheck();

  const saved = store.get('run:' + c.code, null);
  if (!saved && !$('#pledge').checked) return codeCheck();   // 「시험 중 지킬 것」에 체크해야 들어간다
  const qs = paperFor(examItems(c.unit, c.seed, k.cfg).items, name, c.code);
  cur = { ...c, name, cfg: k.cfg, n: qs.length, end: end.getTime(), qs: qs,
          pick: saved && saved.pick && saved.pick.length === qs.length ? saved.pick : Array(qs.length).fill(null),
          leave: saved ? saved.leave || 0 : 0,
          guard: guardOf(k.guard !== undefined && k.guard !== null ? k.guard : (k.cfg ? k.cfg.g : undefined)),
          awayMs: saved ? saved.awayMs || 0 : 0, blip: saved ? saved.blip || 0 : 0, log: saved && saved.log ? saved.log : [],
          soft: saved ? saved.soft || 0 : 0, awaySoft: !!(saved && saved.awaySoft),
          awayAt: saved ? saved.awayAt || 0 : 0, sent: saved ? saved.sent || 0 : 0 };
  // 새로 고침·다시 열기로 돌아왔다: 코드 입력·단추 누르는 시간은 빼고, 나간 시각부터 페이지가 다시 뜬 시각까지만 센다
  if (cur.awayAt && !resumed && cur.awayAt < T0) cur.awayAt = Date.now() - (T0 - cur.awayAt);

}
const saveRun = () => store.set('run:' + cur.code, { pick: cur.pick, leave: cur.leave, awayMs: cur.awayMs, blip: cur.blip,
                                                     log: cur.log, awayAt: cur.awayAt, sent: cur.sent,
                                                     soft: cur.soft, awaySoft: cur.awaySoft });

function paint() {
  const u = D.units.find(x => x.n === cur.unit);
  $('#quizWho').textContent = `Unit ${cur.unit} ${u.title}`;
  $('#quizSub').textContent = `범위 ${rangeLabel(cur.unit)} · ${cur.n}문제 · ${cur.pass}문제 이상 합격`;

    c.append(el('div', 'stem', esc(q.q).replace(/_{3,}/, '<u></u>')));

        [...c.querySelectorAll('label.opt')].forEach((x, j) => x.classList.toggle('pick', j === k));

/* ── 시계: 종료 시각에 전원 자동 제출, 종료 뒤에만 결과 공개 ─────── */
function startTick() {
  clearInterval(tick);
  const upd = () => {
    if (!cur) return clearInterval(tick);
    const left = cur.end - Date.now();
    if (view === 'quiz') {
      const c = $('#clock'); c.textContent = mmss(left); c.classList.toggle('hot', left < 60e3);
      // 시계가 BEAT_GAP 넘게 멈췄다 돌아오면(화면 잠금·앱 전환을 브라우저가 알려 주지 않은 경우) 그 사이를 이탈로 센다
      const now = Date.now();
      if (cur.beat && now - cur.beat > BEAT_GAP && !cur.awayAt && !document.hidden) { cur.awayAt = cur.beat; comeBack(); }
      if (!cur || view !== 'quiz') return;             // 이탈로 자동 제출됐다
      cur.beat = now;
      if (left <= 0) submit('시간 종료');
    } else if (view === 'waitEnd') {
      $('#waitClock').textContent = mmss(left);
      if (left <= 0) { clearInterval(tick); if (!store.get('pend:' + cur.code, null)) fetchResult(); }
    } else clearInterval(tick);
  };
  upd(); tick = setInterval(upd, 250);                  // 첫 화면부터 시계가 보이게 한 번 먼저
}
async function submit(how) {
  clearInterval(tick);
  if (cur.awayAt) awayTally(Date.now() - cur.awayAt);   // 화면 밖에 있는 채로 제출됐다(시간 종료) — 그 이탈도 센다
  uncover(); sleepOk();
  const answers = cur.qs.map((q, i) => ({ id: q.id, pick: cur.pick[i] === null || cur.pick[i] === undefined ? '' : q.opts[cur.pick[i]] }));
  store.set('pend:' + cur.code, { name: cur.name, pick: cur.pick, answers: answers, leave: cur.leave, how: how,
                                  leaveSec: Math.round((cur.awayMs || 0) / 1000), leaveLog: (cur.log || []).join(', '),
                                  unit: cur.unit, seed: cur.seed, endMin: cur.endMin, pass: cur.pass, endAt: cur.end,
                                  n: cur.n, cfg: cur.cfg || null });
  show('waitEnd'); $('#waitInfo').textContent = '채점 서버로 보내는 중…';
  await sendPending();
}
/** 저장해 둔 답안을 서버로 보낸다. 실패하면 답안은 남고 「다시 보내기」가 뜬다. */
async function sendPending() {
  const p = store.get('pend:' + cur.code, null);

  try {
    const res = await post('submit', { code: cur.code, name: p.name, answers: p.answers, leave: p.leave,
                                       leaveSec: p.leaveSec || 0, leaveLog: p.leaveLog || '',
                                       how: p.how, endAt: p.endAt, pass: p.pass });
    store.del('pend:' + cur.code);
    store.set('done:' + cur.code, { code: cur.code, name: p.name, unit: p.unit, seed: p.seed,
                                    endMin: p.endMin, endAt: p.endAt, pass: p.pass, pick: p.pick, leave: p.leave,
                                    n: p.n, cfg: p.cfg || null });
    afterSubmit(res);
  } catch (e) {
    $('#waitInfo').innerHTML = `<span style="color:var(--no)">보내지 못했습니다 — ${esc(e.message)}</span><br>`
      + '답안은 이 기기에 저장되어 있습니다. 연결을 확인하고 「다시 보내기」를 누르세요.';

/** 종료 뒤 서버에서 점수·해설을 받아온다 */
async function fetchResult() {

  } catch (e) {

function afterSubmit(res) {

      + (res.dup ? ' <span style="color:var(--warn)">(이미 제출한 시험입니다)</span>' : '')
      + ` · 종료 예정 ${hhmm(new Date(cur.end))}<br>채점 결과는 교수님께 자동으로 전송되었습니다.`;

}
function showResult(res) {
  const u = D.units.find(x => x.n === cur.unit);
  const marks = new Map(res.marks.map(m => [m.id, m]));
  cur.passed = res.pass;
  const log = store.get('log', []);
  if (!log.some(r => r.code === cur.code)) {
    log.push({ u: cur.unit, score: res.score, n: res.n, pass: res.pass, at: hhmm(new Date()), code: cur.code });
    store.set('log', log.slice(-100));

  $('#scoreCard').className = 'card big ' + (res.pass ? 'pass' : 'fail');
  $('#scoreN').textContent = `${res.score} / ${res.n}`;

    if (t === 'text') {   // 글상자: 글씨 크기 · 글씨 색 · 채움 색(편집 중이면 그 글상자에 바로 적용)
      const fs = ta ? ta.fs : S.fs, col = ta ? ta.col : PEN[S.tc], bg = ta ? ta.bg : BG[S.bg];
      h += `<button type="button" data-a="fs-" aria-label="글씨 작게">가−</button><span class="lb">${Math.round(fs)}</span><button type="button" data-a="fs+" aria-label="글씨 크게">가＋</button>`
        + PEN.map((c, i) => dot(`data-c="${i}" aria-label="글씨 색 ${i + 1}"`, c, c === col, 18)).join('') + '<span class="lb">채움</span>'
        + BG.map((c, i) => i ? dot(`data-b="${i}" aria-label="채움 색 ${i}"`, c, c === bg, 18) : `<button class="d${bg ? '' : ' on'}" type="button" data-b="0" aria-label="채움 없음">∅</button>`).join('')
        + (ta ? '<button type="button" data-a="tdel">삭제</button><button type="button" data-a="tdone">완료</button>' : '');
    }
    const o = b.querySelector('.o'); if (o.innerHTML !== h) o.innerHTML = h;
    b.querySelector('[data-a=undo]').disabled = !undo.length; b.querySelector('[data-a=redo]').disabled = !redo.length;
  }
  function ensureBar() {
    let b = $('#inkBar'); if (b) return b;
    b = document.createElement('div'); b.id = 'inkBar'; b.hidden = true; if (fold) b.className = 'fold';
    b.innerHTML = `<button class="h" type="button" aria-label="필기 도구 접기·펴기">✎</button>${TOOLS.map(([k, n]) => `<button type="button" data-t="${k}">${n}</button>`).join('')}<span class="o"></span><button type="button" data-a="undo" aria-label="되돌리기">↩</button><button type="button" data-a="redo" aria-label="다시 실행">↪</button><button type="button" data-a="pad">＋여백</button><span id="inkSt">${HINT}</span>`;
    document.body.appendChild(b); paintBar();
    b.addEventListener('mousedown', e => e.preventDefault());   // 막대를 눌러도 편집 중인 글상자가 닫히지 않게
    b.addEventListener('click', e => {
      const x = e.target.closest('button'); if (!x) return; const d = x.dataset;
      if (x.classList.contains('h')) { fold = !fold; b.classList.toggle('fold', fold); try { localStorage.setItem('inkFold', fold ? '1' : '0'); } catch (x1) {} bar(barWant); return; }
      if (d.t) { if (ta) closeText(); if (d.t !== 'lasso') clearSel(); S.tool = d.t; if (d.t !== 'erase') prevTool = d.t; status(d.t === 'lasso' ? '묶을 곳을 둘러 그리세요' : d.t === 'text' ? '글 쓸 자리를 펜으로 누르세요' : ''); }
      else if (d.c) { if (ta || S.tool === 'text') { S.tc = +d.c; if (ta) { ta.col = PEN[S.tc]; styleTa(); } } else if (S.tool === 'lasso') { selAction('col', PEN[+d.c]); return; } else if (S.tool === 'hl') S.hl = +d.c; else S.pen = +d.c; }
      else if (d.b) { S.bg = +d.b; if (ta) { ta.bg = BG[S.bg]; styleTa(); } }
      else if (d.s) S.size[S.tool] = +d.s;
      else if (d.a === 'fs-' || d.a === 'fs+') { const v = Math.max(10, Math.min(64, Math.round(ta ? ta.fs : S.fs) + (d.a === 'fs+' ? 2 : -2))); S.fs = v; if (ta) { ta.fs = v; styleTa(); } }
      else if (d.a === 'tdel') { if (ta) { ta.el.value = ''; closeText(); } return; }
      else if (d.a === 'tdone') return closeText();
      else if (d.a === 'whole') S.whole = !S.whole;
      else if (d.a === 'scr') S.scr = !S.scr;
      else if (d.a === 'z1') { setZoom(1); return; }
      else if (d.a === 'undo') return step(undo, redo, 'before');
      else if (d.a === 'redo') return step(redo, undo, 'after');
      else if (d.a === 'del' || d.a === 'dup') return selAction(d.a);
      else if (d.a === 'pad') { const c = last && all.has(last) ? last : null; if (!c || c.kind === 'img') { status(c ? '쪽 그림에는 여백을 넣을 수 없습니다' : '여백을 넣을 곳에 먼저 펜을 대세요'); return; } c.q.pad = (c.q.pad || 0) + PAD; ensurePad(c); paint(c); host.save(c); c.pad.scrollIntoView({block: 'nearest', behavior: 'smooth'}); return; }
      keep(); paintBar(); if (ta) ta.el.focus();
    });
    return b;
  }

  return {
    ver: 2, init(h) { host = h; }, mount, unmount, setRecord, bar, status,
    repaint(c) { paint(c); if (sel && sel.c === c) drawSel(); }, refit(c) { fit(c); paint(c); },
    reset() { if (act) discard(); if (pin) pinchEnd(); closeText(); clearSel(); undo = []; redo = []; last = null; if (Z !== 1) { Z = 1; ZU.forEach(el => zoomEl(el)); afterZoom(); } paintBar(); },
    busy: () => !!act || !!pin, cancel() { if (act) discard(); }, cards: () => all.size,
    valid: s => s && (s.t ? typeof s.txt === 'string' && Array.isArray(s.p) : Array.isArray(s.p) && s.p.every(Number.isFinite)),
    pencil, zoom: () => Z, setZoom, zoomSync,   // 2판: 빠른 도구 바꾸기 · 엔진 확대
  };
})();

/* 범용 필기 연결 2판(inkpage2.js, 2026-11-13 — inkpage.js + 확대 묶음 units) — ink2.js 엔진을 시험앱 전용 필기(inknote.js)를 끼울 수 없는 모든 화면에 붙인다:
   교재·지문분석(article), EBS·수업관리 시험(#qs), 워크북(#stepBox·#exs), 교사용 교재(.page 쪽 그림), 최종정리(#root).
   화면 코드는 고치지 않고 body 변화를 보고 스스로 붙는다. 저장은 기기 IndexedDB(획만). 글 카드는 내용 해시로, 쪽 그림은 쪽 번호로, 교재 지문은 id로 찾는다.
   휴대폰(640 이하)과 넓은 화면은 글 배치가 달라 따로 저장. */
(() => {
  if (window.BOOKNOTE || document.getElementById('noteJs') || typeof INK === 'undefined') return;   // 시험앱 전용 필기가 있으면 그쪽이 맡는다
  const DBN = 'exnote', ST = 'rounds', OLD = 200 * 864e5, $ = s => document.querySelector(s);
  let salt0 = ''; try { if (typeof D !== 'undefined' && D && D.salt) salt0 = String(D.salt); } catch (e) {}
  const BOOK = new URLSearchParams(location.search).get('b') || '';
  const SALT = 'book:' + (salt0 || location.pathname.replace(/[^/]*$/, '')), PAGE = (location.pathname.split('/').pop() || 'guide').replace(/\.html$/, ''), NARROW = matchMedia('(max-width:640px)');

  /* ── 저장소 ── */
  let dbp = null;
  const open = () => dbp || (dbp = new Promise((ok, no) => {
    const r = indexedDB.open(DBN, 1);
    r.onupgradeneeded = () => r.result.createObjectStore(ST, {keyPath: 'id'}).createIndex('salt', 'salt');
    r.onsuccess = () => ok(r.result); r.onerror = () => no(r.error);
  }));
  async function tx(mode, f) { const d = await open(); return new Promise((ok, no) => { const t = d.transaction(ST, mode), rq = f(t.objectStore(ST)); let out; if (rq) rq.onsuccess = () => { out = rq.result; }; t.oncomplete = () => ok(out); t.onerror = t.onabort = () => no(t.error); }); }
  const recs = new Map(), dirty = new Set();
  async function load() {
    try {
      const all = await tx('readonly', s => s.index('salt').getAll(SALT)), now = Date.now(), old = [];
      all.forEach(r => { if (r.at && now - r.at > OLD) old.push(r.id); else recs.set(r.id, r); });
      if (old.length) tx('readwrite', s => { old.forEach(id => s.delete(id)); }).catch(() => {});   // 200일 넘게 손대지 않은 필기는 치운다
    } catch (e) {}
  }
  let cards = new Map(), cand = new Map(), timer = 0, stimer = 0;
  async function flush() {
    clearTimeout(timer); timer = 0; const list = [...dirty]; dirty.clear();
    try { for (const q of list) { await tx('readwrite', s => q.s.length ? s.put(q) : s.delete(q.id)); } if (list.length) INK.status('저장됨'); }
    catch (e) { INK.status('저장 실패'); }
  }
  function save(q) { dirty.add(q); q.at = Date.now(); if (q.s.length) recs.set(q.id, q); else recs.delete(q.id); INK.status('저장 중…'); clearTimeout(timer); timer = setTimeout(flush, 1000); }
  addEventListener('pagehide', flush);
  document.addEventListener('visibilitychange', () => { if (document.hidden) flush(); });

  /* ── 어디에 붙나 ── */
  const SKIP = '.top,.bot,.panel,nav,header,footer,script,style,svg,[hidden],.ink-x,.ink-pad', INKSEL = '.ink-l,.ink-x,.ink-pad,#inkBar,#inkTop,#inkLive';
  function candidates() {
    const out = new Map(), add = (els, kind) => { for (const el of els) if (el.nodeType === 1 && !out.has(el)) out.set(el, kind); };
    const qs = $('#qs'); if (qs) add(qs.children, 'text');
    const exs = $('#exs'); if (exs) add(exs.children, 'text');
    const sb = $('#stepBox'); if (sb && [...sb.children].some(x => !x.matches(INKSEL))) add([sb], 'text');
    const app = $('#app');
    if (app) {
      const arts = app.querySelectorAll('main > article');
      if (arts.length) add(arts, 'book');
      else { const pg = app.querySelectorAll('.page'); if (pg.length) add(pg, 'img'); else add(kids(app), 'text'); }
    }
    const root = $('#root'); if (root) add(kids(root), 'text');
    const view = $('#view') || $('#main'); if (view && !app && !root) add(kids(view), 'text');   // 11-10 통합앱·선생님 앱·학습 현황·일정표(목록·현황 화면)에도 필기
    add(document.querySelectorAll('.ink-page'), 'img');   // 11-11 시험보기·원문 보기: #app 밖 보기 창의 PDF 쪽 그림(쪽마다 data-p)
    add(document.querySelectorAll('.ink-text'), 'text');   // 11-12 시험보기: #app 밖 보기 창의 글 지문(쪽 그림이 없는 지문)에도 필기
    add(document.querySelectorAll('.gc-month'), 'text');   // 11-10 일정표 달력: 달 블록 하나 = 카드 하나(학생·달로 저장)
    return out;
  }
  // 뿌리의 자식 가운데 필기 카드가 될 것 — 달력(.gc-month)을 품은 칸은 통째로 붙이지 않고 그 안의 .card만(달력은 달 블록으로 따로)
  const kids = root => { const out = []; for (const x of root.children) { if (x.nodeType !== 1 || x.matches(SKIP)) continue; if (x.querySelector('.gc-month')) { for (const c of x.querySelectorAll('.card')) if (!c.querySelector('.gc-month') && !c.closest('.gc-wrap')) out.push(c); } else out.push(x); } return out; };
  const vis = el => el.getClientRects().length > 0;
  function norm(el) {   // 카드의 내용 지문(指紋): 그림·음원 파일 이름 + 글자(빈칸에 쓴 답·글상자는 들어가지 않는다)
    let t = ''; el.querySelectorAll('[data-enc],img[src]').forEach(i => { const k = i.dataset.enc || i.getAttribute('src') || ''; if (k && !/^(blob|data):/.test(k)) t += k + '|'; });
    return t + (el.textContent || '').replace(/\s+/g, ' ').trim();
  }
  function hash(s) { let a = 2166136261, b = 5381; for (let i = 0; i < s.length; i++) { const c = s.charCodeAt(i); a = Math.imul(a ^ c, 16777619); b = (Math.imul(b, 33) + c) | 0; } return (a >>> 0).toString(36) + (b >>> 0).toString(36); }
  const sigs = new WeakMap();
  function ident(el, kind) {   // {id, …} — 글 카드는 내용이 그대로면 다시 계산하지 않는다
    if (kind === 'book') return {id: `${SALT}:${PAGE}:${(location.hash.match(/^#g(\d+)/) || [])[1]}:${el.id}:${NARROW.matches ? 'm' : 'w'}`};
    if (kind === 'img') return {id: `${SALT}:${PAGE}:${BOOK}:p${el.dataset.p || new URLSearchParams(location.search).get('p') || 1}`};
    if (el.classList.contains('gc-month')) return {id: `${SALT}:${PAGE}:cal:${(el.closest('.gc-wrap') || {dataset: {}}).dataset.ink || ''}:${el.id}`};   // 일정표: 학생·달로 고정(내용이 바뀌어도 같은 카드)
    const sig = (el.textContent || '').length + '/' + el.querySelectorAll('[data-enc],img[src]').length, old = sigs.get(el);
    if (old && old.sig === sig) return old;
    // head = 첫머리(「3. 주제」처럼 번호+유형 두 글자, 번호가 없으면 24자), probes = 본문 가운데 두 토막. 채점으로 해설·정오 표시가 덧붙어도 토막은 남는다 → 같은 카드로 본다
    const n = norm(el), L = n.length, v = {sig, n, id: `${SALT}:${PAGE}:t:${hash(n)}:${NARROW.matches ? 'm' : 'w'}`, head: (n.match(/^\d+\s*[.)]\s*\S{0,2}/) || [n.slice(0, 24)])[0], probes: [n.substr(L / 3 | 0, 40), n.substr(2 * L / 3 | 0, 40)]};
    sigs.set(el, v); return v;
  }
  const same = (c, v) => c.probes.some(p => v.n.includes(p));
  const blank = (id, kind) => ({id, salt: SALT, page: PAGE, kind, w: 0, s: []});
  const tag = (c, v) => { c.sig = v.sig; c.head = v.head || ''; c.probes = v.probes || ['']; c.len = v.n ? v.n.length : 0; return c; };
  function mount(el, kind, q, v) { const c = tag(INK.mount(el, kind, q), v); cards.set(el, c); return c; }
  function unmount(c) { INK.unmount(c); cards.delete(c.el); }

  function sync() {
    stimer = 0; cand = candidates(); const gone = [];   // 같은 문항이 새로 그려지면(채점 뒤 다시 그리기) 필기를 넘겨준다
    for (const [el, c] of [...cards]) {
      if (cand.has(el) && el.isConnected && c.svg.parentNode === el) continue;
      if (c.kind === 'text' && c.q.s.length && c.len >= 40) gone.push(c);
      unmount(c);
    }
    let any = false;
    for (const [el, kind] of cand) {
      if (!any && vis(el)) any = true;
      const c = cards.get(el), v = ident(el, kind);
      if (c) {
        if (INK.busy()) continue;
        if (kind === 'img') { if (v.id !== c.q.id) INK.setRecord(c, recs.get(v.id) || blank(v.id, kind)); }
        else if (kind === 'text' && v.sig !== c.sig) { const keepIt = same(c, v); if (keepIt) c.sig = v.sig; else { INK.setRecord(c, recs.get(v.id) || blank(v.id, kind)); tag(c, v); } }   // 카드는 그대로인데 속 내용이 통째로 바뀐 경우
        continue;
      }
      let q = recs.get(v.id);
      if (!q && kind === 'text') { const g = gone.find(g => g.head === v.head && g.q.id !== v.id && g.probes.every(p => v.n.includes(p))); if (g) { q = {...g.q, id: v.id, s: g.q.s.map(s => ({...s, p: s.p.slice()}))}; save(q); } }
      if (q) mount(el, kind, q, v);
    }
    INK.bar(any);
  }
  const schedule = () => { if (!stimer) stimer = setTimeout(sync, 60); };
  const ours = n => n.nodeType === 1 && n.matches && n.matches(INKSEL);
  const mine = m => {
    const t = m.target.nodeType === 1 ? m.target : m.target.parentElement; if (t && t.closest(INKSEL)) return true;
    if (m.type === 'childList') { const ns = [...m.addedNodes, ...m.removedNodes]; return ns.length > 0 && ns.every(ours); }
    return false;
  };
  new MutationObserver(ms => { if (!ms.every(mine)) schedule(); }).observe(document.body, {childList: true, subtree: true, attributes: true, attributeFilter: ['hidden', 'src']});
  addEventListener('hashchange', schedule); addEventListener('popstate', schedule);
  NARROW.addEventListener('change', async () => { await flush(); [...cards.values()].forEach(unmount); sync(); INK.status('이 방향에서 쓴 필기만 보입니다'); });

  INK.init({
    save: c => save(c.q), onPen: schedule,
    units() {   // 엔진이 두 손가락 확대로 키울 묶음(2판): 문항 목록(#qs·#exs)은 통째로, 그 밖은 카드 하나씩. 목록·현황·달력 화면은 묶음을 주지 않는다(= 브라우저 확대 그대로)
      const out = new Set();
      for (const [el] of cand) {
        if (!el.isConnected || !vis(el)) continue;
        if (!el.matches('.ink-page,.ink-text') && (el.classList.contains('gc-month') || el.closest('#view,#main'))) continue;
        const p = el.parentElement; out.add(p && (p.id === 'qs' || p.id === 'exs') ? p : el);
      }
      return [...out];
    },
    cardAt(t) {   // 펜이 닿은 자리의 카드 — 필기가 없던 카드는 이때 필기층을 만든다
      cand = candidates(); let el = null; for (let n = t; n && n !== document.body; n = n.parentElement) if (cand.has(n)) { el = n; break; }
      if (!el) return null;
      let c = cards.get(el); if (c && c.svg.parentNode !== el) { unmount(c); c = null; }
      if (!c) { const kind = cand.get(el), v = ident(el, kind); c = mount(el, kind, recs.get(v.id) || blank(v.id, kind), v); }
      return c;
    },
  });
  window.BOOKNOTE = {dump: () => tx('readonly', s => s.index('salt').getAll(SALT)), cards: () => cards.size};
  load().then(sync);
})();
</script>
