<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>YBM 토익 550+ 변형문제 시험</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Newsreader:opsz,wght@6..72,400;6..72,600&family=Noto+Sans+KR:wght@400;600;800&display=swap">
<style>

:root{--bg:#f5f5f2;--card:#fff;--ink:#1c1d21;--sub:#686a72;--line:#e1e0da;--acc:#2f5bd3;--acc2:#e8eefc;--ok:#1f8a4c;--okbg:#e5f4ea;--ng:#c8372d;--ngbg:#fbe9e7;--box:#f0efe9}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#141416;--card:#1f1f23;--ink:#ececef;--sub:#9a9aa2;--line:#33333a;--acc:#7c9cff;--acc2:#252d45;--ok:#5cc98a;--okbg:#17301f;--ng:#ff7b70;--ngbg:#3a1d1b;--box:#29292e}}
:root[data-theme="dark"]{--bg:#141416;--card:#1f1f23;--ink:#ececef;--sub:#9a9aa2;--line:#33333a;--acc:#7c9cff;--acc2:#252d45;--ok:#5cc98a;--okbg:#17301f;--ng:#ff7b70;--ngbg:#3a1d1b;--box:#29292e}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.6 "Noto Sans KR",-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Malgun Gothic",sans-serif}
button:focus-visible,.opt:focus-within,input:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
.wrap{max-width:780px;margin:0 auto;padding:20px 16px 80px}
.brand{margin:0 0 16px;background:#73d5ff;border-radius:14px;padding:8px 12px;box-shadow:0 2px 10px rgba(0,0,0,.10);color-scheme:light}
.brand img{display:block;width:100%;max-width:520px;height:auto;margin:0 auto;border-radius:6px}
header{display:flex;align-items:baseline;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:18px}
h1{font-size:22px;margin:0;letter-spacing:-.3px;text-wrap:balance}
h1 small{display:block;font-size:13px;color:var(--sub);font-weight:500}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:18px;margin-bottom:14px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
input[type=text]{font:inherit;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--ink);min-width:0}
#name{flex:1;min-width:160px}
button{font:inherit;border:0;border-radius:10px;padding:11px 18px;cursor:pointer;background:var(--acc);color:#fff;font-weight:600}
button.ghost{background:transparent;color:var(--acc);border:1px solid var(--line)}
button:disabled{opacity:.4;cursor:default}
.muted{color:var(--sub);font-size:14px}
.grp{border-top:1px solid var(--line);padding-top:12px;margin-top:12px}
.grp:first-of-type{border-top:0;margin-top:4px;padding-top:0}
.grphead{display:flex;justify-content:space-between;align-items:center;gap:8px}
.grphead b{font-size:15px}
.grphead button{padding:5px 12px;font-size:13px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(58px,1fr));gap:6px;margin-top:8px}
.grid button{padding:8px 0;font-size:13px;font-weight:500;background:var(--bg);color:var(--ink);border:1px solid var(--line);font-variant-numeric:tabular-nums}
.grid button.pass{border-color:var(--ok);color:var(--ok)}
.grid button.on{background:var(--acc);color:#fff;border-color:var(--acc)}
.selbar{position:sticky;bottom:0;padding:12px 0 4px;background:linear-gradient(transparent,var(--bg) 25%)}
.selbar .card{margin:0;display:grid;gap:8px}
.meta{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;margin-bottom:12px}
.pill{display:inline-block;font-size:12px;font-weight:700;padding:2px 9px;border-radius:99px;background:var(--acc2);color:var(--acc);margin-right:6px;white-space:nowrap}
.src{font-size:12px;font-weight:600;color:var(--sub);margin-right:6px}
.q h3{font-size:16px;margin:0 0 10px;font-weight:600;line-height:1.5}
.passage,.given,.sbox,.chunk{font-family:"Newsreader",Georgia,"Times New Roman",serif;font-size:17px;line-height:1.7}
.passage{background:var(--box);border-radius:10px;padding:12px 14px;margin:0 0 12px}
.passage p{margin:0 0 10px}.passage p:last-child{margin:0}
.given{border:1.5px solid var(--ink);border-radius:8px;padding:10px 12px;margin:0 0 10px}
.sbox{border:1.5px solid var(--ink);border-radius:8px;padding:10px 12px;margin:0 0 12px}
u{text-decoration-thickness:1.5px;text-underline-offset:3px}
.nemo{white-space:nowrap;border:1.5px solid var(--ink);border-radius:4px;padding:0 4px}
.opts{display:flex;flex-direction:column;gap:7px}
.opt{display:flex;gap:10px;align-items:flex-start;border:1px solid var(--line);border-radius:10px;padding:10px 12px;cursor:pointer}
.opt input{margin-top:6px}
.opt.en{font-family:"Newsreader",Georgia,serif;font-size:16.5px}
.opt.sel{border-color:var(--acc);background:var(--acc2)}
.opt.right{border-color:var(--ok);background:var(--okbg)}
.opt.wrong{border-color:var(--ng);background:var(--ngbg)}
.subq{margin-top:14px}
.subq h4{font-size:15px;margin:0 0 8px;font-weight:600}
.saline{display:grid;gap:6px;margin-bottom:12px}
.saline .prompt{font-family:"Newsreader",Georgia,serif;font-size:16.5px}
.saline input{width:100%}
.saline input.right{border-color:var(--ok);background:var(--okbg)}
.saline input.wrong{border-color:var(--ng);background:var(--ngbg)}
.pick{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:8px}
.pick .lab{font-weight:600;min-width:34px}
.pick .opt{padding:7px 12px}
.mark{font-weight:800;margin-left:6px}.mark.o{color:var(--ok)}.mark.x{color:var(--ng)}
.ex{white-space:pre-line;margin-top:10px;font-size:14px;padding:10px 12px;border-left:3px solid var(--acc);background:var(--acc2);border-radius:0 8px 8px 0}
.banner{text-align:center;padding:24px 16px}
.banner .big{font-size:40px;font-weight:800;letter-spacing:2px}
.banner.pass{background:var(--okbg);border-color:var(--ok)}.banner.pass .big{color:var(--ok)}
.banner.fail{background:var(--ngbg);border-color:var(--ng)}.banner.fail .big{color:var(--ng)}
.banner.score{background:var(--acc2);border-color:var(--acc)}.banner.score .big{color:var(--acc)}
.pts{font-size:12px;font-weight:700;color:var(--sub);margin-left:4px;white-space:nowrap}
.bottom{position:sticky;bottom:0;padding:12px 0;background:linear-gradient(transparent,var(--bg) 30%)}
.bottom button{width:100%;padding:14px;font-size:17px}
textarea{display:block;width:100%;font:inherit;font-size:15px;line-height:1.55;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--ink);resize:vertical;margin:8px 0}
.cert{margin-top:18px;text-align:left}
.tablewrap{overflow-x:auto;margin-top:10px}
table{border-collapse:collapse;width:100%;font-size:14px;font-variant-numeric:tabular-nums}
th,td{text-align:left;padding:8px 10px;border-bottom:1px solid var(--line);white-space:nowrap;vertical-align:top}
td.wrap{white-space:normal;min-width:180px}
th{font-size:12px;color:var(--sub);font-weight:600;letter-spacing:.03em}
td button{padding:4px 10px;font-size:13px}
.okc{color:var(--ok);font-weight:700}.ngc{color:var(--ng);font-weight:700}
.h2{font-size:18px;margin:0}
.mycert{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:9px 0;border-top:1px solid var(--line)}
.mycert button{padding:6px 12px;font-size:14px}
.logrow{border-top:1px solid var(--line);padding:9px 0}
.logrow summary{cursor:pointer;font-variant-numeric:tabular-nums}
.logrow summary span{margin-right:8px}
.wr{margin:10px 0 0;padding:10px 12px;background:var(--bg);border-radius:10px;font-size:14px;display:grid;gap:4px}
.teacherlink{text-align:center;margin:18px 0 0}
.chunk{border-top:1px dashed var(--line);padding:6px 2px}.cl{font-weight:700}
.sumbox,.kobox{border:1.5px solid var(--ink);border-radius:8px;padding:10px 12px;margin:8px 0 12px;font-family:"Newsreader",Georgia,serif;font-size:16.5px;line-height:1.65}
.kobox{font-family:inherit;font-size:15px;border-width:1px;border-left:3px solid var(--acc)}
.cond,.gw{border:1px dashed var(--sub);border-radius:8px;padding:8px 12px;margin:8px 0;font-size:14px;line-height:1.6}
.cond ol,.cond ul{margin:4px 0 0 18px;padding:0}.gwl{font-weight:700;color:var(--acc)}
.passage p.bul{padding-left:12px;text-indent:-12px}
u.ul2{font-weight:600}.vb{border-bottom:1.5px solid var(--ink);font-weight:600;white-space:nowrap}
.slot{font-weight:800;color:var(--ng);padding:0 2px}
.datatbl{border-collapse:collapse;width:100%;font-size:13px;margin:0 0 10px;font-family:inherit}
.datatbl caption{font-weight:700;text-align:left;margin-bottom:4px}
.datatbl th,.datatbl td{border:1px solid var(--sub);padding:2px 4px;text-align:center;white-space:normal;font-size:12px}
.hint{color:#64748b;font-size:.92em}
.notice{border:1.5px solid var(--acc);background:var(--acc2);border-radius:12px;padding:12px 14px;margin-bottom:14px;font-size:14px;line-height:1.55}
select{font:inherit;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--ink);flex:1;min-width:160px}
@media (prefers-reduced-motion:reduce){*{scroll-behavior:auto!important}}
[hidden]{display:none!important}

.units{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px;margin-top:10px}
.units button{padding:10px 10px;font-size:14px;font-weight:600;background:var(--bg);color:var(--ink);border:1px solid var(--line);text-align:left;line-height:1.35}
.units button .n{display:block;font-size:12px;font-weight:500;color:var(--sub);margin-top:3px}
.units button.on{background:var(--acc);color:#fff;border-color:var(--acc)}.units button.on .n{color:#e5ecff}
.units button.done{border-color:var(--ok)}
.notice{border:1.5px solid var(--acc);background:var(--acc2);border-radius:12px;padding:12px 14px;margin-bottom:14px;font-size:14px;line-height:1.6}
.stem{font-family:"Newsreader",Georgia,"Times New Roman",serif;font-size:17.5px;line-height:1.7;background:var(--box);border-radius:10px;padding:12px 14px;margin:0 0 12px}
.stem b{text-decoration:underline;text-underline-offset:4px}
.log{font-size:14px;display:grid;gap:4px}
.log .ok{color:var(--ok);font-weight:700}.log .ng{color:var(--ng);font-weight:700}
textarea{width:100%;font:13px/1.5 ui-monospace,Menlo,monospace;padding:10px;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--ink);min-height:90px}
a.ghost{display:inline-block;font-size:14px;color:var(--acc);border:1px solid var(--line);border-radius:10px;padding:8px 14px;text-decoration:none;font-weight:600}
</style>
</head>

const D = {"title": "YBM 토익 550+ 변형문제 시험", "sub": "ETS 토익 단기공략 550+ (2026) Unit 01~11 · 비전대학교 토익", "salt": "ybm550-p56-2026", "per": 5, "units": [{"id": "U01", "name": "U01 문장의 구성 요소", "items": [{"id": "U01-D01", "stem": "Please note that _______ for the annual leadership retreat must be submitted to the human resources office by Friday.", "ch": ["Register", "Registered", "Registration", "Registrant"], "a": 2, "ex": "해석  연례 리더십 수련회 등록 신청은 금요일까지 인사부 사무실에 제출되어야 한다는 점에 유의하십시오.\n해설  that절 안에서 동사 must be submitted 앞은 주어 자리이므로 빈칸에는 명사가 와야 한다. '등록 신청이 제출되어야 한다'는 뜻이므로 행위 명사 (C) Registration이 정답. (A) Register는 동사, (B) Registered는 과거형·과거분사로 주어가 될 수 없고, (D) Registrant는 사람 명사라 관사 없이 단수로 쓸 수 없다.", "point": "주어 자리 명사"}, {"id": "U01-D02", "stem": "The _______ of the new parking policy will take effect on the first day of next month.", "ch": ["implement", "implementation", "implemented", "implements"], "a": 1, "ex": "해석  새 주차 정책의 시행은 다음 달 첫날부터 효력이 발생한다.\n해설  관사 The와 전치사 of 사이는 명사 자리이며, 이 명사구가 동사 will take의 주어가 된다. 따라서 (B) implementation이 정답. (A) implement·(D) implements는 동사, (C) implemented는 과거형·과거분사로 관사 뒤 주어 자리에 올 수 없다.", "point": "주어 자리 명사(관사+명사+of)"}, {"id": "U01-D03", "stem": "During the planning meeting, _______ from several department heads helped the committee finalize the training schedule.", "ch": ["Suggestions", "Suggest", "Suggested", "Suggestive"], "a": 0, "ex": "해석  기획 회의 중에 여러 부서장들의 제안이 위원회가 교육 일정을 확정하는 데 도움이 되었다.\n해설  콤마 뒤 주어 자리이고 동사 helped가 뒤에 있으므로 명사가 필요하다. 따라서 (A) Suggestions가 정답. (B) Suggest는 동사원형, (C) Suggested는 과거형·과거분사, (D) Suggestive는 형용사로 모두 주어가 될 수 없다.", "point": "주어 자리 명사"}, {"id": "U01-D04", "stem": "Our _______ to product quality has earned Larkin Foods a loyal customer base over the past decade.", "ch": ["commit", "commitment", "committed", "commits"], "a": 1, "ex": "해석  제품 품질에 대한 우리의 헌신은 지난 10년 동안 라킨 푸드에 충성도 높은 고객층을 안겨 주었다.\n해설  소유격 Our 뒤이자 동사 has earned 앞 주어 자리이므로 명사가 와야 한다. 따라서 (B) commitment가 정답. (A) commit·(D) commits는 동사, (C) committed는 과거형·과거분사로 소유격 뒤 주어 자리에 쓸 수 없다.", "point": "주어 자리 명사(소유격 뒤)"}, {"id": "U01-D05", "stem": "For the accounting assistant, _______ the quarterly financial reports on time is one of the most important duties.", "ch": ["Prepare", "Prepared", "Preparation", "Preparing"], "a": 3, "ex": "해석  회계 보조원에게 분기별 재무 보고서를 제때 준비하는 것은 가장 중요한 업무 중 하나이다.\n해설  콤마 뒤부터 동사 is 앞까지가 주어이므로, 빈칸에는 목적어 the quarterly financial reports를 이끌면서 주어 역할을 하는 동명사가 필요하다. 따라서 (D) Preparing이 정답. (C) Preparation은 명사지만 뒤에 목적어를 바로 취할 수 없고, (A) Prepare·(B) Prepared는 동사 형태라 주어가 될 수 없다.", "point": "주어 자리 동명사구"}, {"id": "U01-D06", "stem": "The _______ of Delmar Logistics announced plans to open a second distribution center in Ohio next spring.", "ch": ["preside", "presidential", "president", "presides"], "a": 2, "ex": "해석  델마 로지스틱스의 사장은 내년 봄 오하이오에 두 번째 물류 센터를 열 계획을 발표했다.\n해설  관사 The 뒤, 전치사 of 앞은 명사 자리이고 이 명사가 동사 announced의 주어다. 따라서 사람 명사 (C) president가 정답. (A) preside·(D) presides는 동사, (B) presidential은 형용사로 관사 뒤에 단독으로 올 수 없다.", "point": "주어 자리 명사(사람 명사)"}, {"id": "U01-D07", "stem": "According to the survey results, _______ with the new scheduling software has improved among part-time staff.", "ch": ["satisfy", "satisfied", "satisfying", "satisfaction"], "a": 3, "ex": "해석  설문 조사 결과에 따르면, 새 일정 관리 소프트웨어에 대한 만족도가 시간제 직원들 사이에서 높아졌다.\n해설  콤마 뒤 동사 has improved 앞이 주어 자리이므로 명사가 와야 하며, 뒤의 전치사 with와 어울리는 (D) satisfaction이 정답. (A) satisfy는 동사, (B) satisfied는 과거분사·형용사, (C) satisfying은 분사·동명사로 with를 바로 이끄는 주어가 될 수 없다.", "point": "주어 자리 명사"}, {"id": "U01-D08", "stem": "Every morning, the night-shift supervisor _______ a brief summary of any equipment problems to the plant manager.", "ch": ["sends", "sender", "sending", "to send"], "a": 0, "ex": "해석  매일 아침 야간 근무 감독관은 장비 문제에 대한 간단한 요약을 공장장에게 보낸다.\n해설  주어 the night-shift supervisor 뒤에 본동사가 없으므로 빈칸은 동사 자리이며, 뒤에 목적어 a brief summary가 있다. 따라서 (A) sends가 정답. (B) sender는 명사, (C) sending과 (D) to send는 본동사가 될 수 없다.", "point": "동사 자리(본동사)"}, {"id": "U01-D09", "stem": "Bramwell Textiles _______ its fabric samples to overseas buyers at no additional charge.", "ch": ["shipment", "shipping", "ships", "to ship"], "a": 2, "ex": "해석  브램웰 텍스타일은 추가 비용 없이 원단 샘플을 해외 구매자에게 발송한다.\n해설  회사명 주어 Bramwell Textiles 뒤에 본동사가 없으므로 빈칸은 동사 자리이고, 회사명은 단수 취급하므로 (C) ships가 정답. (A) shipment는 명사, (B) shipping과 (D) to ship은 -ing형·to부정사라 본동사가 될 수 없다.", "point": "동사 자리(회사명 주어)"}, {"id": "U01-D10", "stem": "The maintenance crew _______ the elevators in the east wing during the last week of every month.", "ch": ["inspecting", "inspector", "inspection", "inspects"], "a": 3, "ex": "해석  유지 보수팀은 매달 마지막 주에 동관의 엘리베이터를 점검한다.\n해설  주어 The maintenance crew 뒤에 동사가 없고 뒤에 목적어 the elevators가 있으므로 빈칸은 본동사 자리다. 따라서 (D) inspects가 정답. (A) inspecting은 -ing형이라 홀로 본동사가 될 수 없고, (B) inspector·(C) inspection은 명사다.", "point": "동사 자리(본동사)"}, {"id": "U01-D11", "stem": "Under the revised contract, Novara Catering _______ meals for all three of the company's regional offices.", "ch": ["provision", "provider", "provides", "providing"], "a": 2, "ex": "해석  개정된 계약에 따라 노바라 케이터링은 회사의 세 지역 사무소 모두에 식사를 제공한다.\n해설  주어 Novara Catering 뒤에 본동사가 없으므로 동사 자리이며, 목적어 meals가 이어진다. 따라서 (C) provides가 정답. (A) provision·(B) provider는 명사, (D) providing은 -ing형이라 홀로 본동사가 될 수 없다.", "point": "동사 자리(-ing는 본동사 불가)"}, {"id": "U01-D12", "stem": "All visitors must _______ a temporary badge from the security desk before entering the research laboratory.", "ch": ["obtain", "obtaining", "obtained", "obtains"], "a": 0, "ex": "해석  모든 방문객은 연구실에 들어가기 전에 보안 데스크에서 임시 출입증을 받아야 한다.\n해설  조동사 must 뒤에는 반드시 동사원형이 온다. 따라서 (A) obtain이 정답. (B) obtaining·(C) obtained·(D) obtains는 모두 동사원형이 아니므로 조동사 뒤에 올 수 없다.", "point": "조동사 뒤 동사원형"}, {"id": "U01-D13", "stem": "The regional manager _______ the sales figures with each store owner during her visit last Tuesday.", "ch": ["reviewer", "reviewing", "to review", "reviewed"], "a": 3, "ex": "해석  지역 관리자는 지난 화요일 방문 중에 각 매장 주인과 매출 수치를 검토했다.\n해설  주어 The regional manager 뒤에 본동사가 없으므로 빈칸은 동사 자리이고, 목적어 the sales figures가 이어진다. 따라서 과거 동사 (D) re m.", "ch": ["agree", "agreement", "agreeable", "agreeably"], "a": 1, "ex": "해석  임대 계약서에 서명하기 전에 세입자는 양식 뒷면에 인쇄된 계약 조건을 주의 깊게 읽어야 한다.\n해설  타동사 read의 목적어 자리이며 관사 the 뒤이므로 명사가 와야 한다. 따라서 (B) agreement가 정답. (A) agree는 동사, (C) agreeable은 형용사, (D) agreeably는 부사로 관사 뒤 목적어 자리에 올 수 없다.", "point": "타동사 뒤 목적어 명사"}, {"id": "U01-D19", "stem": "Mr. Delgado is responsible for _______ the monthly budget reports to the finance director.", "ch": ["submit", "submitting", "submission", "to submit"], "a": 1, "ex": "해석  델가도 씨는 월간 예산 보고서를 재무 이사에게 제출하는 일을 담당한다.\n해설  전치사 for 뒤이면서 목적어 the monthly budget reports를 취해야 하므로 동명사가 필요하다. 따라서 (B) submitting이 정답. (D) to submit은 전치사 뒤에 올 수 없고, (C) submission은 명사라 뒤에 목적어를 바로 취할 수 없으며, (A) submit은 동사원형이다.", "point": "전치사 뒤 동명사 목적어"}, {"id": "U01-D20", "stem": "Thank you for _______ the Bexley Hotel for your stay during the regional trade conference.", "ch": ["choose", "chose", "to choose", "choosing"], "a": 3, "ex": "해석  지역 무역 회의 기간 동안 숙박지로 벡슬리 호텔을 선택해 주셔서 감사합니다.\n해설  전치사 for 뒤 목적어 자리이고 뒤에 the Bexley Hotel이라는 목적어가 있으므로 동명사가 와야 한다. 따라서 (D) choosing이 정답. (C) to choose는 전치사 뒤에 쓸 수 없고, (A) choose·(B) chose는 동사 형태라 전치사의 목적어가 될 수 없다.", "point": "전치사 뒤 동명사 목적어"}, {"id": "U01-D21", "stem": "By _______ the invoices electronically, Fenwick Supply reduced its paper costs by nearly 30 percent.", "ch": ["process", "processed", "to process", "processing"], "a": 3, "ex": "해석  송장을 전자적으로 처리함으로써 펜윅 서플라이는 종이 비용을 거의 30퍼센트 줄였다.\n해설  전치사 By 뒤이며 목적어 the invoices가 이어지므로 동명사 자리다. 따라서 (D) processing이 정답. (C) to process는 전치사 뒤에 올 수 없고, (A) process·(B) processed는 동사 형태라 전치사의 목적어로 쓸 수 없다.", "point": "전치사 뒤 동명사 목적어"}, {"id": "U01-D22", "stem": "Ridgeway Bank offers free financial _______ to any customer who opens a savings account this month.", "ch": ["advise", "advisable", "advice", "advisably"], "a": 2, "ex": "해석  리지웨이 은행은 이번 달에 저축 계좌를 개설하는 모든 고객에게 무료 재무 상담을 제공한다.\n해설  타동사 offers의 목적어 자리이고 형용사 free financial의 수식을 받으므로 명사가 와야 한다. 따라서 (C) advice가 정답. (A) advise는 동사, (B) advisable은 형 , {"id": "U02-D14", "stem": "Ms. Delacroix, the lead _______ of the annual charity gala, has secured sponsorships from twelve local businesses.", "ch": ["organize", "organizer", "organization", "organized"], "a": 1, "ex": "해석  연례 자선 갈라의 총괄 기획자인 델라크루아 씨는 지역 업체 열두 곳의 후원을 확보했다.\n해설  사람 이름 Ms. Delacroix와 동격이므로 사람 명사 (B) organizer가 정답. (C) organization은 '조직·단체'라는 사물 명사라 사람과 동격이 될 수 없고, (A) organize는 동사, (D) organized는 과거분사다.", "point": "사람 명사 -er vs 사물 명사"}, {"id": "U02-D15", "stem": "Each _______ in the leadership seminar will be paired with a senior manager for six months of mentoring.", "ch": ["participate", "participation", "participant", "participating"], "a": 2, "ex": "해석  리더십 세미나의 각 참가자는 6개월간의 멘토링을 위해 선임 관리자와 짝을 이루게 된다.\n해설  Each 뒤는 단수 명사 자리이고 '선임 관리자와 짝이 되는' 대상은 사람이므로 사람 명사 (C) participant가 정답. (B) participation은 '참여'라는 추상 명사라 의미가 맞지 않고, (A) participate는 동사, (D) participating은 현재분사다.", "point": "사람 명사 -ant vs 추상 명사"}, {"id": "U02-D16", "stem": "Only _______ of Greenvale County are eligible to apply for the low-interest home improvement loan.", "ch": ["reside", "residence", "residents", "residential"], "a": 2, "ex": "해석  그린베일 카운티 주민들만 저금리 주택 개보수 대출을 신청할 수 있다.\n해설  복수 동사 are의 주어이자 '대출을 신청하는' 사람이어야 하므로 사람 명사의 복수형 (C) residents가 정답. (B) residence는 '거주지'라는 사물 명사이고 단수라 are와 맞지 않으며, (A) reside는 동사, (D) residential은 형용사다.", "point": "사람 명사 -ent vs 사물 명사"}, {"id": "U02-D17", "stem": "All new hires must complete a _______ form before their first paycheck can be processed.", "ch": ["registered", "registering", "registration", "registers"], "a": 2, "ex": "해석  모든 신입 사원은 첫 급여가 처리되기 전에 등록 양식을 작성해야 한다.\n해설  registration form(등록 양식)은 <명사 + 명사>로 이루어진 복합명사이므로 (C) registration이 정답. (A) registered처럼 형용사 형태를 앞에 넣으면 '등록된 양식'이 되어 의미가 어색하고, (B) registering은 현재분사, (D) registers는 동사다.", "point": "복합명사(registration form)"}, {"id": "U02-D18", "stem": "The revised _______ schedule for the spring catalog will be posted on the company intranet by Friday.", "ch": ["produce", "production", "productive", "produced"], "a": 1, "ex": "해석  봄 카탈로그의 수정된 제작 일정은 금요일까지 사내 인트라넷에 게시될 것이다.\n해설  production schedule(제작 일정)은 <명사 + 명사> 복합명사이므로 명사 (B) production이 정답. (C) productive를 넣으면 '생산적인 일정'이 되어 의미가 어색하고, (A) produce는 동사, (D) produced는 과거분사다.", "point": "복합명사(production schedule)"}, {"id": "U02-D19", "stem": "Every employee will meet with a supervisor for an annual _______ review in December.", "ch": ["perform", "performs", "performance", "performed"], "a": 2, "ex": "해석  모든 직원은 12월에 연례 업무 평가를 위해 상사와 면담할 것이다.\n해설  performance review(업무 평가)는 <명사 + 명사> 복합명사이므로 (C) performance가 정답. (A) perform과 (B) performs는 동사, (D) performed는 과거분사라 명사 review 앞에서 복합명사를 이루지 못한다.", "point": "복합명사(performance review)"}, {"id": "U02-D20", "stem": "Vantage Realty currently has three _______ available on the fourth floor of the Pierpont Building.", "ch": ["office", "offices", "official", "officially"], "a": 1, "ex": "해석  밴티지 부동산은 현재 피어폰트 빌딩 4층에 이용 가능한 사무실 세 곳을 보유하고 있다.\n해설  수사 three 뒤에는 복수 가산 명사가 와야 하므로 (B) offices가 정답. (A) office는 단수형이라 three와 함께 쓸 수 없고, (C) official은 형용사, (D) officially는 부사다.", "point": "가산명사 복수형(수사 뒤)"}, {"id": "U02-D21", "stem": "Every _______ submitted after the deadline will be returned to the sender without review.", "ch": ["proposal", "proposals", "propose", "proposed"], "a": 0, "ex": "해석  마감 후에 제출된 모든 제안서는 검토 없이 발신자에게 반송될 것이다.\n해설  Every 뒤에는 단수 가산 명사가 와야 하므로 (A) proposal이 정답. (B) proposals는 복수형이라 Every와 함께 쓸 수 없고, (C) propose는 동사, (D) proposed는 과거분사다.", "point": "가산명사 단수형(Every 뒤)"}, {"id": "U02-D22", "stem": "The clinic sends _______ to patients two days before each scheduled appointment.", "ch": ["reminder", "reminders", "remind", "reminded"], "a": 1, "ex": "해석  그 병원은 예약된 각 진료일 이틀 전에 환자들에게 알림을 보낸다.\n해설  동사 sends의 목적어 자리인데 관사가 없으므로 가산 명사는 복수형으로 써야 한다. 따라서 (B) reminders가 정답. (A) reminder는 단수 가산 명사라 관사 없이 홀로 쓸 수 없고, (C) remind는 동사, (D) reminded는 과거형·과거분사다.", "point": "가산명사는 관사 없이 단수로 못 씀"}, {"id": "U02-D23", "stem": "The technician needs more _______ about the error message before she can diagnose the problem.", "ch": ["informed", "informing", "information", "informations"], "a": 2, "ex": "해석  기술자는 문제를 진단하기 전에 오류 메시지에 관한 정보가 더 필요하다.\n해설  information은 불가산 명사이므로 복수형 없이 (C) information으로 쓴다. (D) informations처럼 -s를 붙일 수 없고, (A) informed는 과거분사, (B) informing은 현재분사라 more 뒤 명사 자리에 올 수 없다.", "point": "불가산명사(복수형 불가)"}, {"id": "U02-D24", "stem": "All _______ shipped from the Dunmore warehouse is inspected twice before it leaves the loading dock.", "ch": ["merchandise", "merchandises", "product", "products"], "a": 0, "ex": "해석  던모어 창고에서 출하되는 모든 상품은 하역장을 떠나기 전에 두 번 검사를 받는다.\n해설  동사가 단수형 is이고 대명사 it으로 받으므로 항상 단수 취급하는 불가산 명사 (A) merchandise가 정답. (B) merchandises처럼 복수형을 만들 수 없고, (C) product는 가산 명사 단수라 관사 없이 쓸 수 없으며, (D) products는 복수라 is와 맞지 않는다.", "point": "불가산명사(단수 취급)"}, {"id": "U02-D25", "stem": "The city has set up a special _______ to help small businesses recover from the flood.", "ch": ["fund", "funds", "funding", "funded"], "a": 0, "ex": "해석  시는 소상공인들이 홍수 피해에서 회복하도록 돕기 위한 특별 기금을 조성했다.\n해설  관사 a 뒤이므로 단수 가산 명사 (A) fund가 정답. (C) funding은 불가산 명사라 a와 함께 쓸 수 없고, (B) funds는 복수형이라 a 뒤에 올 수 없으며, (D) funded는 과거분사다.", "point": "가산·불가산 혼동(fund/funding)"}, {"id": "U02-D26", "stem": "Very little _______ is needed to install the new software on the office computers.", "ch": ["expert", "experts", "expertise", "expertly"], "a": 2, "ex": "해석  사무실 컴퓨터에 새 소프트웨어를 설치하는 데는 전문 지식이 거의 필요하지 않다.\n해설  양을 나타내는 little은 불가산 명사와 함께 쓰이고 동사도 단수형 is이므로 불가산 명사 (C) expertise가 정답. (A) expert와 (B) experts는 '전문가'라는 가산 명사라 little의 수식을 받을 수 없고, (D) expertly는 부사다.", "point": "가산·불가산 혼동(expert/expertise)"}, {"id": "U02-D27", "stem": "After reviewing the applications, _______ decided to interview five candidates for the marketing position.", "ch": ["we", "us", "our", "ourselves"], "a": 0, "ex": "해석  지원서를 검토한 뒤 우리는 마케팅 직책에 다섯 명의 후보자를 면접하기로 결정했다.\n해설  동사 decided 앞의 주어 자리이므로 주격 (A) we가 정답. (B) us는 목적격, (C) our는 소유격이라 뒤에 명사가 필요하고, (D) ourselves는 재귀대명사라 주어 자리에 단독으로 올 수 없다.", "point": "인칭대명사 주격"}, {"id": "U02-D28", "stem": "The client asked _______ to send the revised contract by courier rather than by e-mail.", "ch": ["they", "them", "their", "themselves"], "a": 1, "ex": "해석  고객은 수정된 계약서를 이메일이 아닌 택배로 보내 달라고 그들에게 요청했다.\n해설  타동사 asked의 목적어 자리이므로 목적격 (B) them이 정답. (A) they는 주격, (C) their는 소유격이라 뒤에 명사가 와야 하고, (D) themselves는 주어 The client와 가리키는 대상이 다르므로 쓸 수 없다.", "point": "인칭대명사 목적격(동사 뒤)"}, {"id": "U02-D29", "stem": "Mr. Abernathy will be out of the office until Friday, so please direct any urgent questions to _______.", "ch": ["I", "me", "my", "myself"], "a": 1, "ex": "해석  애버내시 씨는 금요일까지 부재중이니 급한 질문은 저에게 보내 주십시오.\n해설  전치사 to의 목적어 자리이므로 목적격 (B) me가 정답. (A) I는 주격, (C) my는 소유격이라 뒤에 명사가 필요하며, (D) myself는 명령문의 주어 you와 가리키는 대상이 다르므로 재귀대명사를 쓸 수 없다.", "point": "인칭대명사 목적격(전치사 뒤)"}, {"id": "U02-D30", "stem": "Mr. Kowalski will present _______ findings on customer retention at the quarterly review meeting.", "ch": ["he", "him", "his", "himself"], "a": 2, "ex": "해석  코왈스키 씨는 분기 검토 회의에서 고객 유지에 관한 자신의 조사 결과를 발표할 것이다.\n해설  빈칸 뒤에 명사 findings가 있으므로 명사를 꾸미는 소유격 (C) his가 정답. (A) he는 주격, (B) him은 목적격이라 명사 앞에 올 수 없고, (D) himself는 재귀대명사라 명사를 수식하지 못한다.", "point": "소유격(뒤에 명사)"}, {"id": "U02-D31", "stem": "Several teams submitted budget proposals, but _______ was the only one approved without any revisions.", "ch": ["our", "ours", "us", "we"], "a": 1, "ex": "해석  여러 팀이 예산안을 제출했지만, 우리 것만이 수정 없이 승인된 유일한 예산안이었다.\n해설  빈칸은 뒤에 명사 없이 단독으로 주어 자리에 오며 our proposal(우리 팀의 예산안)을 뜻하므로 소유대명사 (B) ours가 정답. (A) our는 소유격이라 뒤에 명사가 필요하고, (C) us는 목적격이며, (D) we는 주격이지만 단수 동사 was와 맞지 않고 '우리'가 승인된 것이 아니므로 의미도 어색하다.", "point": "소유대명사(단독, 주어)"}, {"id": "U02-D32", "stem": "Ms. Navarro said the laptop left in the conference room was not _______, so it may belong to a visitor.", "ch": ["she", "her", "hers", "herself"], "a": 2, "ex": "해석  나바로 씨는 회의실에 남겨진 노트북이 자기 것이 아니라고 말했으므로, 그것은 방문객의 것일 수 있다.\n해설  be동사 뒤에서 명사 없이 단독으로 쓰여 her laptop(그녀의 노트북)을 뜻하므로 소유대명사 (C) hers가 정답. (B) her는 소유격이라 뒤에 명사가 와야 하고, (A) she는 주격, (D) herself는 재귀대명사라 '그녀의 것'이라는 의미를 나타낼 수 없다.", "point": "소유대명사(단독, 보어)"}, {"id": "U02-D33", "stem": "During the orientation session, the new interns introduced _______ to the department heads.", "ch": ["they", "them", "their", "themselves"], "a": 3, "ex": "해석  오리엔테이션 시간에 신입 인턴들은 부서장들에게 자기소개를 했다.\n해설  동사 introduced의 목적어가 주어 the new interns와 같은 대상이므로 재귀대명사 (D) themselves가 정답. (B) them은 주어와 다른 제3의 대상을 가리키게 되어 문맥에 맞지 않고, (A) they는 주격, (C) their는 소유격이라 목적어 자리에 올 수 없다.", "point": "재귀대명사 재귀 용법(목적어 = 주어)"}, {"id": "U02-D34", "stem": "The regional director _______ will greet the visiting delegation at the airport on Monday morning.", "ch": ["she", "her", "hers", "herself"], "a": 3, "ex": "해석  지역 책임자가 직접 월요일 아침 공항에서 방문 대표단을 맞이할 것이다.\n해설  주어 The regional director 바로 뒤에서 '직접'이라는 뜻으로 주어를 강조하는 자리이므로 재귀대명사 (D) herself가 정답. (A) she를 넣으면 주어가 둘이 되고, (B) her는 목적격, (C) hers는 소유대명사라 주어 뒤에 덧붙일 수 없다.", "point": "재귀대명사 강조 용법"}, {"id": "U02-D35", "stem": "Mr. Ortega prefers to prepare the monthly sales report by _______ rather than delegate it to an assistant.", "ch": ["he", "him", "his", "himself"], "a": 3, "ex": "해석  오르테가 씨는 월간 매출 보고서를 비서에게 맡기기보다 직접 작성하는 것을 선호한다.\n해설  by oneself(혼자 힘으로, 직접)는 재귀대명사를 쓰는 관용 표현이므로 (D) himself가 정답. (B) him을 넣으면 주어 Mr. Ortega와 같은 사람을 목적격으로 받는 셈이 되어 틀리고, (A) he는 주격이라 전치사 뒤에 올 수 없으며, (C) his는 소유격이다.", "point": "재귀대명사(by oneself)"}, {"id": "U02-D36", "stem": "The response time of the new customer service hotline is much shorter than _______ of the previous system.", "ch": ["that", "those", "this", "it"], "a": 0, "ex": "해석  새 고객 서비스 상담 전화의 응답 시간은 이전 시스템의 응답 시간보다 훨씬 짧다.\n해설  앞에 나온 단수 명사 The response time의 반복을 피하는 자리이므로 지시대명사 (A) that이 정답. (B) those는 복수 명사를 대신하고, (C) this와 (D) it은 뒤에 of 전치사구의 수식을 받는 형태로 쓰이지 않는다.", "point": "지시대명사 that(단수 명사 반복 회피)"}, {"id": "U02-D37", "stem": "Refunds will be issued only to _______ who cancel their reservations at least 48 hours in advance.", "ch": ["those", "that", "them", "anyone"], "a": 0, "ex": "해석  환불은 최소 48시간 전에 예약을 취소하는 사람들에게만 이루어질 것이다.\n해설  뒤에 who cancel(복수 동사)이 이어지므로 '~하는 사람들'을 뜻하며 복수 취급하는 (A) those가 정답. (D) anyone은 단수 취급이라 cancels가 와야 하고, (B) that은 사람을 가리키는 those who 구문에 쓰이지 않으며, (C) them 뒤에는 관계절 who가 바로 이어질 수 없다.", "point": "those who ~"}, {"id": "U02-D38", "stem": "The first shipment of office chairs arrived yesterday, and _______ is expected to be delivered next week.", "ch": ["another", "other", "the others", "each other"], "a": 0, "ex": "해석  첫 번째 사무용 의자 배송분이 어제 도착했고, 또 다른 배송분은 다음 주에 배달될 예정이다.\n해설  앞에 나온 shipment와 같은 종류의 '또 다른 하나'를 가리키며 단수 동사 is와 어울리므로 (A) another가 정답. (B) other는 단독으로 단수 대명사로 쓸 수 없고, (C) the others는 복수라 is와 맞지 않으며, (D) each other는 '서로'라는 뜻으로 주어 자리에 올 수 없다.", "point": "부정대명사 another"}, {"id": "U02-D39", "stem": "Of the two candidates interviewed for the position, one has a background in finance and _______ has worked in retail.", "ch": ["another", "other", "the other", "others"], "a": 2, "ex": "해석  그 직책에 면접을 본 두 후보자 중 한 명은 금융 분야 경력이 있고, 나머지 한 명은 소매업에서 일했다.\n해설  둘(the two candidates) 중 하나를 one으로 말한 뒤 나머지 하나를 가리키므로 (C) the other가 정답. (A) another는 셋 이상 중 '또 다른 하나'라 둘 중 나머지에는 쓸 수 없고, (B) other는 단독 대명사로 쓰지 못하며, (D) others는 복수라 has와 맞지 않는다.", "point": "부정대명사 the other(둘 중 나머지)"}, {"id": "U02-D40", "stem": "Some employees prefer to receive the newsletter by e-mail, while _______ would rather read a printed copy.", "ch": ["other", "another", "others", "each other"], "a": 2, "ex": "해석  일부 직원들은 소식지를 이메일로 받기를 선호하는 반면, 다른 직원들은 인쇄본을 읽고 싶어 한다.\n해설  Some ~, others ~(일부는 ~, 다른 사람들은 ~) 구문으로 정해지지 않은 다른 여럿을 가리키므로 (C) others가 정답. (A) other는 단독으로 대명사로 쓸 수 없고, (B) another는 단수라 여러 직원을 가리킬 수 없으며, (D) each other는 '서로'라는 뜻이다.", "point": "부정대명사 others(some ~ others)"}]}, {"id": "U03", "name": "U03 형용사와 부사", "items": [{"id": "U03-D01", "stem": "Wexford Logistics received _______ feedback from clients after launching its new tracking system in March.", "ch": ["favorable", "favorably", "favor", "favors"], "a": 0, "ex": "해석  웩스퍼드 로지스틱스는 3월에 새 추적 시스템을 출시한 뒤 고객들로부터 호의적인 피드백을 받았다.\n해설  빈칸은 동사 received의 목적어인 명사 feedback을 수식하는 자리이므로 형용사 (A) favorable이 정답. (B) favorably는 부사라 명사를 꾸밀 수 없고, (C)·(D)는 명사·동사 형태여서 feedback 앞에 올 수 없다.", "point": "명사 앞 형용사 자리(동사 + 형용사 + 목적어 명사)"}, {"id": "U03-D02", "stem": "All visitors must present their _______ identification at the security desk before entering the laboratory.", "ch": ["origin", "originate", "original", "originally"], "a": 2, "ex": "해석  모든 방문객은 실험실에 들어가기 전에 보안 데스크에서 원본 신분증을 제시해야 한다.\n해설  소유격 their와 명사 identification 사이는 명사를 수식하는 형용사 자리이므로 (C) original이 정답. (A)는 명사, (B)는 동사, (D)는 부사여서 명사를 직접 꾸밀 수 없다.", "point": "명사 앞 형용사 자리(소유격 + 형용사 + 명사)"}, {"id": "U03-D03", "stem": "The committee is looking for an _______ candidate to lead the regional sales office in Portland.", "ch": ["experience", "experiences", "experiencing", "experienced"], "a": 3, "ex": "해석  위원회는 포틀랜드 지역 영업소를 이끌 경험 많은 후보자를 찾고 있다.\n해설  관사 an과 명사 candidate 사이는 형용사 자리이므로 '경험 많은'이라는 뜻의 (D) experienced가 정답. (A)·(B)는 명사라 명사 두 개가 나란히 놓여 어색하고, (C) experiencing은 '경험하고 있는'이라는 뜻이 되어 문맥에 맞지 않는다.", "point": "명사 앞 형용사 자리(관사 + 형용사 + 명사)"}, {"id": "U03-D04", "stem": "Despite the sudden increase in demand, prices at Harlow Grocery have remained _______ throughout the year.", "ch": ["stability", "stable", "stably", "stabilize"], "a": 1, "ex": "해석  수요가 갑자기 늘었음에도 할로 그로서리의 가격은 일 년 내내 안정적으로 유지되었다.\n해설  remain은 2형식 동사로 뒤에 주어의 상태를 설명하는 주격 보어가 오므로 형용사 (B) stable이 정답. (A)는 명사, (C)는 부사, (D)는 동사여서 보어 자리에 올 수 없다.", "point": "주격 보어 형용사(remain + 형용사)"}, {"id": "U03-D05", "stem": "The new interns seem _______ to take on additional responsibilities during the busy holiday season.", "ch": ["willing", "willingly", "willingness", "will"], "a": 0, "ex": "해석  새 인턴들은 바쁜 연휴 시즌 동안 추가 업무를 기꺼이 맡을 의향이 있는 것처럼 보인다.\n해설  seem은 2형식 동사로 뒤에 주어 The new interns의 상태를 나타내는 형용사 보어가 와야 하므로 (A) willing이 정답. (B) willingly는 부사, (C) willingness는 명사, (D) will은 조동사·명사여서 seem의 보어가 될 수 없다.", "point": "주격 보어 형용사(seem + 형용사)"}, {"id": "U03-D06", "stem": "After the merger with Calder Industries was announced, many employees became _______ about their job security.", "ch": ["anxiety", "anxiously", "anxious", "anxieties"], "a": 2, "ex": "해석  콜더 인더스트리스와의 합병이 발표된 뒤 많은 직원들이 고용 안정에 대해 불안해했다.\n해설  become은 2형식 동사이므로 뒤에 주어 employees의 상태를 설명하는 형용사 보어 (C) anxious가 와야 한다. (A)·(D)는 명사, (B)는 부사여서 주격 보어 자리에 올 수 없다.", "point": "주격 보어 형용사(become + 형용사)"}, {"id": "U03-D07", "stem": "Technicians at Brightline Solar keep their tools _______ so that repairs can be completed without delay.", "ch": ["organize", "organization", "organizing", "organized"], "a": 3, "ex": "해석  브라이트라인 솔라의 기술자들은 수리가 지체 없이 완료될 수 있도록 도구를 정리된 상태로 유지한다.\n해설  keep은 5형식 동사로 <keep + 목적어 + 목적격 보어> 구조를 취하며, 목적어 their tools의 상태를 설명하는 형용사 (D) organized가 정답. (A)는 동사, (B)는 명사여서 보어가 될 수 없고, (C) organizing은 '정리하고 있는'이라는 능동의 뜻이 되어 도구에는 맞지 않는다.", "point": "목적격 보어 형용사(keep + 목적어 + 형용사)"}, {"id": "U03-D08", "stem": "Most participants found the workshop on digital marketing _______ and asked for a follow-up session.", "ch": ["usefulness", "useful", "usefully", "use"], "a": 1, "ex": "해석  대부분의 참가자들은 디지털 마케팅 워크숍이 유익하다고 느꼈고 후속 세션을 요청했다.\n해설  find는 5형식 동사로 목적어 the workshop 뒤에 그 상태를 설명하는 목적격 보어가 오므로 형용사 (B) useful이 정답. (A)·(D)는 명사, (C)는 부사여서 목적격 보어 자리에 올 수 없다.", "point": "목적격 보어 형용사(find + 목적어 + 형용사)"}, {"id": "U03-D09", "stem": "The updated inventory software makes it _______ for staff members to track shipments from any location.", "ch": ["easy", "easily", "ease", "easiness"], "a": 0, "ex": "해석  업데이트된 재고 소프트웨어는 직원들이 어느 장소에서든 배송을 추적하는 것을 쉽게 만들어 준다.\n해설  make는 5형식 동사로 <make + 목적어 it + 목적격 보어> 구조이며, 가목적어 it의 상태를 설명하는 형용사 (A) easy가 정답. (B) easily는 부사, (C)·(D)는 명사여서 목적격 보어로 쓸 수 없다.", "point": "목적격 보어 형용사(make + it + 형용사)"}, {"id": "U03-D10", "stem": "Customers appreciated the _______ response from the support team when the online payment system went down.", "ch": ["time", "timer", "timely", "times"], "a": 2, "ex": "해석  온라인 결제 시스템이 다운되었을 때 고객들은 지원팀의 시기적절한 대응에 감사했다.\n해설  관사 the와 명사 response 사이는 형용사 자리이며, timely는 -ly로 끝나지만 '시기적절한'이라는 뜻의 형용사이므로 (C) timely가 정답. (A)·(B)·(D)는 모두 명사 형태라 response를 꾸밀 수 없다.", "point": "-ly로 끝나는 형용사(timely)"}, {"id": "U03-D11", "stem": "Replacing the entire ventilation system would be too _______ for a company of our size.", "ch": ["cost", "costly", "costs", "costing"], "a": 1, "ex": "해석  환기 시스템 전체를 교체하는 것은 우리 규모의 회사에는 너무 비용이 많이 들 것이다.\n해설  <be + too + 빈칸> 구조로 주어의 상태를 설명하는 주격 보어 자리이며, costly는 -ly로 끝나지만 '비용이 많이 드는'이라는 형용사이므로 (B) costly가 정답. (A)·(C)는 명사·동사, (D)는 동명사·분사 형태여서 too 뒤 보어로 쓸 수 없다.", "point": "-ly로 끝나는 형용사(costly)"}, {"id": "U03-D12", "stem": "Ms. Delgado gave a _______ presentation on the company's expansion plans at the annual shareholders' meeting.", "ch": ["success", "succeed", "successfully", "successful"], "a": 3, "ex": "해석  델가도 씨는 연례 주주총회에서 회사의 확장 계획에 대해 성공적인 발표를 했다.\n해설  관사 a와 명사 presentation 사이는 형용사 자리이므로 -ful로 끝나는 형용사 (D) successful이 정답. (A)는 명사, (B)는 동사, (C)는 부사여서 명사를 직접 수식할 수 없다.", "point": "형용사형 어미(-ful)"}, {"id": "U03-D13", "stem": "Employees who have worked at Norcross Media for more than two years are _______ for the tuition reimbursement program.", "ch": ["eligible", "eligibility", "eligibly", "eligibilities"], "a": 0, "ex": "해석  노크로스 미디어에서 2년 넘게 근무한 직원들은 등록금 환급 프로그램 대상이 된다.\n해설  be동사 뒤 보어 자리이고 뒤에 전치사 for가 이어지므로 <be eligible for(~의 자격이 있다)>를 이루는 형용사 (A) eligible이 정답. (B)·(D)는 명사, (C)는 부사여서 be 뒤에서 for와 짝을 이루지 못한다.", "point": "be + 형용사 + 전치사(be eligible for)"}, {"id": "U03-D14", "stem": "Applicants for the accounting position should be _______ with the latest tax reporting software.", "ch": ["familiarity", "familiarize", "familiar", "familiarly"], "a": 2, "ex": "해석  회계직 지원자는 최신 세금 신고 소프트웨어에 익숙해야 한다.\n해설  <be + 빈칸 + with> 구조로 '~에 익숙하다'라는 뜻의 be familiar with를 이루는 형용사 (C) familiar가 정답. (A)는 명사, (B)는 동사, (D)는 부사여서 be동사 뒤에서 with와 함께 쓰이지 못한다.", "point": "be + 형용사 + 전치사(be familiar with)"}, {"id": "U03-D15", "stem": "The rooftop garden at Meridian Tower is _______ to all tenants during regular business hours.", "ch": ["access", "accessible", "accessibly", "accessibility"], "a": 1, "ex": "해석  메리디안 타워의 옥상 정원은 정규 업무 시간 동안 모든 입주자가 이용할 수 있다.\n해설  <be + 빈칸 + to> 구조로 '~가 이용할 수 있는'이라는 뜻의 be accessible to를 이루는 형용사 (B) accessible이 정답. (A)·(D)는 명사, (C)는 부사여서 be동사 뒤 보어 자리에 올 수 없다.", "point": "be + 형용사 + 전치사(be accessible to)"}, {"id": "U03-D16", "stem": "Because the documents contain _______ information about upcoming product launches, they must not leave the building.", "ch": ["confide", "confidence", "confident", "confidential"], "a": 3, "ex": "해석  그 문서들은 곧 출시될 제품에 관한 기밀 정보를 담고 있으므로 건물 밖으로 반출되어서는 안 된다.\n해설  명사 information을 수식하는 형용사 자리이며 문맥상 '기밀의'라는 뜻이 필요하므로 (D) confidential이 정답. (C) confident는 '확신하는'이라는 뜻으로 사람을 설명하는 형용사라 information과 어울리지 않고, (A)는 동사, (B)는 명사다.", "point": "혼동 형용사(confidential : confident)"}, {"id": "U03-D17", "stem": "The judges were _______ by the quality of the designs submitted for the Larkin Architecture Prize.", "ch": ["impressed", "impressive", "impression", "impress"], "a": 0, "ex": "해석  심사위원들은 라킨 건축상에 제출된 설계의 품질에 감명을 받았다.\n해설  be동사 뒤 보어 자리로 주어 The judges가 '감명을 받은' 상태이므로 (A) impressed가 정답. (B) impressive는 '인상적인'이라는 뜻으로 감명을 주는 대상을 설명할 때 쓰며 뒤의 by와도 어울리지 않고, (C)는 명사, (D)는 동사다.", "point": "혼동 형용사(impressed : impressive)"}, {"id": "U03-D18", "stem": "Ms. Okafor is _______ for coordinating all travel arrangements for the executive team.", "ch": ["response", "responsive", "responsible", "responsibly"], "a": 2, "ex": "해석  오카포 씨는 임원진의 모든 출장 준비를 조율하는 일을 책임지고 있다.\n해설  <be + 빈칸 + for> 구조로 '~을 책임지다'라는 뜻의 be responsible for를 이루는 (C) responsible이 정답. (B) responsive는 '반응하는'이라는 뜻으로 전치사 to와 짝을 이루므로 for 앞에 올 수 없고, (A)는 명사, (D)는 부사다.", "point": "혼동 형용사(responsible for : responsive to)"}, {"id": "U03-D19", "stem": "The manager reviewed _______ application in detail before inviting the top candidates for an interview.", "ch": ["all", "each", "several", "many"], "a": 1, "ex": "해석  매니저는 상위 후보자들을 면접에 초대하기 전에 각 지원서를 꼼꼼히 검토했다.\n해설  빈칸 뒤에 단수 명사 application이 있으므로 단수 명사와 쓰는 (B) each가 정답. (A) all, (C) several, (D) many는 복수 명사(applications)와 함께 써야 한다.", "point": "수량형용사 + 단수명사(each)"}, {"id": "U03-D20", "stem": "If the conference room is unavailable on Monday, we will have to find _______ location for the training session.", "ch": ["other", "few", "both", "another"], "a": 3, "ex": "해석  월요일에 회의실을 쓸 수 없다면 우리는 교육 세션을 위한 다른 장소를 찾아야 할 것이다.\n해설  빈칸 뒤에 단수 가산명사 location이 있으므로 단수 명사와 쓰는 (D) another가 정답. (A) other는 복수 명사나 불가산명사 앞에 쓰며, (B) few와 (C) both는 복수 명사와 함께 써야 한다.", "point": "수량형용사 + 단수명사(another)"}, {"id": "U03-D21", "stem": "Over the past decade, Trellis Bank has opened _______ branches in smaller towns across the northern region.", "ch": ["many", "much", "every", "another"], "a": 0, "ex": "해석  지난 10년 동안 트렐리스 은행은 북부 지역의 소도시들에 많은 지점을 열었다.\n해설  빈칸 뒤에 복수 명사 branches가 있으므로 복수 명사와 쓰는 (A) many가 정답. (B) much는 불가산명사, (C) every와 (D) another는 단수 명사 앞에 쓴다.", "point": "수량형용사 + 복수명사(many)"}, {"id": "U03-D22", "stem": "The technician inspected _______ printers on the third floor and replaced their worn toner cartridges.", "ch": ["each", "one", "both", "little"], "a": 2, "ex": "해석  기술자는 3층에 있는 두 프린터를 모두 점검하고 낡은 토너 카트리지를 교체했다.\n해설  빈칸 뒤에 복수 명사 printers가 있으므로 복수 명사와 함께 쓰는 (C) both가 정답. (A) each와 (B) one은 단수 명사 앞에 쓰고, (D) little은 불가산명사 앞에 쓴다.", "point": "수량형용사 + 복수명사(both)"}, {"id": "U03-D23", "stem": "Only a _______ seats remain for the leadership seminar, so interested employees should register today.", "ch": ["little", "few", "much", "every"], "a": 1, "ex": "해석  리더십 세미나 좌석이 몇 개밖에 남지 않았으므로 관심 있는 직원들은 오늘 등록해야 한다.\n해설  빈칸 뒤에 복수 명사 seats가 있으므로 <a few + 복수 명사> 형태를 만드는 (B) few가 정답. (A) little과 (C) much는 불가산명사 앞에 쓰고, (D) every는 단수 명사 앞에 쓰며 a 뒤에 올 수도 없다.", "point": "수량형용사 + 복수명사(a few)"}, {"id": "U03-D24", "stem": "The construction crew did not have _______ time to finish the roof before the storm arrived.", "ch": ["many", "several", "few", "much"], "a": 3, "ex": "해석  공사 인부들은 폭풍이 오기 전에 지붕을 완성할 시간이 많지 않았다.\n해설  빈칸 뒤에 불가산명사 time이 있으므로 불가산명사와 쓰는 (D) much가 정답. (A) many, (B) several, (C) few는 모두 복수 가산명사 앞에만 쓸 수 있다.", "point": "수량형용사 + 불가산명사(much)"}, {"id": "U03-D25", "stem": "There was very _______ interest in the evening yoga class, so the fitness center canceled it.", "ch": ["little", "few", "many", "several"], "a": 0, "ex": "해석  저녁 요가 수업에 대한 관심이 거의 없어서 피트니스 센터는 그 수업을 취소했다.\n해설  빈칸 뒤에 불가산명사 interest가 있으므로 불가산명사와 쓰는 (A) little이 정답. (B) few, (C) many, (D) several은 복수 가산명사 앞에만 쓴다.", "point": "수량형용사 + 불가산명사(little)"}, {"id": "U03-D26", "stem": "According to the survey, _______ customers prefer to receive their monthly statements by e-mail rather than by post.", "ch": ["every", "each", "most", "another"], "a": 2, "ex": "해석  설문에 따르면 대부분의 고객은 월별 명세서를 우편보다 이메일로 받기를 선호한다.\n해설  빈칸 뒤에 복수 명사 customers가 있으므로 복수 명사와 쓸 수 있는 (C) most가 정답. (A) every, (B) each, (D) another는 모두 단수 명사 앞에만 쓴다.", "point": "복수·불가산 모두 가능한 수량형용사(most)"}, {"id": "U03-D27", "stem": "Unlike _______ suppliers in the area, Kestrel Paper offers free next-day delivery on all bulk orders.", "ch": ["another", "other", "each", "every"], "a": 1, "ex": "해석  그 지역의 다른 공급업체들과 달리 케스트렐 페이퍼는 모든 대량 주문에 무료 익일 배송을 제공한다.\n해설  빈칸 뒤에 복수 명사 suppliers가 있으므로 복수 명사 앞에 쓸 수 있는 (B) other가 정답. (A) another, (C) each, (D) every는 단수 명사와만 쓴다.", "point": "복수·불가산 모두 가능한 수량형용사(other)"}, {"id": "U03-D28", "stem": "If you have _______ questions about the revised vacation policy, please contact the human resources department.", "ch": ["every", "much", "another", "any"], "a": 3, "ex": "해석  개정된 휴가 정책에 관해 궁금한 점이 있으면 인사부에 문의하시기 바랍니다.\n해설  빈칸 뒤에 복수 명사 questions가 있으므로 복수·단수·불가산 명사에 모두 쓸 수 있는 (D) any가 정답. (A) every와 (C) another는 단수 명사 앞에만 쓰고, (B) much는 불가산명사 앞에 쓴다.", "point": "복수·단수·불가산 모두 가능한 any"}, {"id": "U03-D29", "stem": "The auditors found _______ errors in the financial statements that Ashby Textiles submitted for the last fiscal year.", "ch": ["no", "another", "each", "every"], "a": 0, "ex": "해석  감사관들은 애슈비 텍스타일이 지난 회계연도에 제출한 재무제표에서 어떤 오류도 발견하지 못했다.\n해설  빈칸 뒤에 복수 명사 errors가 있고 no는 복수·단수·불가산 명사 앞에 모두 쓸 수 있으므로 (A) no가 정답. (B) another, (C) each, (D) every는 단수 명사 앞에만 쓰므로 errors와 함께 쓸 수 없다.", "point": "복수·단수·불가산 모두 가능한 no"}, {"id": "U03-D30", "stem": "The new fitness tracker from Veltra is _______ popular among runners who train in cold weather.", "ch": ["extreme", "extremely", "extremity", "extremes"], "a": 1, "ex": "해석  벨트라의 새 피트니스 트래커는 추운 날씨에 훈련하는 러너들 사이에서 매우 인기가 있다.\n해설  <be + 빈칸 + 형용사 popular> 구조로 형용사를 수식하는 부사 자리이므로 (B) extremely가 정답. (A) extreme은 형용사, (C)·(D)는 명사여서 형용사 popular를 꾸밀 수 없다.", "point": "부사 자리(be + 부사 + 형용사)"}, {"id": "U03-D31", "stem": "The quarterly sales figures were reviewed _______ by the finance team before being sent to the board.", "ch": ["careful", "carefulness", "carefully", "care"], "a": 2, "ex": "해석  분기별 매출 수치는 이사회에 보내지기 전에 재무팀에 의해 꼼꼼하게 검토되었다.\n해설  <be + p.p. reviewed + 빈칸> 구조로 과거분사를 뒤에서 수식하는 부사 자리이므로 (C) carefully가 정답. (A)는 형용사, (B)·(D)는 명사여서 수동태 동사 were reviewed를 꾸밀 수 없다.", "point": "부사 자리(be + p.p. + 부사)"}, {"id": "U03-D32", "stem": "Rennick Foods has _______ expanded its product line to include organic snacks and beverages.", "ch": ["recent", "recency", "recentness", "recently"], "a": 3, "ex": "해석  레닉 푸즈는 최근 유기농 스낵과 음료를 포함하도록 제품군을 확장했다.\n해설  <have + 빈칸 + p.p. expanded> 구조로 조동사 has와 과거분사 사이는 부사 자리이므로 (D) recently가 정답. (A) recent는 형용사, (B)·(C)는 명사여서 동사 사이에 들어갈 수 없다.", "point": "부사 자리(have + 부사 + p.p.)"}, {"id": "U03-D33", "stem": "Guests at the Ravenswood Inn can _______ reserve a table at the restaurant through the hotel's mobile app.", "ch": ["quickly", "quick", "quickness", "quicker"], "a": 0, "ex": "해석  레이븐스우드 인의 투숙객은 호텔 모바일 앱을 통해 레스토랑 테이블을 빠르게 예약할 수 있다.\n해설  <조동사 can + 빈칸 + 동사원형 reserve> 구조로 조동사와 동사 사이는 부사 자리이므로 (A) quickly가 정답. (B) quick과 (D) quicker는 형용사, (C) quickness는 명사여서 동사 reserve를 수식할 수 없다.", "point": "부사 자리(조동사 + 부사 + 동사원형)"}, {"id": "U03-D34", "stem": "Mr. Anand explained the installation process _______ so that every customer could follow along.", "ch": ["clear", "clearly", "clarity", "clearance"], "a": 1, "ex": "해석  아난드 씨는 모든 고객이 따라올 수 있도록 설치 과정을 명확하게 설명했다.\n해설  동사 explained와 목적어 the installation process가 이미 갖추어진 완전한 절 뒤에 붙어 동사를 수식하므로 부사 (B) clearly가 정답. (A) clear는 형용사, (C)·(D)는 명사여서 완전한 절 뒤에서 동사를 꾸밀 수 없다.", "point": "부사 자리(완전한 절 뒤에서 동사 수식)"}, {"id": "U03-D35", "stem": "Volunteers _______ arrived at the community center an hour before the charity auction was scheduled to begin.", "ch": ["typical", "typicality", "typically", "typify"], "a": 2, "ex": "해석  자원봉사자들은 보통 자선 경매가 시작되기로 예정된 시간보다 한 시간 일찍 지역 센터에 도착했다.\n해설  주어 Volunteers와 동사 arrived 사이에서 동사를 수식하는 자리이므로 부사 (C) typically가 정답. (A) typical은 형용사, (B) typicality는 명사, (D) typify는 동사여서 이미 있는 본동사 arrived를 꾸밀 수 없다.", "point": "부사 자리(주어 + 부사 + 동사)"}, {"id": "U03-D36", "stem": "The renovation of the Gilmore Public Library took _______ eighteen months to complete.", "ch": ["approximate", "approximation", "approximated", "approximately"], "a": 3, "ex": "해석  길모어 공공 도서관의 보수 공사는 완료하는 데 약 18개월이 걸렸다.\n해설  숫자 표현 eighteen months 앞에서 '약, 대략'이라는 뜻으로 수를 수식하는 부사 (D) approximately가 정답. (A)는 형용사, (B)는 명사, (C)는 동사의 과거형·과거분사여서 took와 숫자 사이에 들어갈 수 없다.", "point": "숫자를 수식하는 부사(approximately)"}, {"id": "U03-D37", "stem": "Visitors to the _______ renovated lobby will notice the wider seating area and improved lighting.", "ch": ["newly", "new", "newness", "newer"], "a": 0, "ex": "해석  새로 단장한 로비를 찾는 방문객들은 더 넓어진 좌석 공간과 개선된 조명을 알아차릴 것이다.\n해설  관사 the와 명사 lobby 사이에서 과거분사 renovated를 수식하는 자리이므로 부사 (A) newly가 정답. (B) new와 (D) newer는 형용사, (C) newness는 명사여서 분사 renovated를 꾸밀 수 없다.", "point": "부사 자리(관사 + 부사 + 분사 + 명사)"}, {"id": "U03-D38", "stem": "Sales of the Aurora coffee maker have increased _______ because of a popular online review.", "ch": ["late", "lately", "later", "latest"], "a": 1, "ex": "해석  오로라 커피 메이커의 판매량이 인기 있는 온라인 후기 덕분에 최근 증가했다.\n해설  현재완료 have increased와 함께 '최근에'라는 뜻으로 동사를 수식하는 부사 (B) lately가 정답. (A) late는 '늦게'라는 뜻이라 문맥에 맞지 않고, (C) later는 '나중에', (D) latest는 '최신의'라는 뜻으로 판매 증가 시점을 나타내지 못한다.", "point": "혼동 부사(lately : late)"}, {"id": "U03-D39", "stem": "Dr. Mehta's research on renewable energy storage is _______ regarded by experts throughout the industry.", "ch": ["high", "height", "highly", "higher"], "a": 2, "ex": "해석  메타 박사의 재생 에너지 저장 연구는 업계 전반의 전문가들에게 높이 평가받는다.\n해설  <be + 빈칸 + p.p. regarded> 구조로 과거분사를 수식하는 부사 자리이며, '매우, 높이'라는 뜻의 (C) highly가 정답. (A) high는 물리적 높이를 뜻하는 부사·형용사라 regarded와 어울리지 않고, (B) height는 명사, (D) higher는 비교급 형용사다.", "point": "혼동 부사(highly : high)"}, {"id": "U03-D40", "stem": "The keynote speaker will arrive _______ after the registration desk opens at nine o'clock.", "ch": ["short", "shorter", "shortness", "shortly"], "a": 3, "ex": "해석  기조연설자는 9시에 등록 데스크가 열린 직후에 도착할 것이다.\n해설  동사 arrive를 수식하며 '곧, 직후에'라는 뜻으로 after와 함께 쓰이는 부사 (D) shortly가 정답. (A) short는 '짧게'라는 뜻으로 시간의 근접을 나타내지 못하고, (B)는 비교급, (C)는 명사여서 동사를 꾸밀 수 없다.", "point": "혼동 부사(shortly : short)"}]}, {"id": "U04", "name": "U04 동사의 형태와 수 일치", "items": [{"id": "U04-D01", "stem": "Please _______ all visitor badges to the front desk before leaving the building at the end of the day.", "ch": ["returns", "returning", "return", "returned"], "a": 2, "ex": "해석  하루 업무를 마치고 건물을 나서기 전에 모든 방문객 출입증을 안내 데스크에 반납해 주십시오.\n해설  Please로 시작하는 명령문은 주어 없이 동사원형으로 시작하므로 (C) return이 정답. (A)는 3인칭 단수 현재형, (B)는 현재분사, (D)는 과거형·과거분사로 명령문의 동사 자리에 올 수 없다.", "point": "명령문의 동사원형"}, {"id": "U04-D02", "stem": "Kindly _______ the enclosed survey and mail it back in the prepaid envelope by March 3.", "ch": ["complete", "completion", "completed", "completely"], "a": 0, "ex": "해석  동봉된 설문지를 작성하여 3월 3일까지 요금 선납 봉투에 넣어 회신해 주십시오.\n해설  Kindly 뒤에 주어 없이 이어지는 명령문이므로 동사원형 (A) complete가 정답. (B)는 명사, (D)는 부사라 동사 자리에 올 수 없고, (C) completed는 과거형이라 명령문을 만들지 못한다.", "point": "명령문의 동사원형(품사 구별)"}, {"id": "U04-D03", "stem": "To reserve a seat at the annual banquet, simply _______ the registration desk on the second floor.", "ch": ["visited", "visiting", "visits", "visit"], "a": 3, "ex": "해석  연례 만찬의 좌석을 예약하려면 2층 등록 데스크를 방문하기만 하면 됩니다.\n해설  To reserve a seat at the annual banquet은 목적을 나타내는 부사구이고, 콤마 뒤 simply 다음이 본동사 자리인데 주어가 없으므로 명령문이다. 따라서 동사원형 (D) visit이 정답. (A)·(C)는 과거형·3인칭 단수형이라 주어 없는 명령문에 쓸 수 없고, (B)는 -ing 형태로 본동사가 될 수 없다.", "point": "명령문의 동사원형(부사구 뒤)"}, {"id": "U04-D04", "stem": "The new inventory software will _______ employees to track shipments from any location.", "ch": ["allowing", "allow", "allows", "allowed"], "a": 1, "ex": "해석  새 재고 관리 소프트웨어는 직원들이 어느 장소에서든 배송을 추적할 수 있게 해 줄 것이다.\n해설  조동사 will 뒤에는 동사원형이 오므로 (B) allow가 정답. (A)·(C)·(D)는 각각 현재분사, 3인칭 단수형, 과거형으로 조동사 바로 뒤에 올 수 없다.", "point": "조동사 뒤 동사원형"}, {"id": "U04-D05", "stem": "Applicants must _______ two letters of recommendation along with a completed application form.", "ch": ["submitted", "submitting", "submits", "submit"], "a": 3, "ex": "해석  지원자는 작성한 지원서와 함께 추천서 두 통을 제출해야 한다.\n해설  조동사 must 뒤에는 동사원형이 와야 하므로 (D) submit이 정답. (A) submitted, (B) submitting, (C) submits는 조동사 다음 자리에 쓸 수 없는 형태다.", "point": "조동사 뒤 동사원형"}, {"id": "U04-D06", "stem": "Guests who arrive after nine o'clock should _______ the night manager at the side entrance.", "ch": ["contact", "contacts", "contacting", "contacted"], "a": 0, "ex": "해석  9시 이후에 도착하는 투숙객은 옆문 출입구에서 야간 지배인에게 연락해야 한다.\n해설  조동사 should 다음은 동사원형 자리이므로 (A) contact가 정답. 주어 Guests가 복수라서 (B) contacts를 고르기 쉽지만, 조동사 뒤에서는 수 일치와 상관없이 항상 원형을 쓴다. (C)·(D)도 조동사 뒤에 올 수 없다.", "point": "조동사 뒤 동사원형(복수 주어 함정)"}, {"id": "U04-D07", "stem": "Our technicians _______ every heating unit twice a year to ensure that it meets safety standards.", "ch": ["inspects", "inspecting", "inspect", "to inspect"], "a": 2, "ex": "해석  우리 기술자들은 안전 기준을 충족하는지 확인하기 위해 모든 난방 장치를 1년에 두 번 점검한다.\n해설  주어 Our technicians는 복수이고 twice a year라는 반복 표현이 있으므로 현재시제 복수 동사, 즉 동사원형과 같은 형태인 (C) inspect가 정답. (A) inspects는 3인칭 단수형이라 수 일치가 맞지 않고, (B)·(D)는 본동사가 될 수 없다.", "point": "복수 주어 + 현재시제 동사원형"}, {"id": "U04-D08", "stem": "Every month, we _______ the sales figures with the regional managers during a video conference.", "ch": ["reviews", "review", "reviewing", "to review"], "a": 1, "ex": "해석  매달 우리는 화상 회의에서 지역 관리자들과 매출 수치를 검토한다.\n해설  주어 we는 3인칭 단수가 아니므로 현재시제에서 동사원형 (B) review를 쓴다. (A) reviews는 3인칭 단수 주어에만 쓰고, (C)·(D)는 본동사 자리에 올 수 없다.", "point": "1인칭 복수 주어 + 현재시제 동사원형"}, {"id": "U04-D09", "stem": "Ms. Okafor is currently _______ the quarterly budget and will present it to the board on Thursday.", "ch": ["prepare", "prepares", "preparing", "prepared"], "a": 2, "ex": "해석  오카포 씨는 현재 분기 예산을 준비하고 있으며 목요일에 이사회에 발표할 예정이다.\n해설  is currently 뒤에 빈칸이 있고 그 뒤에 목적어 the quarterly budget이 이어지므로, 지금 하고 있는 일을 나타내는 진행형 <be + -ing>의 (C) preparing이 정답. (D) prepared는 수동태를 만들어 뒤에 목적어를 둘 수 없고, (A)·(B)는 be동사 뒤에 올 수 없다.", "point": "be + -ing 진행형"}, {"id": "U04-D10", "stem": "The maintenance crew was _______ the parking garage when the power outage occurred yesterday.", "ch": ["repaint", "repainting", "repainted", "repaints"], "a": 1, "ex": "해석  어제 정전이 발생했을 때 시설 관리팀은 주차장을 다시 칠하고 있었다.\n해설  was 뒤에 빈칸, 그 뒤에 목적어 the parking garage가 있으므로 과거진행형을 만드는 (B) repainting이 정답. when절은 진행 중이던 동작이 중단된 시점을 나타낸다. (C) repainted는 수동태가 되어 목적어를 취할 수 없고, (A)·(D)는 be동사 뒤에 쓸 수 없다.", "point": "be + -ing 진행형(과거진행)"}, {"id": "U04-D11", "stem": "At the moment, the finance department is _______ several vendors for the new payroll system.", "ch": ["evaluated", "evaluate", "evaluates", "evaluating"], "a": 3, "ex": "해석  현재 재무부서는 새 급여 시스템을 위해 여러 공급업체를 평가하고 있다.\n해설  At the moment(지금)와 is가 있고 빈칸 뒤에 목적어 several vendors가 이어지므로 현재진행형 (D) evaluating이 정답. (A) evaluated는 수동태가 되어 목적어를 둘 수 없으며, (B)·(C)는 be동사 바로 뒤에 올 수 없다.", "point": "be + -ing 진행형"}, {"id": "U04-D12", "stem": "All conference materials were _______ to participants' hotel rooms the night before the opening session.", "ch": ["delivered", "deliver", "delivering", "delivers"], "a": 0, "ex": "해석  모든 컨퍼런스 자료는 개회 세션 전날 밤 참가자들의 호텔 객실로 배달되었다.\n해설  주어 All conference materials는 '배달되는' 대상이고 빈칸 뒤에 목적어 없이 to participants' hotel rooms가 이어지므로 수동태 <be + p.p.>의 (A) delivered가 정답. (C) delivering은 진행형이 되어 목적어가 필요하고, (B)·(D)는 were 뒤에 올 수 없다.", "point": "be + p.p. 수동태"}, {"id": "U04-D13", "stem": "The winning design will be _______ at the awards ceremony in Lisbon next month.", "ch": ["announced", "announce", "announcing", "announces"], "a": 0, "ex": "해석  수상작 디자인은 다음 달 리스본에서 열리는 시상식에서 발표될 것이다.\n해설  주어 The winning design은 '발표되는' 대상이므로 will be 뒤에 과거분사가 와서 수동태를 이루는 (A) announced가 정답. (C) announcing은 디자인이 스스로 발표한다는 뜻이 되어 어색하고, (B)·(D)는 be동사 뒤에 쓸 수 없다.", "point": "be + p.p. 수동태(미래)"}, {"id": "U04-D14", "stem": "Employee parking permits are _______ by the security office during the first week of each year.", "ch": ["issue", "issued", "issues", "issuing"], "a": 1, "ex": "해석  직원 주차 허가증은 매년 첫째 주에 보안실에서 발급된다.\n해설  빈칸 뒤에 행위자를 나타내는 by the security office가 있고 주어 permits는 '발급되는' 대상이므로 수동태 (B) issued가 정답. (D) issuing은 진행형이 되어 목적어가 필요하며, (A)·(C)는 are 뒤에 올 수 없다.", "point": "be + p.p. 수동태(by 행위자)"}, {"id": "U04-D15", "stem": "The lobby carpets have been thoroughly _______ since the water leak was repaired.", "ch": ["clean", "cleans", "cleaned", "cleaning"], "a": 2, "ex": "해석  누수가 수리된 이후 로비 카펫은 철저히 청소되었다.\n해설  have been 뒤에 과거분사가 오면 현재완료 수동태가 된다. 주어 carpets는 '청소되는' 대상이므로 (C) cleaned가 정답. (D) cleaning은 카펫이 스스로 청소한다는 뜻이 되어 어색하고, (A)·(B)는 been 뒤에 올 수 없다.", "point": "be + p.p. 수동태(현재완료 수동)"}, {"id": "U04-D16", "stem": "Since its opening in 2019, the Riverside Bistro has _______ more than half a million customers.", "ch": ["serve", "serving", "serves", "served"], "a": 3, "ex": "해석  2019년 개업 이후 리버사이드 비스트로는 50만 명이 넘는 고객에게 서비스를 제공해 왔다.\n해설  has 뒤에는 과거분사가 와서 현재완료를 이루므로 (D) served가 정답. Since its opening in 2019(2019년 개업 이후)는 현재완료의 대표적 단서다. (B) serving은 has 뒤에 올 수 없고, (A)·(C)는 동사 형태가 맞지 않는다.", "point": "have + p.p. 현재완료"}, {"id": "U04-D17", "stem": "The committee had already _______ its final decision when the last proposal arrived.", "ch": ["make", "made", "making", "makes"], "a": 1, "ex": "해석  마지막 제안서가 도착했을 때 위원회는 이미 최종 결정을 내린 상태였다.\n해설  had already 뒤에는 과거분사가 와서 과거완료를 만들므로 (B) made가 정답. when절의 과거 시점(arrived)보다 앞서 완료된 일을 나타낸다. (A)·(D)는 had 뒤에 올 수 없고, (C) making은 진행형 be동사가 없어 쓸 수 없다.", "point": "had + p.p. 과거완료"}, {"id": "U04-D18", "stem": "Over the past decade, Hallam Logistics has _______ its fleet to more than three hundred trucks.", "ch": ["expanding", "expands", "expand", "expanded"], "a": 3, "ex": "해석  지난 10년 동안 핼럼 로지스틱스는 차량을 300대가 넘는 트럭으로 확장했다.\n해설  Over the past decade(지난 10년 동안)라는 기간 표현과 has가 있으므로 현재완료 <has + p.p.>의 (D) expanded가 정답. (A) expanding은 has 뒤에 쓸 수 없고, (B)·(C)는 각각 3인칭 단수형·원형이라 형태가 맞지 않는다.", "point": "have + p.p. 현재완료"}, {"id": "U04-D19", "stem": "By the end of this quarter, the marketing team will have _______ three new product lines.", "ch": ["launched", "launching", "launch", "launches"], "a": 0, "ex": "해석  이번 분기 말까지 마케팅팀은 세 개의 신제품 라인을 출시하게 될 것이다.\n해설  will have 뒤에는 과거분사가 와서 미래완료를 이루므로 (A) launched가 정답. By the end of this quarter(이번 분기 말까지)는 미래의 완료 시점을 나타낸다. (B) launching은 have 뒤에 올 수 없고, (C)·(D)는 동사 형태가 맞지 않는다.", "point": "will have + p.p. 미래완료"}, {"id": "U04-D20", "stem": "The revised employee handbook _______ detailed guidelines on remote work and travel reimbursement.", "ch": ["containing", "to contain", "contains", "contain"], "a": 2, "ex": "해석  개정된 직원 안내서에는 원격 근무와 출장비 환급에 관한 상세한 지침이 담겨 있다.\n해설  문장에 본동사가 없으므로 빈칸은 동사 자리이며, 주어 The revised employee handbook은 단수다. 따라서 3인칭 단수 현재형 (C) contains가 정답. (A) containing과 (B) to contain은 본동사가 될 수 없고, (D) contain은 복수 주어에 쓰는 형태다.", "point": "본동사 자리 판별 + 수 일치"}, {"id": "U04-D21", "stem": "Sales of the compact printer _______ sharply after the price was reduced in June.", "ch": ["to increase", "increasing", "increased", "increases"], "a": 2, "ex": "해석  6월에 가격이 인하된 뒤 소형 프린터의 매출이 급격히 증가했다.\n해설  문장에 본동사가 없으므로 빈칸은 동사 자리이며, after절의 과거 동사 was reduced와 in June으로 보아 과거의 일이다. 따라서 과거형 (C) increased가 정답. (A)·(B)는 본동사가 될 수 없고, (D) increases는 복수 주어 Sales와 수가 맞지 않는다.", "point": "본동사 자리 판별 + 시제"}, {"id": "U04-D22", "stem": "Ms. Delgado _______ the accounting department for nearly twelve years before becoming chief financial officer.", "ch": ["supervising", "supervised", "to supervise", "supervision"], "a": 1, "ex": "해석  델가도 씨는 최고재무책임자가 되기 전에 거의 12년 동안 회계부서를 감독했다.\n해설  주어 Ms. Delgado 뒤에 본동사가 없으므로 빈칸은 동사 자리이고, before becoming chief financial officer로 보아 과거의 일이다. 따라서 과거형 (B) supervised가 정답. (A)·(C)는 준동사라 본동사가 될 수 없고, (D) supervision은 명사다.", "point": "본동사 자리 판별(품사·준동사 오답)"}, {"id": "U04-D23", "stem": "Registration for the leadership seminar _______ on Friday, so interested employees should sign up soon.", "ch": ["closing", "to close", "close", "closes"], "a": 3, "ex": "해석  리더십 세미나 등록이 금요일에 마감되므로 관심 있는 직원은 서둘러 신청해야 한다.\n해설  주어 Registration for the leadership seminar 뒤에 본동사가 없으므로 빈칸은 동사 자리이고, 진짜 주어 Registration은 단수다. 따라서 (D) closes가 정답. (A)·(B)는 본동사가 될 수 없고, (C) close는 3인칭 단수 주어와 수가 맞지 않는다.", "point": "본동사 자리 판별 + 수 일치"}, {"id": "U04-D24", "stem": "Mr. Tanaka will _______ the trade fair in Osaka to promote the company's new line of kitchen appliances.", "ch": ["participate", "attend", "arrive", "proceed"], "a": 1, "ex": "해석  다나카 씨는 회사의 새 주방 가전 제품군을 홍보하기 위해 오사카 무역 박람회에 참석할 것이다.\n해설  빈칸 바로 뒤에 전치사 없이 목적어 the trade fair가 있으므로 타동사 (B) attend가 정답. (A) participate는 in, (C) arrive는 at, (D) proceed는 to와 같은 전치사가 있어야 하는 자동사다.", "point": "타동사 vs 자동사(목적어 직접 취함)"}, {"id": "U04-D25", "stem": "Due to heavy fog, several flights did not _______ at Merrow International Airport until late in the evening.", "ch": ["arrive", "reach", "obtain", "attend"], "a": 0, "ex": "해석  짙은 안개 때문에 여러 항공편이 저녁 늦게까지 메로 국제공항에 도착하지 못했다.\n해설  빈칸 뒤에 전치사 at이 이어지므로 목적어를 직접 취하지 않는 자동사 (A) arrive가 정답. (B) reach, (C) obtain, (D) attend는 모두 타동사라 전치사 없이 바로 목적어를 취해야 한다.", "point": "타동사 vs 자동사(전치사 뒤)"}, {"id": "U04-D26", "stem": "The customer service team _______ to all e-mail inquiries within twenty-four hours of receiving them.", "ch": ["handles", "responds", "addresses", "discusses"], "a": 1, "ex": "해석  고객 서비스팀은 모든 이메일 문의를 받은 지 24시간 이내에 응답한다.\n해설  빈칸 뒤에 전치사 to가 있으므로 to와 짝을 이루는 자동사 (B) responds가 정답. (A) handles, (C) addresses, (D) discusses는 타동사라 전치사 없이 목적어를 바로 취한다.", "point": "자동사 + 짝꿍 전치사(respond to)"}, {"id": "U04-D27", "stem": "Employees who wish to _______ in the wellness program should contact Ms. Lindqvist by May 10.", "ch": ["attend", "conduct", "participate", "undergo"], "a": 2, "ex": "해석  건강 증진 프로그램에 참여하고자 하는 직원은 5월 10일까지 린드크비스트 씨에게 연락해야 한다.\n해설  빈칸 뒤에 전치사 in이 있으므로 in과 함께 쓰는 자동사 (C) participate가 정답. (A) attend, (B) conduct, (D) undergo는 타동사라 전치사 없이 바로 목적어를 취해야 한다.", "point": "자동사 + 짝꿍 전치사(participate in)"}, {"id": "U04-D28", "stem": "The warehouse manager will _______ a full inventory count before the auditors arrive next Tuesday.", "ch": ["proceed", "participate", "rely", "conduct"], "a": 3, "ex": "해석  창고 관리자는 다음 주 화요일 감사관들이 도착하기 전에 전체 재고 조사를 실시할 것이다.\n해설  빈칸 뒤에 목적어 a full inventory count가 바로 이어지므로 타동사 (D) conduct가 정답. (A) proceed는 with, (B) participate는 in, (C) rely는 on이 있어야 목적어를 연결할 수 있는 자동사다.", "point": "타동사 vs 자동사(목적어 직접 취함)"}, {"id": "U04-D29", "stem": "The current lease on the downtown office space will _______ at the end of December.", "ch": ["expire", "reach", "seek", "raise"], "a": 0, "ex": "해석  시내 사무실 공간의 현재 임대 계약은 12월 말에 만료된다.\n해설  빈칸 뒤에 목적어 없이 시간 부사구 at the end of December만 있으므로 자동사 (A) expire가 정답. (B) reach, (C) seek, (D) raise는 타동사라 반드시 목적어가 필요하다.", "point": "자동사(목적어 없이 부사구)"}, {"id": "U04-D30", "stem": "Staff members with questions about the new expense policy should _______ to the guidelines posted on the intranet.", "ch": ["consult", "check", "refer", "read"], "a": 2, "ex": "해석  새 경비 정책에 대해 질문이 있는 직원은 인트라넷에 게시된 지침을 참조해야 한다.\n해설  빈칸 뒤에 전치사 to가 있으므로 refer to(~을 참조하다)를 이루는 자동사 (C) refer가 정답. (A) consult는 같은 뜻의 타동사라 전치사 없이 목적어를 취하고, (B) check와 (D) read도 타동사다.", "point": "자동사 + 짝꿍 전치사(refer to)"}, {"id": "U04-D31", "stem": "The instructions for assembling the bookshelf _______ printed on the inside of the box.", "ch": ["is", "are", "has", "have"], "a": 1, "ex": "해석  책장 조립 설명서는 상자 안쪽에 인쇄되어 있다.\n해설  진짜 주어는 복수 명사 The instructions이고 for assembling the bookshelf는 수식어구다. 빈칸 뒤에 과거분사 printed가 있으므로 수동태를 만드는 복수 be동사 (B) are가 정답. (A) is는 단수형이라 수가 맞지 않고, (C)·(D)를 쓰면 능동의 완료형이 되어 설명서가 스스로 인쇄했다는 뜻이 된다.", "point": "전치사구 수식어를 건너뛴 수 일치"}, {"id": "U04-D32", "stem": "The manager of the three downtown branches _______ a weekly report to the regional director.", "ch": ["send", "sending", "to send", "sends"], "a": 3, "ex": "해석  시내 세 지점을 총괄하는 관리자는 지역 책임자에게 주간 보고서를 보낸다.\n해설  진짜 주어는 단수 명사 The manager이고 of the three downtown branches는 수식어구이므로 단수 동사 (D) sends가 정답. 바로 앞의 복수 명사 branches에 이끌려 (A) send를 고르면 안 되며, (B)·(C)는 본동사가 될 수 없다.", "point": "전치사구 수식어를 건너뛴 수 일치"}, {"id": "U04-D33", "stem": "Employees who joined the company before the merger _______ given the option to transfer to the Denver office.", "ch": ["were", "was", "has", "have"], "a": 0, "ex": "해석  합병 전에 입사한 직원들에게는 덴버 사무소로 전근할 수 있는 선택권이 주어졌다.\n해설  진짜 주어는 복수 명사 Employees이고 who joined the company before the merger는 주어를 꾸미는 관계절이다. 빈칸 뒤에 과거분사 given이 있어 수동태가 필요하므로 복수 be동사 (A) were가 정답. (B) was는 단수형이고, (C)·(D)를 쓰면 직원들이 선택권을 주었다는 능동의 뜻이 되어 어색하다.", "point": "관계절 수식어를 건너뛴 수 일치"}, {"id": "U04-D34", "stem": "The prices listed in the spring catalog _______ valid until the end of April.", "ch": ["remains", "remaining", "remain", "to remain"], "a": 2, "ex": "해석  봄 카탈로그에 실린 가격은 4월 말까지 유효하다.\n해설  문장에 본동사가 없으므로 빈칸은 동사 자리이며, 진짜 주어는 복수 명사 The prices이고 listed in the spring catalog는 분사구 수식어다. 따라서 복수 동사 (C) remain이 정답. (A) remains는 단수형이고, (B)·(D)는 본동사가 될 수 없다.", "point": "분사구 수식어를 건너뛴 수 일치 + 본동사 자리"}, {"id": "U04-D35", "stem": "The equipment stored in the basement storage rooms _______ to be inspected before the building reopens.", "ch": ["need", "needs", "needing", "to need"], "a": 1, "ex": "해석  지하 창고에 보관된 장비는 건물이 다시 문을 열기 전에 점검을 받아야 한다.\n해설  진짜 주어는 불가산 단수 명사 The equipment이고 stored in the basement storage rooms는 분사구 수식어다. 따라서 단수 동사 (B) needs가 정답. 바로 앞의 복수 명사 rooms 때문에 (A) need를 고르면 안 되며, (C)·(D)는 본동사가 될 수 없다.", "point": "분사구 수식어를 건너뛴 수 일치"}, {"id": "U04-D36", "stem": "Most of the applicants for the technician position _______ at least three years of relevant experience.", "ch": ["has", "having", "to have", "have"], "a": 3, "ex": "해석  기술자 직책 지원자 대부분은 관련 경력이 3년 이상이다.\n해설  <Most of + 복수 명사(applicants)>이므로 of 뒤 명사에 맞춰 복수 동사 (D) have가 정답. (A) has는 단수형이라 맞지 않고, (B)·(C)는 본동사가 될 수 없다.", "point": "수량 표현 + of + 복수명사"}, {"id": "U04-D37", "stem": "Some of the furniture in the reception area _______ been replaced with more comfortable seating.", "ch": ["has", "have", "is", "are"], "a": 0, "ex": "해석  접수 구역의 가구 일부가 더 편안한 좌석으로 교체되었다.\n해설  <Some of + 불가산 명사(furniture)>이므로 단수 취급하며, 빈칸 뒤에 been replaced가 이어지므로 현재완료 수동태를 만드는 (A) has가 정답. (B) have는 복수형이라 맞지 않고, (C)·(D)는 be동사라 뒤에 been이 올 수 없다.", "point": "수량 표현 + of + 불가산명사"}, {"id": "U04-D38", "stem": "Several of the printers in the copy room _______ not respond when the print command is sent from a laptop.", "ch": ["does", "is", "do", "are"], "a": 2, "ex": "해석  복사실의 프린터 여러 대가 노트북에서 인쇄 명령을 보내면 반응하지 않는다.\n해설  <Several of + 복수 명사(printers)>이므로 복수 취급하며, 빈칸 뒤에 not respond가 이어지므로 부정문을 만드는 조동사 (C) do가 정답. (A) does는 단수형이라 맞지 않고, (B)·(D)는 be동사라 뒤에 동사원형 respond가 올 수 없다.", "point": "수량 표현 + of + 복수명사(do/does)"}, {"id": "U04-D39", "stem": "Much of the information in the outdated brochure _______ no longer accurate.", "ch": ["is", "are", "has", "have"], "a": 0, "ex": "해석  오래된 안내 책자에 실린 정보의 상당 부분은 더 이상 정확하지 않다.\n해설  <Much of + 불가산 명사(information)>이므로 단수 취급하고, 빈칸 뒤에 형용사 accurate가 이어지므로 단수 be동사 (A) is가 정답. (B) are는 복수형이고, (C)·(D)는 뒤에 과거분사가 필요한 have동사라 형용사 앞에 쓸 수 없다.", "point": "수량 표현 + of + 불가산명사"}, {"id": "U04-D40", "stem": "Each of the new employees _______ a mentor during the first month of employment.", "ch": ["receive", "receiving", "to receive", "receives"], "a": 3, "ex": "해석  신입 직원 각자는 입사 첫 달 동안 멘토를 배정받는다.\n해설  <Each of the + 복수 명사(employees)>는 예외적으로 언제나 단수 동사를 쓰므로 (D) receives가 정답. 뒤의 복수 명사 employees에 이끌려 (A) receive를 고르지 않도록 주의한다. (B)·(C)는 본동사가 될 수 없다.", "point": "each of the + 복수명사 → 단수 동사"}]}, {"id": "U05", "name": "U05 시제와 태", "items": [{"id": "U05-D01", "stem": "Mr. Alvarez usually _______ the weekly sales report to the regional director every Friday afternoon.", "ch": ["submit", "submits", "submitting", "to submit"], "a": 1, "ex": "해석  Alvarez 씨는 보통 매주 금요일 오후에 주간 판매 보고서를 지역 책임자에게 제출한다.\n해설  usually와 every Friday afternoon은 현재의 습관을 나타내는 단서이고, 주어 Mr. Alvarez는 3인칭 단수이므로 동사원형+(e)s 형태인 (B) submits가 정답이다. (A) submit은 주어와 수가 맞지 않고, (C) submitting과 (D) to submit은 문장의 본동사가 될 수 없다.", "point": "현재 시제 — usually/every + 시간"}, {"id": "U05-D02", "stem": "The Harlow Museum generally _______ its doors to the public at 10 a.m. on weekdays.", "ch": ["opens", "open", "opening", "to open"], "a": 0, "ex": "해석  Harlow 박물관은 일반적으로 평일 오전 10시에 대중에게 문을 연다.\n해설  generally(일반적으로)는 반복되는 일반적 사실을 나타내는 현재 시제 단서이고, 주어 The Harlow Museum이 단수이므로 (A) opens가 정답이다. (B) open은 단수 주어와 수가 맞지 않으며, (C) opening과 (D) to open은 본동사 자리에 올 수 없다.", "point": "현재 시제 — generally(일반적 사실)"}, {"id": "U05-D03", "stem": "Each quarter, the accounting department _______ every invoice before payments are released to vendors.", "ch": ["verify", "verifying", "verifies", "to verify"], "a": 2, "ex": "해석  분기마다 회계부는 대금이 거래처에 지급되기 전에 모든 송장을 확인한다.\n해설  Each quarter(분기마다)는 반복되는 업무를 나타내는 현재 시제 단서이며, 주어 the accounting department가 단수이므로 (C) verifies가 정답이다. (A) verify는 수가 일치하지 않고, (B) verifying과 (D) to verify는 본동사로 쓸 수 없다.", "point": "현재 시제 — each + 시간"}, {"id": "U05-D04", "stem": "Because its warehouse always _______ orders within 24 hours, Dunmore Office Supply receives excellent customer reviews.", "ch": ["process", "processed", "will process", "processes"], "a": 3, "ex": "해석  창고에서 항상 24시간 안에 주문을 처리하기 때문에 Dunmore Office Supply는 훌륭한 고객 평가를 받는다.\n해설  always는 현재의 습관을 나타내는 단서이고 주절의 동사도 현재 시제 receives이므로, 종속절 역시 현재 시제이면서 단수 주어 its warehouse에 맞는 (D) processes가 정답이다. (A) process는 수가 맞지 않고, (B) processed와 (C) will process는 주절의 현재 시제 및 always와 어울리지 않는다.", "point": "현재 시제 — always(습관)"}, {"id": "U05-D05", "stem": "Last year, Halvorsen Textiles _______ a second warehouse near the port to handle growing export orders.", "ch": ["purchases", "purchased", "will purchase", "has purchased"], "a": 1, "ex": "해석  작년에 Halvorsen Textiles는 늘어나는 수출 주문을 처리하기 위해 항구 근처에 두 번째 창고를 매입했다.\n해설  Last year(작년)는 이미 끝난 과거의 일을 나타내는 단서이므로 과거 시제 (B) purchased가 정답이다. (A) purchases와 (C) will purchase는 시제가 맞지 않고, (D) has purchased는 현재완료로 last year 같은 특정 과거 시점 표현과 함께 쓸 수 없다.", "point": "과거 시제 — last + 시간"}, {"id": "U05-D06", "stem": "The figures in this report reflect the inventory count that warehouse staff _______ two weeks ago.", "ch": ["completed", "complete", "will complete", "have completed"], "a": 0, "ex": "해석  이 보고서의 수치는 창고 직원들이 2주 전에 완료한 재고 조사를 반영한다.\n해설  관계절 안에 two weeks ago(2주 전)라는 과거 시간 표현이 있으므로 과거 시제 (A) completed가 정답이다. 주절이 현재 시제(reflect)라고 해서 관계절까지 현재로 쓰지 않으며, (B) complete·(C) will complete·(D) have completed는 ago와 함께 쓸 수 없다.", "point": "과거 시제 — 시간 + ago(관계절 안)"}, {"id": "U05-D07", "stem": "Yesterday afternoon, the facilities manager _______ all employees that the elevator would be out of service until Monday.", "ch": ["notify", "will notify", "notified", "notifies"], "a": 2, "ex": "해석  어제 오후 시설 관리자는 전 직원에게 엘리베이터가 월요일까지 운행되지 않을 것이라고 알렸다.\n해설  문장 앞의 Yesterday afternoon이 과거 시점을 분명히 나타내므로 과거 시제 (C) notified가 정답이다. (A) notify와 (D) notifies는 현재, (B) will notify는 미래 시제라서 yesterday와 맞지 않는다.", "point": "과거 시제 — yesterday"}, {"id": "U05-D08", "stem": "The new director previously _______ a team of forty engineers at an aerospace firm in Seattle.", "ch": ["leads", "will lead", "leading", "led"], "a": 3, "ex": "해석  새 이사는 이전에 시애틀의 한 항공우주 회사에서 40명의 엔지니어로 구성된 팀을 이끌었다.\n해설  previously(이전에)는 과거에 있었던 일을 나타내는 단서이므로 과거 시제 (D) led가 정답이다. (A) leads는 현재, (B) will lead는 미래 시제로 단서와 어긋나고, (C) leading은 본동사가 될 수 없다.", "point": "과거 시제 — previously"}, {"id": "U05-D09", "stem": "A technician from Beckett Security _______ the new cameras in the parking garage tomorrow morning.", "ch": ["install", "will install", "installed", "installing"], "a": 1, "ex": "해석  Beckett Security의 기술자가 내일 아침 주차장에 새 카메라를 설치할 것이다.\n해설  tomorrow morning(내일 아침)은 미래 시점을 나타내므로 미래 시제 (B) will install이 정답이다. (C) installed는 과거 시제로 tomorrow와 맞지 않고, (A) install은 단수 주어 A technician과 수가 맞지 않으며, (D) installing은 본동사로 쓸 수 없다.", "point": "미래 시제 — tomorrow"}, {"id": "U05-D10", "stem": "Starting next month, all part-time staff _______ their timesheets through the online portal rather than on paper.", "ch": ["will record", "recorded", "have recorded", "recording"], "a": 0, "ex": "해석  다음 달부터 모든 시간제 직원은 종이 대신 온라인 포털을 통해 근무 시간표를 기록할 것이다.\n해설  Starting next month(다음 달부터)는 앞으로 시행될 일을 나타내는 미래 시점 표현이므로 (A) will record가 정답이다. (B) recorded와 (C) have recorded는 이미 일어난 일을 나타내어 단서와 맞지 않고, (D) recording은 본동사가 될 수 없다.", "point": "미래 시제 — starting + 미래 시점"}, {"id": "U05-D11", "stem": "Ms. Delgado _______ her decision on the vendor contract shortly after the budget review concludes.", "ch": ["announced", "has announced", "will announce", "announcing"], "a": 2, "ex": "해석  Delgado 씨는 예산 검토가 끝난 직후에 공급업체 계약에 대한 결정을 발표할 것이다.\n해설  shortly(곧)는 앞으로 일어날 일을 나타내는 미래 시제 단서이므로 (C) will announce가 정답이다. (A) announced와 (B) has announced는 이미 끝난 일을 나타내므로 shortly와 어울리지 않고, (D) announcing은 본동사 자리에 올 수 없다.", "point": "미래 시제 — shortly"}, {"id": "U05-D12", "stem": "As of next Monday, the Weston Street branch _______ customers only by appointment on Saturdays.", "ch": ["served", "has served", "serving", "will serve"], "a": 3, "ex": "해석  다음 주 월요일부터 Weston Street 지점은 토요일에는 예약 고객만 응대할 것이다.\n해설  As of next Monday(다음 주 월요일부터)는 미래 시점부터 적용될 변경 사항을 알리는 표현이므로 미래 시제 (D) will serve가 정답이다. (A) served와 (B) has served는 과거·현재완료라서 next Monday와 맞지 않고, (C) serving은 본동사로 쓸 수 없다.", "point": "미래 시제 — as of + 미래 시점"}, {"id": "U05-D13", "stem": "Bramwell Furniture is currently _______ a new line of office chairs designed for smaller workspaces.", "ch": ["develop", "developing", "developed", "development"], "a": 1, "ex": "해석  Bramwell Furniture는 현재 좁은 업무 공간을 위해 설계된 새로운 사무용 의자 제품군을 개발하고 있다.\n해설  be동사 is 뒤에 currently(현재)가 있고 빈칸 뒤에 목적어 a new line of office chairs가 있으므로 능동 현재진행형을 만드는 (B) developing이 정답이다. (C) developed를 쓰면 수동태가 되어 뒤의 목적어를 받을 수 없고, (A) develop과 (D) development는 be동사 뒤에서 진행형을 만들지 못한다.", "point": "현재진행 — currently(be 뒤 -ing)"}, {"id": "U05-D14", "stem": "Right now, the IT team _______ the server upgrade, so e-mail access may be interrupted briefly.", "ch": ["is performing", "performs", "performed", "will have performed"], "a": 0, "ex": "해석  지금 IT팀이 서버 업그레이드를 진행하고 있어서 이메일 접속이 잠시 중단될 수 있다.\n해설  Right now(지금)는 현재 진행 중인 동작을 나타내는 단서이므로 현재진행형 (A) is performing이 정답이다. (B) performs는 현재의 습관을 나타내고 (C) performed는 과거, (D) will have performed는 미래완료라서 right now와 어울리지 않는다.", "point": "현재진행 — right now"}, {"id": "U05-D15", "stem": "At the moment, Ms. Kaur _______ with a client, but she will return your call before noon.", "ch": ["meets", "met", "is meeting", "has met"], "a": 2, "ex": "해석  지금 Kaur 씨는 고객과 만나는 중이지만 정오 전에 다시 전화를 드릴 것이다.\n해설  At the moment(지금)는 현재 진행 중인 일을 나타내는 단서이므로 현재진행형 (C) is meeting이 정답이다. (A) meets는 습관적 현재, (B) met은 과거, (D) has met은 현재완료로 모두 '지금 진행 중'이라는 의미를 나타내지 못한다.", "point": "현재진행 — at the moment"}, {"id": "U05-D16", "stem": "The receptionist _______ the visitor badges when the fire alarm went off unexpectedly this morning.", "ch": ["is printing", "has printed", "will print", "was printing"], "a": 3, "ex": "해석  오늘 아침 화재 경보가 갑자기 울렸을 때 접수 담당자는 방문객 출입증을 인쇄하고 있었다.\n해설  when 뒤에 과거 시제 went off가 있어 과거의 특정 시점에 진행 중이던 동작을 나타내야 하므로 과거진행형 (D) was printing이 정답이다. (A) is printing은 현재진행, (C) will print는 미래로 과거 시점과 맞지 않고, (B) has printed는 현재완료라서 과거의 특정 시점과 함께 쓸 수 없다.", "point": "과거진행 — when + 주어 + 과거"}, {"id": "U05-D17", "stem": "The company _______ still operating out of a rented office when its first major contract was signed.", "ch": ["is", "was", "has been", "will be"], "a": 1, "ex": "해석  첫 번째 대형 계약이 체결되었을 때 그 회사는 여전히 임대 사무실에서 운영되고 있었다.\n해설  빈칸 뒤에 operating이 있고 when절의 동사가 과거 시제 was signed이므로 과거진행형을 만드는 (B) was가 정답이다. (A) is와 (D) will be는 과거 시점과 맞지 않고, (C) has been은 현재완료진행형이 되어 과거의 특정 시점을 나타내는 when절과 어울리지 않는다.", "point": "과거진행 — was/were + -ing(be동사 자리)"}, {"id": "U05-D18", "stem": "At this time next week, our sales representatives _______ the trade show in Frankfurt.", "ch": ["will be attending", "attended", "were attending", "have attended"], "a": 0, "ex": "해석  다음 주 이맘때 우리 영업 담당자들은 프랑크푸르트에서 열리는 무역 박람회에 참석하고 있을 것이다.\n해설  At this time next week(다음 주 이맘때)는 미래의 특정 시점에 진행되고 있을 일을 나타내므로 미래진행형 (A) will be attending이 정답이다. (B) attended와 (D) have attended는 이미 일어난 일을, (C) were attending은 과거에 진행 중이던 일을 나타내어 next week와 맞지 않는다.", "point": "미래진행 — at this time + 미래 시점"}, {"id": "U05-D19", "stem": "Mr. Yusuf _______ from the Denver office at 9 a.m. tomorrow, so please direct urgent calls to his assistant.", "ch": ["worked", "was working", "will be working", "has worked"], "a": 2, "ex": "해석  Yusuf 씨는 내일 오전 9시에 덴버 사무실에서 근무하고 있을 것이니 긴급한 전화는 그의 비서에게 연결해 주십시오.\n해설  at 9 a.m. tomorrow(내일 오전 9시)라는 미래의 특정 시점에 진행되고 있을 일이므로 미래진행형 (C) will be working이 정답이다. (A) worked와 (D) has worked는 이미 끝난 일을, (B) was working은 과거에 진행 중이던 일을 나타내므로 tomorrow와 어울리지 않는다.", "point": "미래진행 — at + 시각 + tomorrow"}, {"id": "U05-D20", "stem": "Since 2016, Pinecrest Resorts _______ more than twenty properties along the northern coastline.", "ch": ["acquires", "acquired", "will acquire", "has acquired"], "a": 3, "ex": "해석  2016년 이후로 Pinecrest Resorts는 북부 해안을 따라 20개가 넘는 숙박 시설을 인수해 왔다.\n해설  Since 2016(2016년 이후로)은 과거에 시작해 현재까지 이어지는 일을 나타내는 현재완료 단서이므로 (D) has acquired가 정답이다. (B) acquired는 단순 과거로 since와 함께 쓰지 않으며, (A) acquires와 (C) will acquire는 과거부터 이어져 온 일을 나타내지 못한다.", "point": "현재완료 — since + 과거 시점"}, {"id": "U05-D21", "stem": "Over the past six months, the customer support team _______ its average response time by nearly half.", "ch": ["reduce", "has reduced", "reducing", "will reduce"], "a": 1, "ex": "해석  지난 6개월 동안 고객 지원팀은 평균 응답 시간을 거의 절반으로 줄였다.\n해설  Over the past six months(지난 6개월 동안)는 과거부터 현재까지의 기간을 나타내는 현재완료 단서이므로 (B) has reduced가 정답이다. (D) will reduce는 미래라서 이미 지난 기간과 맞지 않고, (A) reduce는 단수 주어와 수가 맞지 않으며, (C) reducing은 본동사가 될 수 없다.", "point": "현재완료 — over the past + 기간"}, {"id": "U05-D22", "stem": "Ms. Ferreira _______ with Lockhart Engineering for the last eight years and now heads its design unit.", "ch": ["has remained", "remains", "remained", "is remaining"], "a": 0, "ex": "해석  Ferreira 씨는 지난 8년 동안 Lockhart Engineering에 재직해 왔으며 현재 설계 부서를 이끌고 있다.\n해설  for the last eight years(지난 8년 동안)는 과거부터 지금까지 계속되는 일을 나타내며 뒤에 and now heads가 이어지므로 현재완료 (A) has remained가 정답이다. (C) remained는 과거에 끝난 일이 되어 now heads와 모순되고, (B) remains와 (D) is remaining은 지속 기간을 나타내는 표현과 어울리지 않는다.", "point": "현재완료 — for the last + 기간"}, {"id": "U05-D23", "stem": "The board _______ just approved a plan to open three new distribution centers in the Midwest.", "ch": ["is", "does", "has", "will"], "a": 2, "ex": "해석  이사회는 중서부에 새 물류 센터 세 곳을 열려는 계획을 방금 승인했다.\n해설  빈칸 뒤에 just와 과거분사 approved가 있으므로 '방금 완료된 일'을 나타내는 현재완료 have[has] + p.p.를 만드는 (C) has가 정답이다. (A) is를 쓰면 수동태가 되어 뒤의 목적어 a plan을 받을 수 없고, (B) does와 (D) will 뒤에는 동사원형이 와야 한다.", "point": "현재완료 — have[has] + p.p.(just)"}, {"id": "U05-D24", "stem": "By the time the inspector arrived, the construction crew _______ the damaged scaffolding.", "ch": ["removes", "is removing", "will remove", "had removed"], "a": 3, "ex": "해석  검사관이 도착했을 무렵 공사 인부들은 손상된 비계를 이미 철거한 상태였다.\n해설  By the time 뒤에 과거 시제 arrived가 있으므로 그보다 먼저 완료된 일은 과거완료 (D) had removed로 나타낸다. (A) removes와 (B) is removing은 현재, (C) will remove는 미래 시제라서 과거 시점보다 앞선 일을 나타낼 수 없다.", "point": "과거완료 — by the time + 과거"}, {"id": "U05-D25", "stem": "Ms. Lindqvist _______ the quarterly figures twice before she presented them to the board on Monday.", "ch": ["reviews", "had reviewed", "is reviewing", "will review"], "a": 1, "ex": "해석  Lindqvist 씨는 월요일에 이사회에 분기 수치를 발표하기 전에 그것을 두 번 검토해 두었다.\n해설  before 뒤의 절이 과거 시제 presented이므로 그보다 앞서 일어난 검토는 과거완료 (B) had reviewed로 나타낸다. (A) reviews와 (C) is reviewing은 현재, (D) will review는 미래 시제로 과거 시점보다 이전의 일을 표현할 수 없다.", "point": "과거완료 — before + 과거"}, {"id": "U05-D26", "stem": "When the merger was finally announced, most employees _______ about it from the local newspaper.", "ch": ["had heard", "hear", "have heard", "will hear"], "a": 0, "ex": "해석  합병이 마침내 발표되었을 때 대부분의 직원은 이미 지역 신문을 통해 그 소식을 들은 상태였다.\n해설  When절의 동사가 과거 시제 was announced이고, 직원들이 소식을 들은 것은 그보다 앞선 일이므로 과거완료 (A) had heard가 정답이다. (C) have heard는 현재완료라서 과거의 특정 시점과 함께 쓸 수 없고, (B) hear와 (D) will hear는 시제가 맞지 않는다.", "point": "과거완료 — when + 과거"}, {"id": "U05-D27", "stem": "By the end of next year, Solberg Wind Energy _______ more than two hundred turbines along the coast.", "ch": ["constructs", "constructed", "will have constructed", "has constructed"], "a": 2, "ex": "해석  내년 말이면 Solberg Wind Energy는 해안을 따라 200기가 넘는 터빈을 건설해 놓았을 것이다.\n해설  By the end of next year(내년 말까지)는 미래의 특정 시점까지 완료될 일을 나타내므로 미래완료 (C) will have constructed가 정답이다. (A) constructs는 현재, (B) constructed는 과거, (D) has constructed는 현재완료로 모두 아직 오지 않은 시점까지의 완료를 나타내지 못한다.", "point": "미래완료 — by + 미래 시점"}, {"id": "U05-D28", "stem": "By the time the guests arrive on Saturday, the caterers _______ every table in the banquet hall.", "ch": ["are set", "were setting", "had set", "will have set"], "a": 3, "ex": "해석  토요일에 손님들이 도착할 때쯤이면 출장 요리 업체가 연회장의 모든 테이블을 세팅해 놓았을 것이다.\n해설  By the time 뒤에 현재 시제 arrive가 쓰였고 on Saturday라는 미래 시점이 있으므로 주절은 미래완료 (D) will have set이 정답이다. (C) had set은 과거완료로 미래 시점과 맞지 않고, (B) were setting은 과거진행이며, (A) are set은 수동태라서 뒤의 목적어 every table을 받을 수 없다.", "point": "미래완료 — by the time + 현재"}, {"id": "U05-D29", "stem": "By the time the new software _______ next spring, all staff will have completed the required training.", "ch": ["launched", "launches", "will launch", "had launched"], "a": 1, "ex": "해석  내년 봄 새 소프트웨어가 출시될 때쯤이면 전 직원이 필수 교육을 마쳤을 것이다.\n해설  by the time이 이끄는 시간 부사절에서는 미래의 일이라도 will 대신 현재 시제를 쓰므로 (B) launches가 정답이다. 주절의 will have completed와 next spring이 미래임을 보여 주지만 (C) will launch는 시간절에 쓸 수 없고, (A) launched와 (D) had launched는 과거 시제라서 next spring과 맞지 않는다.", "point": "by the time 절의 현재 시제(미래 대신)"}, {"id": "U05-D30", "stem": "All visitors _______ to sign in at the front desk before entering the laboratory area.", "ch": ["are required", "require", "required", "requiring"], "a": 0, "ex": "해석  모든 방문객은 실험실 구역에 들어가기 전에 안내 데스크에서 서명해야 한다.\n해설  방문객은 서명을 '요구받는' 대상이고 빈칸 뒤에 목적어 없
