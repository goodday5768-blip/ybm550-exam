이 to부정사가 이어지므로 수동태 (A) are required가 정답이다. (B) require와 (C) required는 능동태라서 목적어가 필요하고, (D) requiring은 문장의 본동사가 될 수 없다.", "point": "수동태 기본 be + p.p.(목적어 없음)"}, {"id": "U05-D31", "stem": "The annual budget proposal _______ by the finance committee at its meeting last Thursday.", "ch": ["approved", "has approved", "was approved", "approving"], "a": 2, "ex": "해석  연간 예산안은 지난 목요일 회의에서 재무위원회에 의해 승인되었다.\n해설  빈칸 뒤에 행위자를 나타내는 by the finance committee가 있고 목적어가 없으므로 수동태이며, last Thursday가 과거 시점을 나타내므로 (C) was approved가 정답이다. (A) approved와 (B) has approved는 능동태라서 뒤에 목적어가 있어야 하고, (D) approving은 본동사로 쓸 수 없다.", "point": "수동태 — by + 행위자"}, {"id": "U05-D32", "stem": "The conference room on the second floor _______ for client presentations and formal interviews only.", "ch": ["reserve", "reserved", "reserving", "is reserved"], "a": 3, "ex": "해석  2층 회의실은 고객 프레젠테이션과 공식 면접 용도로만 예약되어 있다.\n해설  회의실은 '예약되는' 대상이고 빈칸 뒤에 목적어 없이 전치사구 for client presentations가 이어지므로 수동태 (D) is reserved가 정답이다. (A) reserve와 (B) reserved는 능동태로 목적어가 필요하며, (C) reserving은 본동사 자리에 올 수 없다.", "point": "수동태 기본 — 전치사구 앞 수동"}, {"id": "U05-D33", "stem": "Every new employee's laptop _______ configured by the IT department before it is handed over.", "ch": ["has", "is", "does", "being"], "a": 1, "ex": "해석  모든 신입 직원의 노트북은 지급되기 전에 IT 부서에 의해 설정된다.\n해설  빈칸 뒤에 과거분사 configured와 행위자 by the IT department가 있으므로 수동태 be + p.p.를 만드는 (B) is가 정답이다. (A) has를 쓰면 능동 현재완료가 되어 목적어가 필요하고, (C) does 뒤에는 동사원형이 와야 하며, (D) being은 문장에 본동사가 없게 만든다.", "point": "수동태 — be동사 자리(p.p. 앞)"}, {"id": "U05-D34", "stem": "Winners of the photography contest _______ at the awards dinner next Friday evening.", "ch": ["will be revealed", "reveal", "will reveal", "revealing"], "a": 0, "ex": "해석  사진 공모전 수상자는 다음 주 금요일 저녁 시상식 만찬에서 발표될 것이다.\n해설  수상자는 '발표되는' 대상이고 빈칸 뒤에 목적어가 없으며 next Friday evening이 미래 시점이므로 미래 수동태 (A) will be revealed가 정답이다. (C) will reveal은 능동태라서 목적어가 필요하고, (B) reveal과 (D) revealing은 시제도 태도 맞지 않는다.", "point": "미래 수동태 will be + p.p."}, {"id": "U05-D35", "stem": "The main lobby _______ at the moment, so please use the side entrance until further notice.", "ch": ["renovates", "renovated", "is being renovated", "has renovated"], "a": 2, "ex": "해석  현재 중앙 로비가 보수 공사 중이니 추후 공지가 있을 때까지 옆문을 이용해 주십시오.\n해설  로비는 '보수되는' 대상이고 빈칸 뒤에 목적어가 없으며 at the moment(지금)가 진행 중임을 나타내므로 진행 수동태 (C) is being renovated가 정답이다. (A) renovates·(B) renovated·(D) has renovated는 모두 능동태라서 목적어가 있어야 한다.", "point": "진행 수동태 be being + p.p."}, {"id": "U05-D36", "stem": "Several complaints about the noise _______ since the construction began in March.", "ch": ["receive", "received", "are receiving", "have been received"], "a": 3, "ex": "해석  3월에 공사가 시작된 이후로 소음에 대한 불만이 여러 건 접수되었다.\n해설  불만은 '접수되는' 대상이고 빈칸 뒤에 목적어가 없으며, since + 과거 시점이 현재완료 단서이므로 완료 수동태 (D) have been received가 정답이다. (A) receive·(B) received·(C) are receiving은 능동태로 목적어가 필요하고, (B)는 시제 면에서도 since와 어울리지 않는다.", "point": "완료 수동태 have been + p.p."}, {"id": "U05-D37", "stem": "The regional manager _______ each branch at least twice a year to review staffing and inventory levels.", "ch": ["visit", "visits", "is visited", "visiting"], "a": 1, "ex": "해석  지역 관리자는 인력 배치와 재고 수준을 검토하기 위해 적어도 1년에 두 번 각 지점을 방문한다.\n해설  빈칸 뒤에 목적어 each branch가 있으므로 능동태이고, twice a year(1년에 두 번)는 반복되는 일을 나타내는 현재 시제 단서이므로 (B) visits가 정답이다. (C) is visited는 수동태라서 목적어를 받을 수 없고, (A) visit은 단수 주어와 수가 맞지 않으며, (D) visiting은 본동사가 될 수 없다.", "point": "능동·수동 구별 — 목적어 있으면 능동(현재)"}, {"id": "U05-D38", "stem": "Last month, Corvin Foods _______ a new payroll system that has already reduced processing errors.", "ch": ["introduced", "was introduced", "has been introduced", "introducing"], "a": 0, "ex": "해석  지난달 Corvin Foods는 이미 처리 오류를 줄여 준 새 급여 시스템을 도입했다.\n해설  빈칸 뒤에 목적어 a new payroll system이 있으므로 능동태이고, Last month(지난달)가 과거 시점이므로 (A) introduced가 정답이다. (B) was introduced와 (C) has been introduced는 수동태라서 뒤에 목적어가 올 수 없고, (D) introducing은 본동사로 쓸 수 없다.", "point": "능동·수동 구별 — 목적어 있으면 능동(과거)"}, {"id": "U05-D39", "stem": "Ms. Nakamura is well known _______ her ability to resolve customer disputes calmly and quickly.", "ch": ["with", "in", "for", "on"], "a": 2, "ex": "해석  Nakamura 씨는 고객 분쟁을 침착하고 신속하게 해결하는 능력으로 잘 알려져 있다.\n해설  be known은 '~로 알려져 있다'는 뜻으로, 알려진 이유를 나타낼 때 전치사 for와 함께 쓰므로 (C) for가 정답이다. (A) with·(B) in·(D) on은 be known과 결합해 '~한 이유로 유명하다'는 의미를 만들지 못한다.", "point": "수동태 + 전치사 — be known for"}, {"id": "U05-D40", "stem": "The new conference facility is _______ with high-speed internet and modern video conferencing systems.", "ch": ["equip", "equipping", "equipment", "equipped"], "a": 3, "ex": "해석  새 회의 시설에는 초고속 인터넷과 최신 화상 회의 시스템이 갖추어져 있다.\n해설  be동사 뒤 빈칸이고 뒤에 with가 이어지므로 '~을 갖추고 있다'는 뜻의 수동태 표현 be equipped with를 완성하는 (D) equipped가 정답이다. (A) equip은 be동사 뒤에 올 수 없고, (B) equipping은 능동 진행형이 되어 목적어가 필요하며, (C) equipment는 명사로 with와 결합해 이 뜻을 만들지 못한다.", "point": "수동태 + 전치사 — be equipped with"}]}, {"id": "U06", "name": "U06 to부정사와 동명사", "items": [{"id": "U06-D01", "stem": "It is important _______ all invoices within thirty days of receipt, according to the finance department.", "ch": ["to process", "process", "processing", "processed"], "a": 0, "ex": "해석  재무부서에 따르면, 모든 송장을 수령 후 30일 이내에 처리하는 것이 중요하다.\n해설  가주어 It ~ 진주어 구조로, is important 뒤에 진주어 역할을 하는 to부정사가 와야 하므로 (A) to process가 정답. (B)는 동사원형, (D)는 과거분사로 진주어가 될 수 없고, (C) processing은 It is important 뒤의 진주어 자리에 쓰지 않는다.", "point": "명사 역할 — 가주어 It ~ 진주어 to부정사"}, {"id": "U06-D02", "stem": "It is company policy _______ every visitor while he or she is inside the laboratory.", "ch": ["escort", "to escort", "escorting", "escorted"], "a": 1, "ex": "해석  방문객이 실험실 안에 있는 동안 그를 동행 안내하는 것이 회사 방침이다.\n해설  It is company policy 뒤에 진주어가 필요하며, 진주어 자리에는 to부정사를 쓰므로 (B) to escort가 정답. (A) 동사원형과 (D) 과거분사는 주어 역할을 할 수 없고, (C) escorting은 가주어 It의 진주어로 쓰지 않는다.", "point": "명사 역할 — 가주어 It ~ 진주어 to부정사"}, {"id": "U06-D03", "stem": "It usually takes several weeks _______ a building permit from the city planning office.", "ch": ["secure", "securing", "to secure", "secured"], "a": 2, "ex": "해석  도시계획과에서 건축 허가를 받는 데는 보통 몇 주가 걸린다.\n해설  It takes + 시간 + to부정사(~하는 데 시간이 걸리다) 구문이므로 (C) to secure가 정답. (A)는 동사원형, (D)는 과거분사로 빈칸에 올 수 없고, (B) securing은 이 구문의 진주어로 쓰이지 않는다.", "point": "명사 역할 — It takes 시간 + to부정사"}, {"id": "U06-D04", "stem": "Conference participants will have an opportunity _______ for the optional workshops at the registration desk.", "ch": ["register", "registered", "registering", "to register"], "a": 3, "ex": "해석  학회 참가자들은 등록 데스크에서 선택 워크숍에 등록할 기회를 갖게 될 것이다.\n해설  명사 opportunity는 뒤에 to부정사의 수식을 받아 '~할 기회'라는 뜻이 되므로 (D) to register가 정답. (A) 동사원형과 (B) 과거분사는 명사 뒤에서 이렇게 수식할 수 없고, (C) registering은 opportunity 뒤에 쓰지 않는다.", "point": "명사 + to부정사 (opportunity to)"}, {"id": "U06-D05", "stem": "The new software gives sales representatives the ability _______ customer orders from any location.", "ch": ["to track", "track", "tracking", "tracked"], "a": 0, "ex": "해석  새 소프트웨어는 영업 사원들에게 어디서든 고객 주문을 추적할 수 있는 능력을 준다.\n해설  명사 ability는 to부정사와 결합해 '~할 능력'을 뜻하므로 (A) to track이 정답. (B)는 동사원형, (D)는 과거분사라 명사를 뒤에서 꾸밀 수 없고, (C) tracking은 ability 뒤에 올 수 없다.", "point": "명사 + to부정사 (ability to)"}, {"id": "U06-D06", "stem": "Ms. Alvarado made every effort _______ the audit before the client's deadline, despite the staff shortage.", "ch": ["complete", "to complete", "completing", "completion"], "a": 1, "ex": "해석  Alvarado 씨는 인력 부족에도 불구하고 고객의 마감 전에 감사를 끝내기 위해 온갖 노력을 기울였다.\n해설  make an effort to + 동사원형(~하려고 노력하다)이라는 명사 + to부정사 표현이므로 (B) to complete가 정답. (A) 동사원형은 명사 뒤에 바로 올 수 없고, (C) completing은 effort와 결합하지 않으며, (D) completion은 명사라 뒤의 목적어 the audit을 취할 수 없다.", "point": "명사 + to부정사 (effort to)"}, {"id": "U06-D07", "stem": "Tenants have the right _______ a written explanation for any increase in monthly rent.", "ch": ["requesting", "requested", "to request", "request"], "a": 2, "ex": "해석  세입자들은 월 임대료 인상에 대해 서면 설명을 요구할 권리가 있다.\n해설  명사 right 뒤에 to부정사가 와서 '~할 권리'라는 뜻을 만들므로 (C) to request가 정답. (A) requesting과 (B) requested는 명사 right을 이런 의미로 수식하지 못하고, (D) 동사원형은 명사 뒤에 이어질 수 없다.", "point": "명사 + to부정사 (right to)"}, {"id": "U06-D08", "stem": "In order _______ shipping costs, Norwell Textiles has consolidated its deliveries into two weekly runs.", "ch": ["reduce", "reduced", "reducing", "to reduce"], "a": 3, "ex": "해석  배송비를 줄이기 위해 Norwell Textiles는 배송을 주 2회 운행으로 통합했다.\n해설  in order to + 동사원형(~하기 위해)은 목적을 나타내는 부사적 용법의 to부정사이므로 (D) to reduce가 정답. (A) 동사원형, (B) 과거분사, (C) 동명사는 모두 in order 뒤에 올 수 없는 형태다.", "point": "부사 역할 — in order to (목적)"}, {"id": "U06-D09", "stem": "Ms. Okafor traveled to the Lisbon branch last week _______ the newly hired sales staff.", "ch": ["to train", "train", "trained", "trains"], "a": 0, "ex": "해석  Okafor 씨는 새로 채용된 영업 직원들을 교육하기 위해 지난주 리스본 지점으로 출장을 갔다.\n해설  문장의 동사 traveled가 이미 있고 빈칸 이하가 '교육하기 위해'라는 목적을 나타내므로 부사적 용법의 to부정사 (A) to train이 정답. (B)·(D)는 동사가 두 개가 되어 틀리고, (C) trained는 과거분사라 목적의 의미를 만들 수 없다.", "point": "부사 역할 — 목적(~하기 위해)"}, {"id": "U06-D10", "stem": "Customers must present a valid receipt _______ a refund for any defective merchandise.", "ch": ["obtain", "to obtain", "obtaining", "obtained"], "a": 1, "ex": "해석  고객은 결함 있는 상품에 대해 환불을 받으려면 유효한 영수증을 제시해야 한다.\n해설  빈칸 이하는 '환불을 받기 위해'라는 목적을 나타내므로 부사적 용법의 to부정사 (B) to obtain이 정답. (A) 동사원형은 must present와 연결되지 않고, (C) obtaining과 (D) obtained는 목적의 의미를 만들지 못한다.", "point": "부사 역할 — 목적(~하기 위해)"}, {"id": "U06-D11", "stem": "The board of directors has decided _______ the opening of the new distribution center until next spring.", "ch": ["postpone", "postponing", "to postpone", "postponed"], "a": 2, "ex": "해석  이사회는 새 물류센터의 개장을 내년 봄까지 연기하기로 결정했다.\n해설  decide는 to부정사를 목적어로 취하는 동사이므로 (C) to postpone이 정답. (B) postponing 같은 동명사는 decide의 목적어로 쓰이지 않고, (A)·(D)는 has decided 뒤에 바로 이어질 수 없다.", "point": "to부정사를 목적어로 취하는 동사 (decide)"}, {"id": "U06-D12", "stem": "Greenfield Catering cannot afford _______ its prices during the busy holiday season.", "ch": ["raise", "raising", "raised", "to raise"], "a": 3, "ex": "해석  Greenfield Catering은 바쁜 연휴 시즌 동안 가격을 올릴 여유가 없다.\n해설  afford는 to부정사를 목적어로 취하므로 (D) to raise가 정답. (B) raising은 afford의 목적어로 쓸 수 없고, (A) 동사원형과 (C) 과거분사는 목적어 자리에 올 수 없다.", "point": "to부정사를 목적어로 취하는 동사 (afford)"}, {"id": "U06-D13", "stem": "Mr. Delacroix has agreed _______ the keynote speech at the regional marketing conference in October.", "ch": ["to give", "give", "giving", "given"], "a": 0, "ex": "해석  Delacroix 씨는 10월 지역 마케팅 학회에서 기조연설을 하기로 동의했다.\n해설  agree는 to부정사를 목적어로 취하는 동사이므로 (A) to give가 정답. (C) giving은 agree 뒤에 올 수 없고, (B)·(D)는 has agreed 뒤에 바로 이어질 수 없는 형태다.", "point": "to부정사를 목적어로 취하는 동사 (agree)"}, {"id": "U06-D14", "stem": "Despite the heavy traffic, the courier managed _______ the documents to the law firm before noon.", "ch": ["deliver", "to deliver", "delivering", "delivery"], "a": 1, "ex": "해석  교통 체증에도 불구하고 배달원은 정오 전에 법률 사무소에 서류를 가까스로 전달했다.\n해설  manage to + 동사원형(가까스로 ~해내다)이므로 (B) to deliver가 정답. (C) delivering은 manage의 목적어가 될 수 없고, (A)는 동사원형, (D) delivery는 명사라 뒤의 목적어 the documents를 취할 수 없다.", "point": "to부정사를 목적어로 취하는 동사 (manage)"}, {"id": "U06-D15", "stem": "Customers who refuse _______ the updated terms of service will lose access to the online portal after March 1.", "ch": ["accept", "accepting", "to accept", "accepted"], "a": 2, "ex": "해석  갱신된 서비스 약관을 수락하기를 거부하는 고객은 3월 1일 이후 온라인 포털에 접속할 수 없게 된다.\n해설  refuse는 to부정사를 목적어로 취하므로 (C) to accept가 정답. (B) accepting은 refuse 뒤에 쓰지 않고, (A) 동사원형과 (D) 과거분사는 목적어 자리에 올 수 없다.", "point": "to부정사를 목적어로 취하는 동사 (refuse)"}, {"id": "U06-D16", "stem": "All department heads are _______ to attend the budget review on Thursday morning.", "ch": ["require", "requires", "requiring", "required"], "a": 3, "ex": "해석  모든 부서장은 목요일 오전 예산 검토 회의에 참석해야 한다.\n해설  be required to + 동사원형(~해야 한다)이라는 be + 과거분사 + to부정사 표현이므로 (D) required가 정답. (A)·(B)는 be동사 뒤에 올 수 없는 동사 형태이고, (C) requiring은 '요구하는'이라는 능동의 뜻이 되어 어색하다.", "point": "be + 분사 + to부정사 (be required to)"}, {"id": "U06-D17", "stem": "The renovation of the lobby is _______ to begin in early June and last about six weeks.", "ch": ["scheduled", "schedule", "scheduling", "schedules"], "a": 0, "ex": "해석  로비 개조 공사는 6월 초에 시작해 약 6주간 계속될 예정이다.\n해설  be scheduled to + 동사원형(~할 예정이다) 표현이므로 (A) scheduled가 정답. (B)·(D)는 명사 또는 동사 형태로 is 뒤에 올 수 없고, (C) scheduling은 진행형이 되어 '일정을 잡고 있는 중'이라는 어색한 뜻이 된다.", "point": "be + 분사 + to부정사 (be scheduled to)"}, {"id": "U06-D18", "stem": "Ms. Whitfield said she was _______ to accept the position of regional director.", "ch": ["please", "pleased", "pleasing", "pleasure"], "a": 1, "ex": "해석  Whitfield 씨는 지역 이사직을 수락하게 되어 기쁘다고 말했다.\n해설  be pleased to + 동사원형(~하게 되어 기쁘다)이라는 감정 표현이므로 (B) pleased가 정답. (C) pleasing은 '기쁘게 하는'이라는 뜻으로 사람의 감정을 나타내지 못하고, (A) 동사원형과 (D) 명사는 was 뒤에서 이 뜻을 만들 수 없다.", "point": "be + 분사 + to부정사 (be pleased to)"}, {"id": "U06-D19", "stem": "The supplier is _______ to offer a discount if we sign a two-year contract.", "ch": ["will", "willingness", "willing", "willingly"], "a": 2, "ex": "해석  그 공급업체는 우리가 2년 계약을 맺으면 기꺼이 할인을 제공하려 한다.\n해설  be willing to + 동사원형(기꺼이 ~하다)이라는 be + 형용사 + to부정사 표현이므로 (C) willing이 정답. (A) will은 조동사, (B) willingness는 명사, (D) willingly는 부사로 is 뒤에서 to offer와 결합할 수 없다.", "point": "be + 형용사 + to부정사 (be willing to)"}, {"id": "U06-D20", "stem": "Analysts say that Barrow Logistics is _______ to report record profits for the third quarter.", "ch": ["like", "likeness", "liked", "likely"], "a": 3, "ex": "해석  분석가들은 Barrow Logistics가 3분기에 기록적인 이익을 발표할 가능성이 높다고 말한다.\n해설  be likely to + 동사원형(~할 가능성이 높다) 표현이므로 (D) likely가 정답. (A) like는 동사·전치사, (B) likeness는 명사, (C) liked는 과거분사로 이 자리에서 to report와 연결되지 않는다.", "point": "be + 형용사 + to부정사 (be likely to)"}, {"id": "U06-D21", "stem": "The new policy allows employees _______ from home up to two days a week.", "ch": ["to work", "work", "working", "worked"], "a": 0, "ex": "해석  새 정책은 직원들이 주 2일까지 재택근무를 하도록 허용한다.\n해설  allow + 목적어 + to부정사(~가 …하도록 허용하다) 구문이므로 목적격 보어 자리에 (A) to work가 정답. (B) 동사원형과 (C) working은 allow의 목적격 보어로 쓰지 않으며, (D) worked도 이 자리에 올 수 없다.", "point": "동사 + 목적어 + to부정사 (allow)"}, {"id": "U06-D22", "stem": "Please remind all participants _______ their name badges to the registration desk after the event.", "ch": ["return", "to return", "returning", "returned"], "a": 1, "ex": "해석  행사 후 모든 참가자에게 이름표를 등록 데스크에 반납하라고 상기시켜 주십시오.\n해설  remind + 목적어 + to부정사(~에게 …하라고 상기시키다) 구문이므로 (B) to return이 정답. (A) 동사원형과 (C) returning은 remind의 목적격 보어가 될 수 없고, (D) returned는 과거분사라 어울리지 않는다.", "point": "동사 + 목적어 + to부정사 (remind)"}, {"id": "U06-D23", "stem": "The safety inspector required the factory _______ its ventilation system within thirty days.", "ch": ["replace", "replacing", "to replace", "replacement"], "a": 2, "ex": "해석  안전 검사관은 공장에 30일 이내에 환기 시스템을 교체하도록 요구했다.\n해설  require + 목적어 + to부정사(~에게 …하도록 요구하다) 구문이므로 (C) to replace가 정답. (A)·(B)는 목적격 보어 자리에 쓸 수 없고, (D) replacement는 명사라 뒤의 목적어 its ventilation system을 취하지 못한다.", "point": "동사 + 목적어 + to부정사 (require)"}, {"id": "U06-D24", "stem": "The mentoring program encourages junior staff _______ new responsibilities early in their careers.", "ch": ["take", "took", "taking", "to take"], "a": 3, "ex": "해석  그 멘토링 프로그램은 신입 직원들이 경력 초기에 새로운 책임을 맡도록 장려한다.\n해설  encourage + 목적어 + to부정사(~가 …하도록 장려하다) 구문이므로 (D) to take가 정답. (A) 동사원형과 (C) taking은 encourage의 목적격 보어로 쓰지 않고, (B) took은 과거형이라 올 수 없다.", "point": "동사 + 목적어 + to부정사 (encourage)"}, {"id": "U06-D25", "stem": "Before _______ the contract, the legal team reviewed every clause related to payment terms.", "ch": ["signing", "sign", "signed", "to sign"], "a": 0, "ex": "해석  계약서에 서명하기 전에 법무팀은 지급 조건과 관련된 모든 조항을 검토했다.\n해설  전치사 before 뒤에는 명사 역할을 하는 동명사가 와야 하므로 (A) signing이 정답. (D) to sign처럼 to부정사는 전치사의 목적어가 될 수 없고, (B)·(C)는 동사 형태라 전치사 뒤에 올 수 없다.", "point": "동명사 — 전치사 뒤 목적어 (before -ing)"}, {"id": "U06-D26", "stem": "Mr. Hanley is responsible for _______ the inventory records at the end of each month.", "ch": ["update", "updating", "to update", "updated"], "a": 1, "ex": "해석  Hanley 씨는 매월 말 재고 기록을 갱신하는 일을 담당하고 있다.\n해설  전치사 for 뒤에는 동명사가 목적어로 와야 하므로 (B) updating이 정답. (C) to update는 전치사 뒤에 쓸 수 없고, (A) 동사원형과 (D) 과거분사도 전치사의 목적어가 될 수 없다.", "point": "동명사 — 전치사 뒤 목적어 (responsible for -ing)"}, {"id": "U06-D27", "stem": "The committee is considering _______ the annual conference to a larger venue next year.", "ch": ["move", "to move", "moving", "moved"], "a": 2, "ex": "해석  위원회는 내년에 연례 학회를 더 큰 장소로 옮기는 것을 고려하고 있다.\n해설  consider는 동명사를 목적어로 취하는 동사이므로 (C) moving이 정답. (B) to move처럼 to부정사는 consider의 목적어로 쓰지 않고, (A)·(D)는 목적어 자리에 올 수 없다.", "point": "동명사를 목적어로 취하는 동사 (consider)"}, {"id": "U06-D28", "stem": "Ms. Ito suggested _______ the training sessions on Friday afternoons to increase attendance.", "ch": ["hold", "held", "to hold", "holding"], "a": 3, "ex": "해석  Ito 씨는 참석률을 높이기 위해 교육 세션을 금요일 오후에 열자고 제안했다.\n해설  suggest는 동명사를 목적어로 취하는 동사이므로 (D) holding이 정답. (C) to hold처럼 to부정사는 suggest의 목적어가 될 수 없고, (A) 동사원형과 (B) 과거분사도 목적어 자리에 올 수 없다.", "point": "동명사를 목적어로 취하는 동사 (suggest)"}, {"id": "U06-D29", "stem": "To keep costs down, the company has put off _______ the aging office printers until next year.", "ch": ["upgrading", "upgrade", "to upgrade", "upgraded"], "a": 0, "ex": "해석  비용을 억제하기 위해 회사는 노후한 사무실 프린터를 새것으로 바꾸는 일을 내년까지 미루었다.\n해설  put off(미루다)는 동명사를 목적어로 취하므로 (A) upgrading이 정답. (C) to upgrade는 put off 뒤에 쓸 수 없고, (B)·(D)는 목적어 자리에 올 수 없는 동사 형태다.", "point": "동명사를 목적어로 취하는 동사 (put off)"}, {"id": "U06-D30", "stem": "Drivers should avoid _______ the delivery vans in the loading zone during business hours.", "ch": ["park", "parking", "to park", "parked"], "a": 1, "ex": "해석  운전기사들은 영업시간 중에 배송 밴을 하역 구역에 주차하는 것을 피해야 한다.\n해설  avoid는 동명사를 목적어로 취하는 동사이므로 (B) parking이 정답. (C) to park처럼 to부정사는 avoid 뒤에 올 수 없고, (A) 동사원형과 (D) 과거분사도 목적어가 될 수 없다.", "point": "동명사를 목적어로 취하는 동사 (avoid)"}, {"id": "U06-D31", "stem": "Even after the merger, the firm will keep _______ its regional offices in Denver and Phoenix.", "ch": ["operate", "to operate", "operating", "operated"], "a": 2, "ex": "해석  합병 후에도 그 회사는 덴버와 피닉스의 지역 사무소를 계속 운영할 것이다.\n해설  keep + 동명사(계속 ~하다) 구문이므로 (C) operating이 정답. (B) to operate는 keep의 목적어로 쓰지 않고, (A)·(D)는 keep 뒤에 바로 올 수 없다.", "point": "동명사를 목적어로 취하는 동사 (keep)"}, {"id": "U06-D32", "stem": "According to the supervisor, _______ the shipping labels twice before dispatch has significantly reduced delivery errors.", "ch": ["verify", "verified", "verification", "verifying"], "a": 3, "ex": "해석  감독관에 따르면, 발송 전에 배송 라벨을 두 번 확인하는 것이 배송 오류를 크게 줄였다.\n해설  주어 자리이면서 뒤에 목적어 the shipping labels가 있으므로 동명사 (D) verifying이 정답. (C) verification은 명사라 목적어를 바로 취할 수 없고, (A) 동사원형과 (B) 과거분사는 주어가 될 수 없다.", "point": "동명사 vs 명사 — 주어 자리 + 뒤에 목적어"}, {"id": "U06-D33", "stem": "The manager recommended a thorough _______ of the safety procedures before the inspection.", "ch": ["review", "reviewing", "reviewed", "to review"], "a": 0, "ex": "해석  관리자는 점검 전에 안전 절차를 철저히 검토할 것을 권고했다.\n해설  관사 a와 형용사 thorough 뒤, 그리고 전치사 of 앞이므로 명사 (A) review가 정답. (B) reviewing은 동명사로 관사와 형용사의 수식을 받는 자리에 쓰지 않고, (C)·(D)는 이 자리에 올 수 없는 형태다.", "point": "동명사 vs 명사 — 관사·형용사 뒤는 명사"}, {"id": "U06-D34", "stem": "Ms. Farrow's promotion followed the successful _______ of the Hartley account last spring.", "ch": ["expand", "expansion", "expanding", "expanded"], "a": 1, "ex": "해석  Farrow 씨의 승진은 지난봄 Hartley 거래처를 성공적으로 확대한 데 따른 것이었다.\n해설  정관사 the와 형용사 successful의 수식을 받고 뒤에 전치사 of가 이어지므로 명사 (B) expansion이 정답. (C) expanding은 동명사라 목적어를 직접 취해야 하며 형용사의 수식을 받는 자리에는 어울리지 않고, (A)·(D)는 동사 형태다.", "point": "동명사 vs 명사 — 관사·형용사 뒤는 명사"}, {"id": "U06-D35", "stem": "Upon _______ the client's approval, the design team will begin producing the final drawings.", "ch": ["receive", "received", "receiving", "to receive"], "a": 2, "ex": "해석  고객의 승인을 받자마자 디자인팀은 최종 도면 제작을 시작할 것이다.\n해설  upon + -ing(~하자마자)라는 동명사 관용 표현이므로 (C) receiving이 정답. upon은 전치사이므로 (D) to receive는 올 수 없고, (A) 동사원형과 (B) 과거분사도 전치사 뒤에 쓸 수 없다.", "point": "동명사 관용 표현 (upon -ing)"}, {"id": "U06-D36", "stem": "Many first-time exporters have difficulty _______ the customs paperwork correctly without professional help.", "ch": ["understand", "understood", "to understand", "understanding"], "a": 3, "ex": "해석  처음 수출하는 많은 업체는 전문가의 도움 없이는 세관 서류를 정확히 이해하는 데 어려움을 겪는다.\n해설  have difficulty + -ing(~하는 데 어려움을 겪다)라는 동명사 관용 표현이므로 (D) understanding이 정답. (C) to understand처럼 to부정사는 이 표현에 쓰지 않고, (A)·(B)는 difficulty 뒤에 올 수 없다.", "point": "동명사 관용 표현 (have difficulty -ing)"}, {"id": "U06-D37", "stem": "The marketing team spent three weeks _______ the new advertising campaign for the spring launch.", "ch": ["preparing", "prepare", "to prepare", "prepared"], "a": 0, "ex": "해석  마케팅팀은 봄 출시를 위한 새 광고 캠페인을 준비하는 데 3주를 보냈다.\n해설  spend + 시간 + -ing(~하는 데 시간을 쓰다) 구문이므로 (A) preparing이 정답. (C) to prepare는 spend 구문에 쓰지 않고, (B) 동사원형과 (D) 과거분사도 올 수 없다.", "point": "동명사 관용 표현 (spend 시간 -ing)"}, {"id": "U06-D38", "stem": "We look forward to _______ you at the international trade show in Munich next month.", "ch": ["see", "seeing", "saw", "to see"], "a": 1, "ex": "해석  다음 달 뮌헨 국제 무역 박람회에서 귀하를 뵙기를 고대합니다.\n해설  look forward to의 to는 전치사이므로 뒤에 동명사 (B) seeing이 와야 한다. (A) 동사원형과 (D) to see는 전치사 뒤에 올 수 없고, (C) saw는 과거형이라 불가능하다.", "point": "전치사 to + 동명사 (look forward to)"}, {"id": "U06-D39", "stem": "Several local residents are opposed to _______ the historic warehouse to make room for a parking garage.", "ch": ["demolish", "to demolish", "demolishing", "demolished"], "a": 2, "ex": "해석  몇몇 지역 주민들은 주차장 부지를 마련하기 위해 역사적인 창고를 철거하는 것에 반대한다.\n해설  be opposed to의 to는 전치사이므로 동명사 (C) demolishing이 정답. (B) to demolish는 to가 겹쳐 문법적으로 틀리고, (A) 동사원형과 (D) 과거분사는 전치사의 목적어가 될 수 없다.", "point": "전치사 to + 동명사 (be opposed to)"}, {"id": "U06-D40", "stem": "The new hires quickly became accustomed to _______ the automated scheduling system.", "ch": ["use", "used", "to use", "using"], "a": 3, "ex": "해석  신입 직원들은 자동 일정 관리 시스템을 사용하는 데 빠르게 익숙해졌다.\n해설  be accustomed to + -ing(~하는 데 익숙하다)에서 to는 전치사이므로 동명사 (D) using이 정답. (C) to use는 to가 겹쳐 틀리고, (A) 동사원형과 (B) 과거분사는 전치사 뒤에 올 수 없다.", "point": "전치사 to + 동명사 (be accustomed to)"}]}, {"id": "U07", "name": "U07 분사", "items": [{"id": "U07-D01", "stem": "Because of _______ fuel costs, Delmar Freight will adjust its delivery rates at the beginning of next month.", "ch": ["rise", "rising", "risen", "rises"], "a": 1, "ex": "해석  상승하는 연료비 때문에 델마 프레이트는 다음 달 초에 배송 요금을 조정할 것이다.\n해설  빈칸은 명사 fuel costs를 앞에서 꾸미는 자리이며, 연료비가 스스로 '오르는' 것이므로 능동의 현재분사 (B) rising이 정답이다. rising costs는 빈출 결합이다. (A)·(D)는 동사이고, (C) risen은 자동사 rise의 과거분사라 수동의 뜻으로 명사를 꾸밀 수 없다.", "point": "명사 앞 현재분사"}, {"id": "U07-D02", "stem": "The _______ tickets for the Harlow Jazz Festival will be sold at the box office on the day of the event.", "ch": ["remain", "remains", "remained", "remaining"], "a": 3, "ex": "해석  할로 재즈 페스티벌의 남은 표는 행사 당일 매표소에서 판매될 것이다.\n해설  관사 The와 명사 tickets 사이는 명사를 꾸미는 분사 자리다. 표가 '남아 있는' 것으로 능동의 의미이므로 현재분사 (D) remaining이 정답이다. remaining tickets/inventory는 빈출 결합이다. (A)·(B)는 동사, (C) remained는 자동사 remain의 과거분사라 명사를 수동으로 꾸밀 수 없다.", "point": "명사 앞 현재분사"}, {"id": "U07-D03", "stem": "Vextra Solar has quickly become a _______ supplier of rooftop panels in the Pacific Northwest region.", "ch": ["leading", "leader", "led", "leads"], "a": 0, "ex": "해석  벡스트라 솔라는 빠르게 태평양 북서부 지역의 선도적인 옥상 패널 공급업체가 되었다.\n해설  관사 a와 명사 supplier 사이의 형용사 자리이며, 공급업체가 시장을 '이끄는' 주체이므로 현재분사 (A) leading이 정답이다. (B) leader는 명사라 supplier 앞에 나란히 올 수 없고, (C) led는 '이끌어진'이라는 수동의 뜻이 되어 어색하며, (D)는 동사다.", "point": "명사 앞 현재분사"}, {"id": "U07-D04", "stem": "Ms. Okafor's keynote speech made a _______ impression on the young entrepreneurs who attended the summit.", "ch": ["lasts", "lasted", "lasting", "lastly"], "a": 2, "ex": "해석  오카포 씨의 기조연설은 정상회의에 참석한 젊은 기업가들에게 오래 남는 인상을 주었다.\n해설  관사 a와 명사 impression 사이는 형용사 자리이며, 인상이 '오래 지속되는' 것이므로 현재분사 (C) lasting이 정답이다. a lasting impression은 빈출 결합이다. (A)·(B)는 동사, (D)는 부사라 명사를 꾸밀 수 없다.", "point": "명사 앞 현재분사"}, {"id": "U07-D05", "stem": "All warehouse staff should download the _______ safety manual from the company intranet before the inspection on Monday.", "ch": ["update", "updating", "updates", "updated"], "a": 3, "ex": "해석  모든 창고 직원은 월요일 점검 전에 회사 인트라넷에서 업데이트된 안전 매뉴얼을 내려받아야 한다.\n해설  관사 the와 명사 safety manual 사이의 형용사 자리이며, 매뉴얼은 '업데이트된' 대상이므로 수동의 과거분사 (D) updated가 정답이다. updated manual은 빈출 결합이다. (A)·(C)는 동사, (B) updating은 매뉴얼이 스스로 업데이트한다는 능동의 뜻이 되어 어색하다.", "point": "명사 앞 과거분사"}, {"id": "U07-D06", "stem": "To achieve the _______ results, apply the coating evenly and allow each layer to dry for at least two hours.", "ch": ["desire", "desired", "desiring", "desires"], "a": 1, "ex": "해석  원하는 결과를 얻으려면 코팅제를 고르게 바르고 각 층을 최소 두 시간 동안 말리십시오.\n해설  관사 the와 명사 results 사이의 형용사 자리이며, 결과는 '원해지는' 대상이므로 과거분사 (B) desired가 정답이다. desired results는 빈출 결합이다. (A)·(D)는 동사 또는 명사이고, (C) desiring은 결과가 스스로 원한다는 능동의 뜻이 되어 어색하다.", "point": "명사 앞 과거분사"}, {"id": "U07-D07", "stem": "The _______ merger between Kentwell Bank and Orion Trust still requires approval from federal regulators.", "ch": ["propose", "proposes", "proposing", "proposed"], "a": 3, "ex": "해석  켄트웰 은행과 오리온 트러스트 간의 제안된 합병은 여전히 연방 규제 당국의 승인을 필요로 한다.\n해설  관사 The와 명사 merger 사이는 형용사 자리이며, 합병은 '제안된' 대상이므로 과거분사 (D) proposed가 정답이다. proposed merger/initiative는 빈출 결합이다. (A)·(B)는 동사라 본동사 requires가 이미 있는 문장에 들어갈 수 없고, (C) proposing은 능동의 뜻이라 어색하다.", "point": "명사 앞 과거분사"}, {"id": "U07-D08", "stem": "Ridley Engineering hopes to find _______ candidates to fill three vacancies in its Denver branch by the end of August.", "ch": ["qualified", "qualify", "qualifying", "qualification"], "a": 0, "ex": "해석  리들리 엔지니어링은 8월 말까지 덴버 지점의 공석 세 자리를 채울 자격을 갖춘 후보자를 찾기를 바란다.\n해설  명사 candidates를 앞에서 꾸미는 형용사 자리이며, 후보자는 자격을 '인정받은' 대상이므로 과거분사 (A) qualified가 정답이다. qualified candidates는 빈출 결합이다. (B)는 동사, (C) qualifying은 '자격을 주는'이라는 능동의 뜻이라 어색하고, (D)는 명사다.", "point": "명사 앞 과거분사"}, {"id": "U07-D09", "stem": "Applicants _______ a position in the accounting department must submit two letters of recommendation with their application.", "ch": ["seek", "seeks", "seeking", "sought"], "a": 2, "ex": "해석  회계 부서의 자리를 구하는 지원자는 지원서와 함께 추천서 두 통을 제출해야 한다.\n해설  본동사 must submit이 이미 있으므로 빈칸은 명사 Applicants를 뒤에서 꾸미는 분사 자리다. 뒤에 목적어 a position이 있고 지원자가 자리를 '구하는' 주체이므로 현재분사 (C) seeking이 정답이다. (A)·(B)는 동사라 동사가 두 개가 되고, (D) sought는 과거분사라 수동의 뜻이 되어 뒤에 목적어를 취할 수 없다.", "point": "명사 뒤 현재분사(목적어 있음)"}, {"id": "U07-D10", "stem": "Our travel desk has partnered with several hotels _______ special rates to employees who attend the annual sales conference.", "ch": ["provide", "provided", "providing", "provides"], "a": 2, "ex": "해석  우리 출장 담당 부서는 연례 영업 회의에 참석하는 직원에게 특별 요금을 제공하는 여러 호텔과 제휴를 맺었다.\n해설  본동사 has partnered가 있으므로 빈칸은 명사 hotels를 뒤에서 꾸미는 분사 자리다. 뒤에 목적어 special rates가 있고 호텔이 요금을 '제공하는' 주체이므로 현재분사 (C) providing이 정답이다. (B) provided는 수동의 뜻이라 목적어를 취할 수 없고, (A)·(D)는 동사라 관계대명사 없이 명사 뒤에 이어질 수 없다.", "point": "명사 뒤 현재분사(목적어 있음)"}, {"id": "U07-D11", "stem": "Please discard any packages _______ perishable goods that were delivered during the power outage last night.", "ch": ["containing", "contain", "contained", "contains"], "a": 0, "ex": "해석  어젯밤 정전 중에 배달된, 상하기 쉬운 물품이 들어 있는 소포는 모두 폐기해 주십시오.\n해설  명사 packages를 뒤에서 꾸미는 분사 자리이며, 뒤에 목적어 perishable goods가 있고 소포가 물품을 '담고 있는' 주체이므로 현재분사 (A) containing이 정답이다. (C) contained는 수동의 뜻이라 목적어를 취할 수 없고, (B)·(D)는 동사라 본동사 discard가 있는 명령문에 들어갈 수 없다.", "point": "명사 뒤 현재분사(목적어 있음)"}, {"id": "U07-D12", "stem": "The new logo _______ by Pillar Creative Studio will appear on all product packaging from next March.", "ch": ["design", "designed", "designing", "to design"], "a": 1, "ex": "해석  필라 크리에이티브 스튜디오가 디자인한 새 로고는 내년 3월부터 모든 제품 포장에 표시될 것이다.\n해설  본동사 will appear가 있으므로 빈칸은 주어 logo를 뒤에서 꾸미는 분사 자리다. 로고는 '디자인되는' 대상이고 뒤에 <by + 행위자>가 있으므로 과거분사 (B) designed가 정답이다. (C) designing은 능동의 뜻이라 by와 어울리지 않고, (A)는 동사, (D)는 to부정사라 '디자인해야 할 로고'라는 어색한 뜻이 된다.", "point": "명사 뒤 과거분사"}, {"id": "U07-D13", "stem": "Expense reports _______ after the 25th of the month will be reimbursed in the following pay period.", "ch": ["submit", "submitting", "submitted", "submits"], "a": 2, "ex": "해석  매월 25일 이후에 제출된 경비 보고서는 다음 급여 기간에 정산될 것이다.\n해설  본동사 will be reimbursed가 있으므로 빈칸은 주어 Expense reports를 뒤에서 꾸미는 분사 자리다. 보고서는 '제출되는' 대상이므로 과거분사 (C) submitted가 정답이다. (B) submitting은 보고서가 스스로 제출한다는 뜻이 되어 어색하고, (A)·(D)는 동사라 동사가 두 개가 된다.", "point": "명사 뒤 과거분사"}, {"id": "U07-D14", "stem": "The assembly instructions _______ on the back of the box explain how to fasten the shelves to the frame.", "ch": ["print", "printing", "prints", "printed"], "a": 3, "ex": "해석  상자 뒷면에 인쇄된 조립 설명서는 선반을 틀에 고정하는 방법을 설명한다.\n해설  본동사 explain이 있으므로 빈칸은 주어 instructions를 뒤에서 꾸미는 분사 자리다. 설명서는 '인쇄된' 대상이므로 과거분사 (D) printed가 정답이다. (B) printing은 설명서가 무언가를 인쇄한다는 능동의 뜻이라 어색하고, (A)·(C)는 동사라 본동사가 있는 문장에 들어갈 수 없다.", "point": "명사 뒤 과거분사"}, {"id": "U07-D15", "stem": "The sales workshop _______ in the main conference room yesterday attracted more than eighty participants.", "ch": ["hold", "held", "holding", "holds"], "a": 1, "ex": "해석  어제 대회의실에서 열린 영업 워크숍에는 80명이 넘는 참가자가 모였다.\n해설  본동사 attracted가 있으므로 빈칸은 주어 workshop을 뒤에서 꾸미는 분사 자리다. 워크숍은 '개최되는' 대상이므로 과거분사 (B) held가 정답이다. (C) holding은 워크숍이 무언가를 연다는 능동의 뜻이 되어 어색하고, (A)·(D)는 동사다.", "point": "명사 뒤 과거분사"}, {"id": "U07-D16", "stem": "Several customers complained that the new checkout process on the company Web site was _______.", "ch": ["confuse", "confused", "confuses", "confusing"], "a": 3, "ex": "해석  여러 고객이 회사 웹사이트의 새 결제 절차가 혼란스럽다고 불평했다.\n해설  be동사 was 뒤의 주격 보어 자리이며, 주어 process는 사물로서 혼란을 '유발하는' 쪽이므로 현재분사 (D) confusing이 정답이다. (B) confused는 사람이 혼란을 '느낄' 때 쓰고, (A)·(C)는 동사라 be동사 뒤 보어 자리에 올 수 없다.", "point": "감정분사 -ing(사물 주어)"}, {"id": "U07-D17", "stem": "The sales figures for the third quarter were _______, so the marketing team will revise its promotional strategy.", "ch": ["disappointing", "disappoint", "disappointed", "disappoints"], "a": 0, "ex": "해석  3분기 매출 수치가 실망스러웠기 때문에 마케팅팀은 판촉 전략을 수정할 것이다.\n해설  were 뒤의 주격 보어 자리이며, 주어 sales figures는 사물로서 실망을 '유발하는' 쪽이므로 현재분사 (A) disappointing이 정답이다. (C) disappointed는 사람이 실망을 '느낄' 때 쓰며, (B)·(D)는 동사라 보어 자리에 올 수 없다.", "point": "감정분사 -ing(사물 주어)"}, {"id": "U07-D18", "stem": "It is hardly _______ that the Marlow Hotel received an award for its excellent customer service this year.", "ch": ["surprises", "surprised", "surprising", "surprisingly"], "a": 2, "ex": "해석  말로 호텔이 올해 뛰어난 고객 서비스로 상을 받은 것은 전혀 놀랍지 않다.\n해설  is 뒤의 주격 보어 자리이며, 가주어 It이 가리키는 that절의 내용이 놀라움을 '유발하는' 쪽이므로 현재분사 (C) surprising이 정답이다. (B) surprised는 사람이 놀라움을 '느낄' 때 쓰고, (A)는 동사, (D)는 부사라 보어가 될 수 없다.", "point": "감정분사 -ing(사물 주어)"}, {"id": "U07-D19", "stem": "According to the survey, most guests were highly _______ with the cleanliness of the rooms at Brookhaven Inn.", "ch": ["satisfy", "satisfied", "satisfying", "satisfaction"], "a": 1, "ex": "해석  설문 조사에 따르면 대부분의 투숙객은 브룩헤이븐 인의 객실 청결도에 매우 만족했다.\n해설  were 뒤의 주격 보어 자리이며, 주어 guests는 사람으로서 만족을 '느끼는' 쪽이므로 과거분사 (B) satisfied가 정답이다. be satisfied with(~에 만족하다)는 빈출 표현이다. (C) satisfying은 사물이 만족을 '줄' 때 쓰고, (A)는 동사, (D)는 명사다.", "point": "감정분사 p.p.(사람 주어)"}, {"id": "U07-D20", "stem": "Employees _______ in joining the new wellness program should contact Ms. Delgado in Human Resources by Friday.", "ch": ["interest", "interesting", "interests", "interested"], "a": 3, "ex": "해석  새 건강 증진 프로그램 참여에 관심 있는 직원은 금요일까지 인사부의 델가도 씨에게 연락해야 한다.\n해설  본동사 should contact가 있으므로 빈칸은 명사 Employees를 뒤에서 꾸미는 분사 자리다. 직원은 사람으로서 관심을 '느끼는' 쪽이므로 과거분사 (D) interested가 정답이며, interested in(~에 관심 있는)은 빈출 표현이다. (B) interesting은 사물이 흥미를 '줄' 때 쓰고, (A)·(C)는 동사 또는 명사다.", "point": "감정분사 p.p.(사람 주어)"}, {"id": "U07-D21", "stem": "Many commuters were _______ by the sudden closure of the Harbor Bridge during the morning rush hour.", "ch": ["frustrated", "frustrate", "frustrating", "frustration"], "a": 0, "ex": "해석  많은 통근자가 아침 출근 시간대에 하버 브리지가 갑자기 폐쇄되어 좌절감을 느꼈다.\n해설  were 뒤의 주격 보어 자리이며, 주어 commuters는 사람으로서 좌절감을 '느끼는' 쪽이고 뒤에 원인을 나타내는 <by + 명사>가 있으므로 과거분사 (A) frustrated가 정답이다. (C) frustrating은 사물이 좌절감을 '줄' 때 쓰고, (B)는 동사, (D)는 명사다.", "point": "감정분사 p.p.(사람 주어)"}, {"id": "U07-D22", "stem": "Department managers are expected to keep their teams _______ of any changes to the project timeline.", "ch": ["inform", "informed", "informing", "information"], "a": 1, "ex": "해석  부서 관리자는 프로젝트 일정의 모든 변경 사항을 팀원들에게 계속 알려 주어야 한다.\n해설  <keep + 목적어 + 목적격 보어> 구조에서 목적어 teams는 정보를 '전달받는' 대상이므로 과거분사 (B) informed가 정답이다. keep A informed of B(A에게 B를 계속 알리다)는 빈출 표현이다. (C) informing은 팀이 알려 주는 주체가 되어 뜻이 맞지 않고, (A)는 동사, (D)는 명사다.", "point": "분사 목적격 보어"}, {"id": "U07-D23", "stem": "Some participants found the last section of the certification exam extremely _______ because of its strict time limit.", "ch": ["challenge", "challenged", "challenging", "challenges"], "a": 2, "ex": "해석  일부 응시자는 엄격한 시간 제한 때문에 자격시험의 마지막 부분이 매우 어렵다고 느꼈다.\n해설  <find + 목적어 + 목적격 보어> 구조에서 목적어 section은 사물로서 어려움을 '주는' 쪽이므로 현재분사 (C) challenging이 정답이다. (B) challenged는 사람이 도전을 '받는' 뜻이라 어색하고, (A)·(D)는 동사 또는 명사라 부사 extremely의 수식을 받는 보어 자리에 맞지 않는다.", "point": "분사 목적격 보어"}, {"id": "U07-D24", "stem": "Please keep the supply cabinet _______ when it is not in use in order to prevent unauthorized access.", "ch": ["lock", "locking", "locks", "locked"], "a": 3, "ex": "해석  무단 접근을 막기 위해 비품 보관함을 사용하지 않을 때는 잠가 두십시오.\n해설  <keep + 목적어 + 목적격 보어> 구조에서 목적어 cabinet은 '잠기는' 대상이므로 과거분사 (D) locked가 정답이다. (B) locking은 보관함이 무언가를 잠근다는 능동의 뜻이 되어 어색하고, (A)·(C)는 동사라 보어 자리에 올 수 없다.", "point": "분사 목적격 보어"}, {"id": "U07-D25", "stem": "The delay at the loading dock kept several delivery trucks _______ for more than an hour this morning.", "ch": ["waiting", "wait", "waited", "waits"], "a": 0, "ex": "해석  오늘 아침 하역장에서의 지연으로 배송 트럭 여러 대가 한 시간 넘게 기다려야 했다.\n해설  <keep + 목적어 + 목적격 보어> 구조에서 목적어 trucks가 스스로 '기다리는' 주체이므로 능동·진행의 현재분사 (A) waiting이 정답이다. keep ~ waiting(~을 기다리게 하다)은 빈출 표현이다. (C) waited는 자동사 wait의 과거분사라 수동의 보어가 될 수 없고, (B)·(D)는 동사다.", "point": "분사 목적격 보어"}, {"id": "U07-D26", "stem": "Brightway Fitness will open a second location downtown next spring, _______ nearly thirty jobs for local fitness instructors.", "ch": ["create", "created", "creating", "creates"], "a": 2, "ex": "해석  브라이트웨이 피트니스는 내년 봄 시내에 두 번째 지점을 열어 지역 피트니스 강사를 위한 일자리 약 30개를 창출할 것이다.\n해설  콤마 뒤에 접속사와 주어 없이 이어지므로 분사구문 자리다. 뒤에 목적어 nearly thirty jobs가 있고 주어 Brightway Fitness가 일자리를 '만드는' 주체이므로 현재분사 (C) creating이 정답이다. (B) created는 수동의 뜻이라 목적어를 취할 수 없고, (A)·(D)는 동사라 접속사 없이 연결될 수 없다.", "point": "분사구문 능동"}, {"id": "U07-D27", "stem": "After _______ the feedback from last month's focus group, the product team decided to simplify the mobile application's menu.", "ch": ["review", "reviewed", "reviews", "reviewing"], "a": 3, "ex": "해석  지난달 포커스 그룹의 피드백을 검토한 후, 제품팀은 모바일 앱의 메뉴를 단순화하기로 결정했다.\n해설  접속사 After를 남긴 분사구문 자리이며, 뒤에 목적어 the feedback이 있고 주어 the product team이 피드백을 '검토하는' 주체이므로 현재분사 (D) reviewing이 정답이다. (B) reviewed는 수동의 뜻이라 목적어를 취할 수 없고, (A)·(C)는 동사라 주어 없이 After 뒤에 올 수 없다.", "point": "분사구문 능동(접속사 남김)"}, {"id": "U07-D28", "stem": "Mr. Baptiste departed for the airport at noon, _______ his assistant in charge of the afternoon client meetings.", "ch": ["leave", "left", "leaving", "leaves"], "a": 2, "ex": "해석  밥티스트 씨는 정오에 공항으로 떠나면서 오후 고객 회의를 비서에게 맡겼다.\n해설  콤마 뒤에 접속사와 주어 없이 이어지는 분사구문 자리다. 뒤에 목적어 his assistant가 있고 주어 Mr. Baptiste가 비서에게 일을 '맡기는' 주체이므로 현재분사 (C) leaving이 정답이다. (B) left는 과거형이라 접속사 없이 동사 두 개가 연결될 수 없고, 과거분사로 보아도 수동의 뜻이라 목적어를 취할 수 없다. (A)·(D)도 동사다.", "point": "분사구문 능동"}, {"id": "U07-D29", "stem": "When _______ the research laboratory, all visitors must wear protective goggles and a lab coat at all times.", "ch": ["entering", "enter", "entered", "entrance"], "a": 0, "ex": "해석  연구실에 들어갈 때 모든 방문객은 항상 보안경과 실험복을 착용해야 한다.\n해설  접속사 When을 남긴 분사구문이며, 뒤에 목적어 the research laboratory가 있고 주어 visitors가 '들어가는' 주체이므로 현재분사 (A) entering이 정답이다. (C) entered는 수동의 뜻이라 목적어를 취할 수 없고, (B)는 동사라 주어 없이 쓸 수 없으며, (D)는 명사다.", "point": "분사구문 능동(접속사 남김)"}, {"id": "U07-D30", "stem": "Originally _______ in 1985 as a small family bakery, Harmon Foods now operates twelve stores across the region.", "ch": ["foundation", "founded", "founding", "founds"], "a": 1, "ex": "해석  1985년에 작은 가족 제과점으로 처음 설립된 하몬 푸즈는 현재 지역 전체에 열두 개 매장을 운영하고 있다.\n해설  콤마 앞부분은 주절의 주어 Harmon Foods를 의미상 주어로 하는 분사구문이며, 회사는 '설립되는' 대상이므로 과거분사 (B) founded가 정답이다. (C) founding은 회사가 스스로 무언가를 세운다는 능동의 뜻이 되어 어색하고, (A)는 명사, (D)는 동사라 주어 없이 쓸 수 없다.", "point": "분사구문 수동"}, {"id": "U07-D31", "stem": "Greatly _______ by the positive reviews, the theater's director decided to extend the play's run by two more weeks.", "ch": ["encourage", "encouraging", "encourages", "encouraged"], "a": 3, "ex": "해석  호평에 크게 고무된 극장 감독은 연극 공연 기간을 2주 더 연장하기로 결정했다.\n해설  콤마 앞부분은 주절의 주어 director를 의미상 주어로 하는 분사구문이며, 감독은 호평에 '고무되는' 대상이고 뒤에 <by + 행위자>가 있으므로 과거분사 (D) encouraged가 정답이다. (B) encouraging은 감독이 남을 격려한다는 능동의 뜻이 되어 by와 맞지 않고, (A)·(C)는 동사다.", "point": "분사구문 수동"}, {"id": "U07-D32", "stem": "Once _______ by the supervisor, each timesheet should be forwarded to the payroll office before noon on Friday.", "ch": ["approve", "approved", "approving", "approval"], "a": 1, "ex": "해석  일단 상사의 승인을 받으면, 각 근무 시간표는 금요일 정오 전에 급여 부서로 전달되어야 한다.\n해설  접속사 Once를 남긴 분사구문이며, 근무 시간표는 '승인되는' 대상이고 뒤에 <by + 행위자>가 있으므로 과거분사 (B) approved가 정답이다. (C) approving은 능동의 뜻이라 by와 맞지 않고, (A)는 동사, (D)는 명사라 분사 자리에 올 수 없다.", "point": "분사구문 수동(접속사 남김)"}, {"id": "U07-D33", "stem": "As _______ in the rental agreement, tenants must give thirty days' notice before moving out of the apartment.", "ch": ["stated", "state", "stating", "states"], "a": 0, "ex": "해석  임대 계약서에 명시된 대로, 세입자는 아파트에서 이사 나가기 30일 전에 통보해야 한다.\n해설  <As + 분사 + in ~>은 '~에 명시된 대로'라는 빈출 분사구문이며, 내용은 계약서에 '명시되는' 대상이므로 과거분사 (A) stated가 정답이다. (C) stating은 능동의 뜻이 되어 어색하고, (B)·(D)는 동사라 주어 없이 As 뒤에 올 수 없다.", "point": "분사구문 빈출 형태(As stated in)"}, {"id": "U07-D34", "stem": "When _______ to the previous model, the XR-200 printer uses forty percent less energy in standby mode.", "ch": ["compare", "comparing", "comparison", "compared"], "a": 3, "ex": "해석  이전 모델과 비교했을 때, XR-200 프린터는 대기 모드에서 40퍼센트 더 적은 에너지를 사용한다.\n해설  <(When) compared to ~>는 '~와 비교하면'이라는 빈출 분사구문이며, 주어 printer가 '비교되는' 대상이므로 과거분사 (D) compared가 정답이다. (B) comparing은 능동의 뜻이라 to와 어울리지 않고, (A)는 동사, (C)는 명사다.", "point": "분사구문 빈출 형태(Compared to)"}, {"id": "U07-D35", "stem": "Please find _______ a copy of the new invoice, which reflects the discount we discussed on the phone yesterday.", "ch": ["attach", "attached", "attaching", "attachment"], "a": 1, "ex": "해석  어제 전화로 논의한 할인이 반영된 새 청구서 사본을 첨부하니 확인해 주십시오.\n해설  <Please find attached + 명사>는 '~을 첨부하니 확인 바랍니다'라는 빈출 표현으로, 목적어 a copy가 '첨부되는' 대상이므로 과거분사 (B) attached가 정답이다. (C) attaching은 능동의 뜻이라 어색하고, (A)는 동사, (D)는 명사다.", "point": "분사구문 빈출 형태(find attached)"}, {"id": "U07-D36", "stem": "Conveniently _______ just two blocks from the central train station, the Kessler Hotel is popular with business travelers.", "ch": ["locate", "locating", "located", "location"], "a": 2, "ex": "해석  중앙 기차역에서 두 블록밖에 떨어져 있지 않은 편리한 위치의 케슬러 호텔은 출장객에게 인기가 있다.\n해설  콤마 앞부분은 주절의 주어 the Kessler Hotel을 의미상 주어로 하는 분사구문이며, 호텔은 '위치해 있는' 대상이므로 과거분사 (C) located가 정답이다. Located in/near ~는 빈출 형태다. (B) locating은 능동의 뜻이라 어색하고, (A)는 동사, (D)는 명사다.", "point": "분사구문 빈출 형태(Located in)"}, {"id": "U07-D37", "stem": "Staff members _______ in the mentoring program will receive a certificate of completion at the end of the year.", "ch": ["participate", "participated", "participating", "are participating"], "a": 2, "ex": "해석  멘토링 프로그램에 참여하는 직원들은 연말에 수료증을 받을 것이다.\n해설  본동사 will receive가 이미 있으므로 빈칸은 주어 Staff members를 뒤에서 꾸미는 분사 자리다. 직원이 '참여하는' 주체이므로 현재분사 (C) participating이 정답이다. (A)·(D)는 동사라 본동사가 두 개가 되고, (B) participated는 자동사의 과거분사라 수동으로 명사를 꾸밀 수 없다.", "point": "분사 vs 동사(본동사 있음)"}, {"id": "U07-D38", "stem": "All orders _______ before December 15 are guaranteed to arrive in time for the holiday season.", "ch": ["placed", "placing", "have placed", "were placed"], "a": 0, "ex": "해석  12월 15일 이전에 접수된 모든 주문은 연휴 시즌에 맞춰 도착하는 것이 보장된다.\n해설  본동사 are guaranteed가 있으므로 빈칸은 주어 orders를 뒤에서 꾸미는 분사 자리이며, 주문은 '접수되는' 대상이므로 과거분사 (A) placed가 정답이다. (C)·(D)는 동사라 본동사가 두 개가 되어 틀리고, (B) placing은 주문이 스스로 무언가를 놓는다는 능동의 뜻이라 어색하다.", "point": "분사 vs 동사(본동사 있음)"}, {"id": "U07-D39", "stem": "Anyone _______ to attend the retirement dinner for Mr. Alvarez should reply to this invitation by Thursday.", "ch": ["wishing", "wishes", "wished", "has wished"], "a": 0, "ex": "해석  알바레스 씨의 은퇴 기념 만찬에 참석하고 싶은 분은 목요일까지 이 초대에 회신해 주십시오.\n해설  본동사 should reply가 있으므로 빈칸은 Anyone을 뒤에서 꾸미는 분사 자리이며, 참석을 '원하는' 주체이므로 현재분사 (A) wishing이 정답이다. (B)·(D)는 동사라 본동사가 두 개가 되고, (C) wished는 수동의 뜻이 되어 '원해진 사람'이라는 어색한 의미가 된다.", "point": "분사 vs 동사(본동사 있음)"}, {"id": "U07-D40", "stem": "The invoices _______ to Corwin Industries last week included an error in the delivery charges.", "ch": ["sending", "sent", "were sent", "have sent"], "a": 1, "ex": "해석  지난주 코윈 인더스트리즈에 보낸 청구서에는 배송비 오류가 있었다.\n해설  본동사 included가 있으므로 빈칸은 주어 invoices를 뒤에서 꾸미는 분사 자리이며, 청구서는 '보내지는' 대상이므로 과거분사 (B) sent가 정답이다. (C)·(D)는 동사라 본동사가 두 개가 되어 틀리고, (A) sending은 청구서가 스스로 보낸다는 능동의 뜻이라 어색하다.", "point": "분사 vs 동사(본동사 있음)"}]}, {"id": "U08", "name": "U08 전치사", "items": [{"id": "U08-D01", "stem": "The quarterly budget review will begin _______ 9:30 a.m. in the main conference room on Tuesday.", "ch": ["at", "on", "in", "of"], "a": 0, "ex": "해석  분기 예산 검토 회의는 화요일 오전 9시 30분에 대회의실에서 시작될 것이다.\n해설  빈칸 뒤 9:30 a.m.은 구체적인 시각이므로 시각 앞에 쓰는 (A) at이 정답. (B) on은 요일·날짜 앞, (C) in은 월·계절·연도 앞에 쓰며, (D) of는 시각을 나타내는 전치사가 아니다.", "point": "시점 at + 시각"}, {"id": "U08-D02", "stem": "Cavell Logistics will hold its annual safety training _______ March 14 for all warehouse employees.", "ch": ["in", "on", "at", "since"], "a": 1, "ex": "해석  Cavell Logistics는 3월 14일에 전 창고 직원을 대상으로 연례 안전 교육을 실시할 것이다.\n해설  March 14처럼 날짜 앞에는 on을 쓰므로 (B) on이 정답. (A) in은 월·연도, (C) at은 시각 앞에 쓰고, (D) since는 과거 시점과 함께 현재완료 문장에서 쓰이므로 미래 시제와 어울리지 않는다.", "point": "시점 on + 날짜"}, {"id": "U08-D03", "stem": "Mirabel Cosmetics plans to open three additional stores in the Toronto area _______ 2027.", "ch": ["on", "at", "in", "to"], "a": 2, "ex": "해석  Mirabel Cosmetics는 2027년에 토론토 지역에 매장 세 곳을 추가로 열 계획이다.\n해설  2027처럼 연도 앞에는 in을 쓰므로 (C) in이 정답. (A) on은 날짜·요일, (B) at은 시각 앞에 쓰며, (D) to는 방향·도착점을 나타내 연도와 함께 쓰지 않는다.", "point": "시점 in + 연도"}, {"id": "U08-D04", "stem": "Employees may park in the newly built garage free of charge _______ next Monday onward.", "ch": ["since", "by", "until", "from"], "a": 3, "ex": "해석  직원들은 다음 주 월요일부터 계속 신축 주차장에 무료로 주차할 수 있다.\n해설  미래 시점 next Monday와 onward가 함께 쓰여 '~부터 계속'이라는 시작점을 나타내므로 (D) from이 정답. (A) since는 과거 시점과 현재완료에 쓰이고, (B) by와 (C) until은 기한을 나타내 onward와 어울리지 않는다.", "point": "from + 시점(~부터)"}, {"id": "U08-D05", "stem": "All expense reports must be submitted through the new online portal _______ July 1, when the current system will be retired.", "ch": ["as of", "since", "within", "among"], "a": 0, "ex": "해석  현행 시스템이 폐기되는 7월 1일자로 모든 경비 보고서는 새 온라인 포털을 통해 제출되어야 한다.\n해설  특정 날짜를 기준으로 새 규정이 시작됨을 나타내므로 '~일자로'라는 뜻의 (A) as of가 정답. (B) since는 현재완료와 함께 과거 시점에 쓰고, (C) within은 기간, (D) among은 셋 이상의 대상 앞에 쓴다.", "point": "as of + 시점(~일자로)"}, {"id": "U08-D06", "stem": "Ms. Okafor has served as regional director of Halden Insurance _______ 2019, when the Lagos branch first opened.", "ch": ["for", "since", "by", "at"], "a": 1, "ex": "해석  Okafor 씨는 라고스 지점이 처음 문을 연 2019년부터 Halden Insurance의 지역 이사로 재직해 왔다.\n해설  현재완료 has served와 과거 시점 2019가 함께 쓰여 '~ 이래로'를 나타내므로 (B) since가 정답. (A) for는 뒤에 숫자 기간이 와야 하고, (C) by는 완료 기한, (D) at은 시각 앞에 쓴다.", "point": "since + 과거 시점(현재완료)"}, {"id": "U08-D07", "stem": "The contractor promised that the new lobby flooring would be installed _______ the end of October.", "ch": ["until", "since", "by", "within"], "a": 2, "ex": "해석  시공업체는 새 로비 바닥재가 10월 말까지 설치될 것이라고 약속했다.\n해설  설치가 한 시점까지 '완료'되어야 하므로 완료 기한을 나타내는 (C) by가 정답. (A) until은 동작·상태가 그 시점까지 계속될 때 쓰므로 일회성 완료 동사 install과 어울리지 않고, (B) since는 과거 시점, (D) within은 기간 앞에 쓴다.", "point": "by(~까지 완료) vs until"}, {"id": "U08-D08", "stem": "The exhibition of Renata Villar's photographs will remain on display at the Ostrom Gallery _______ September 30.", "ch": ["by", "within", "among", "until"], "a": 3, "ex": "해석  Renata Villar의 사진 전시는 9월 30일까지 Ostrom 갤러리에 계속 전시될 것이다.\n해설  remain on display라는 상태가 특정 시점까지 '계속'되므로 (D) until이 정답. (A) by는 그 시점까지 동작이 완료됨을 나타내 지속 동사 remain과 어울리지 않고, (B) within은 기간, (C) among은 셋 이상의 대상 앞에 쓴다.", "point": "until(~까지 계속) vs by"}, {"id": "U08-D09", "stem": "All visitors must sign in at the front desk _______ entering the laboratory area on the second floor.", "ch": ["before", "prior", "ago", "previously"], "a": 0, "ex": "해석  모든 방문객은 2층 실험실 구역에 들어가기 전에 안내 데스크에서 서명해야 한다.\n해설  빈칸 뒤 동명사구 entering ~ 을 목적어로 취하면서 '~하기 전에'라는 순서를 나타내는 전치사가 필요하므로 (A) before가 정답. (B) prior는 to와 함께 prior to로 써야 전치사가 되고, (C) ago와 (D) previously는 부사라 뒤에 명사·동명사를 이끌 수 없다.", "point": "before + 동명사(~하기 전에)"}, {"id": "U08-D10", "stem": "Please read the attached agenda carefully _______ the board meeting so that discussions can begin promptly.", "ch": ["ago", "prior to", "previously", "afterward"], "a": 1, "ex": "해석  논의가 신속히 시작될 수 있도록 이사회 전에 첨부된 안건을 주의 깊게 읽어 주십시오.\n해설  빈칸 뒤 명사구 the board meeting을 이끌며 '~ 전에'라는 시간 관계를 나타내야 하므로 전치사 (B) prior to가 정답. (A) ago, (C) previously, (D) afterward는 모두 부사라 뒤에 명사구를 취할 수 없다.", "point": "prior to + 시점(~ 전에)"}, {"id": "U08-D11", "stem": "Feedback forms will be collected _______ the presentation so that attendees can rate each speaker.", "ch": ["later", "afterward", "after", "then"], "a": 2, "ex": "해석  참석자들이 각 연사를 평가할 수 있도록 발표 후에 피드백 양식을 수거할 것이다.\n해설  빈칸 뒤에 명사구 the presentation이 오므로 명사를 이끌 수 있는 전치사가 필요하고, 문맥상 '~ 후에'이므로 (C) after가 정답. (A) later, (B) afterward, (D) then은 모두 부사라 명사구를 목적어로 취할 수 없다.", "point": "after + 시점(~ 후에)"}, {"id": "U08-D12", "stem": "Sales of winter coats usually increase sharply _______ the end of November as temperatures begin to drop.", "ch": ["onto", "among", "since", "toward"], "a": 3, "ex": "해석  겨울 코트 판매량은 기온이 떨어지기 시작하는 11월 말 무렵에 보통 급격히 증가한다.\n해설  the end of November라는 시점을 향해 가는 '~ 무렵'을 나타내므로 (D) toward가 정답. (A) onto는 표면 위로의 이동, (B) among은 셋 이상의 대상, (C) since는 현재완료와 함께 쓰는 과거 시점 앞에 쓴다.", "point": "toward + 명사(~ 무렵)"}, {"id": "U08-D13", "stem": "The visiting engineers will stay at the Bramford Hotel _______ three weeks while inspecting the new plant.", "ch": ["for", "during", "since", "until"], "a": 0, "ex": "해석  방문 엔지니어들은 새 공장을 점검하는 동안 3주간 Bramford 호텔에 머물 것이다.\n해설  three weeks처럼 숫자로 된 기간 앞에는 for를 쓰므로 (A) for가 정답. (B) during은 the conference처럼 특정 행사·사건 명사와 함께 쓰며 숫자 기간 앞에는 쓰지 않고, (C) since와 (D) until은 시점 앞에 쓴다.", "point": "기간 for + 숫자 기간"}, {"id": "U08-D14", "stem": "Mobile phones must be switched off _______ the safety demonstration in the assembly hall.", "ch": ["while", "during", "since", "meanwhile"], "a": 1, "ex": "해석  강당에서 안전 시연이 진행되는 동안 휴대전화는 반드시 꺼 두어야 한다.\n해설  빈칸 뒤에 특정 행사를 나타내는 명사구 the safety demonstration이 오므로 '~ 동안'을 뜻하는 전치사 (B) during이 정답. (A) while은 접속사라 <주어+동사>가 필요하고, (C) since는 과거 시점 앞에 쓰며, (D) meanwhile은 부사다.", "point": "during + 행사·사건"}, {"id": "U08-D15", "stem": "Technical support will be available by telephone _______ the holiday weekend, even on Sunday evening.", "ch": ["while", "among", "throughout", "between"], "a": 2, "ex": "해석  기술 지원은 연휴 주말 내내, 일요일 저녁까지도 전화로 이용할 수 있다.\n해설  the holiday weekend라는 기간 '내내' 지원이 제공됨을 나타내므로 (C) throughout이 정답. (A) while은 접속사라 절이 와야 하고, (B) among과 (D) between은 대상 사이의 위치·관계를 나타내 기간 명사와 어울리지 않는다.", "point": "throughout + 기간"}, {"id": "U08-D16", "stem": "Registered users may cancel their subscription and receive a full refund _______ ten days of signing up.", "ch": ["during", "since", "until", "within"], "a": 3, "ex": "해석  등록 사용자는 가입 후 10일 이내에 구독을 취소하고 전액 환불을 받을 수 있다.\n해설  ten days라는 숫자 기간 앞에서 '~ 이내에'를 나타내므로 (D) within이 정답. (A) during은 특정 행사·사건 명사와 쓰며 숫자 기간과 어울리지 않고, (B) since와 (C) until은 시점 앞에 쓴다.", "point": "within + 기간(~ 이내에)"}, {"id": "U08-D17", "stem": "A shuttle bus will be waiting _______ the main entrance of the Harwood Hotel to take guests to the airport.", "ch": ["in front of", "between", "among", "until"], "a": 0, "ex": "해석  투숙객을 공항으로 모셔 가기 위해 셔틀버스가 Harwood 호텔 정문 앞에서 대기하고 있을 것이다.\n해설  버스가 대기하는 위치가 호텔 정문 '앞'이므로 (A) in front of가 정답. (B) between은 둘 사이, (C) among은 셋 이상 사이에 쓰여 단수 명사 the main entrance와 맞지 않고, (D) until은 시간 앞에 쓴다.", "point": "위치 in front of"}, {"id": "U08-D18", "stem": "The new photocopier has been placed _______ the supply cabinet so that staff can easily reach both.", "ch": ["next", "next to", "nearly", "among"], "a": 1, "ex": "해석  직원들이 둘 다 쉽게 이용할 수 있도록 새 복사기는 비품 캐비닛 옆에 놓였다.\n해설  빈칸 뒤 명사구 the supply cabinet을 이끌며 '~ 옆에'를 나타내는 전치사가 필요하므로 (B) next to가 정답. (A) next는 to 없이 전치사로 쓸 수 없고, (C) nearly는 '거의'라는 부사이며, (D) among은 셋 이상의 대상 앞에 쓴다.", "point": "위치 next to(~ 옆에)"}, {"id": "U08-D19", "stem": "Visitor parking can be found directly _______ the office building, so please use the rear entrance.", "ch": ["among", "onto", "behind", "during"], "a": 2, "ex": "해석  방문객 주차장은 사무실 건물 바로 뒤에 있으므로 후문을 이용해 주십시오.\n해설  뒤에 이어지는 the rear entrance(후문)와 호응하여 건물 '뒤'라는 위치를 나타내므로 (C) behind가 정답. (A) among은 셋 이상 사이, (B) onto는 표면 위로의 이동, (D) during은 기간 앞에 쓴다.", "point": "위치 behind(~ 뒤에)"}, {"id": "U08-D20", "stem": "Bayview Dental Clinic is conveniently located _______ the central train station, just a five-minute walk away.", "ch": ["among", "between", "into", "near"], "a": 3, "ex": "해석  Bayview 치과는 중앙역에서 걸어서 5분 거리로 편리하게 위치해 있다.\n해설  a five-minute walk away와 호응하여 역 '근처에'라는 위치를 나타내므로 (D) near가 정답. (A) among과 (B) between은 복수의 대상 사이에 쓰여 단수 명사와 맞지 않고, (C) into는 안으로의 이동을 나타내 located와 어울리지 않는다.", "point": "위치 near(~ 근처에)"}, {"id": "U08-D21", "stem": "The new bakery is directly _______ the street from the post office on Linden Avenue.", "ch": ["across", "into", "onto", "among"], "a": 0, "ex": "해석  새 제과점은 Linden 가에 있는 우체국 길 바로 건너편에 있다.\n해설  across the street from ~ 은 '~의 길 건너편에'라는 위치 표현이므로 (A) across가 정답. (B) into와 (C) onto는 이동 방향을 나타내 be동사와 위치 표현에 어울리지 않고, (D) among은 셋 이상의 대상 앞에 쓴다.", "point": "위치 across(~ 건너편에)"}, {"id": "U08-D22", "stem": "The employee lounge on the ground floor is situated _______ the cafeteria and the mailroom.", "ch": ["among", "between", "into", "onto"], "a": 1, "ex": "해석  1층 직원 휴게실은 구내식당과 우편실 사이에 있다.\n해설  the cafeteria and the mailroom처럼 두 대상 사이를 나타내므로 (B) between이 정답. (A) among은 셋 이상의 대상 사이에 쓰고, (C) into와 (D) onto는 이동 방향을 나타내 위치 동사 situated와 어울리지 않는다.", "point": "between(둘 사이) vs among"}, {"id": "U08-D23", "stem": "The survey was distributed _______ all 300 employees at the Deverell plant to gather opinions on the new schedule.", "ch": ["between", "during", "among", "within"], "a": 2, "ex": "해석  새 근무 일정에 대한 의견을 모으기 위해 설문지가 Deverell 공장의 전 직원 300명에게 배포되었다.\n해설  all 300 employees처럼 셋 이상의 대상 사이에 배포된 것이므로 (C) among이 정답. (A) between은 둘 사이에 쓰고, (B) during은 기간, (D) within은 '~ 이내에'로 기간·범위 앞에 쓴다.", "point": "among(셋 이상 사이) vs between"}, {"id": "U08-D24", "stem": "All confidential files must be put _______ the locked cabinet before employees leave the office for the day.", "ch": ["among", "until", "between", "into"], "a": 3, "ex": "해석  직원들은 퇴근하기 전에 모든 기밀 서류를 잠금 캐비닛 안에 넣어 두어야 한다.\n해설  put과 함께 캐비닛 '안으로' 넣는 이동 방향을 나타내므로 (D) into가 정답. (A) among과 (C) between은 복수 대상 사이에 쓰여 단수 명사와 맞지 않고, (B) until은 시간 앞에 쓴다.", "point": "방향 into(~ 안으로)"}, {"id": "U08-D25", "stem": "For safety reasons, hard hats must be worn at all times _______ the construction zone on Fenwick Street.", "ch": ["inside", "into", "onto", "among"], "a": 0, "ex": "해석  안전상의 이유로 Fenwick 가 공사 구역 안에서는 항상 안전모를 착용해야 한다.\n해설  안전모를 착용해야 하는 '장소 안'을 나타내므로 (A) inside가 정답. (B) into와 (C) onto는 이동 방향을 나타내 상태 동사 be worn과 어울리지 않고, (D) among은 셋 이상의 대상 앞에 쓴다.", "point": "inside(~ 안에서)"}, {"id": "U08-D26", "stem": "Delivery drivers should enter the warehouse _______ the side gate on Marlow Road, not the front entrance.", "ch": ["among", "through", "between", "since"], "a": 1, "ex": "해석  배송 기사들은 정문이 아니라 Marlow 가의 옆문을 통해 창고에 들어와야 한다.\n해설  enter와 함께 출입구를 '통과하여' 들어오는 경로를 나타내므로 (B) through가 정답. (A) among과 (C) between은 대상 사이의 위치를 나타내고, (D) since는 과거 시점 앞에 쓴다.", "point": "방향 through(~을 통과하여)"}, {"id": "U08-D27", "stem": "The company shuttle runs from the downtown office _______ the research campus every hour on weekdays.", "ch": ["at", "in", "to", "on"], "a": 2, "ex": "해석  회사 셔틀은 평일에 매시간 도심 사무실에서 연구 단지까지 운행한다.\n해설  from A to B는 'A에서 B까지'라는 출발점과 도착점을 나타내므로 from과 짝을 이루는 (C) to가 정답. (A) at, (B) in, (D) on은 정지된 위치를 나타내 이동의 도착점을 표현하지 못한다.", "point": "방향 from A to B"}, {"id": "U08-D28", "stem": "Employees may not remove any equipment from the laboratory _______ written permission from the department head.", "ch": ["unless", "while", "although", "without"], "a": 3, "ex": "해석  직원들은 부서장의 서면 허가 없이 실험실에서 어떤 장비도 반출할 수 없다.\n해설  빈칸 뒤에 명사구 written permission이 오므로 명사를 이끄는 전치사가 필요하며 문맥상 '~ 없이'이므로 (D) without이 정답. (A) unless, (B) while, (C) although는 모두 접속사라 뒤에 <주어+동사>가 와야 한다.", "point": "수단 without(~ 없이)"}, {"id": "U08-D29", "stem": "The customer service team received several questions _______ the delayed shipment of office chairs from a client in Denver.", "ch": ["about", "among", "until", "onto"], "a": 0, "ex": "해석  고객 서비스팀은 덴버의 한 고객으로부터 지연된 사무용 의자 배송에 관한 질문을 여러 건 받았다.\n해설  questions 뒤에서 질문의 주제를 나타내는 '~에 관한'이므로 (A) about이 정답. (B) among은 셋 이상 사이, (C) until은 시간, (D) onto는 표면 위로의 이동을 나타내 주제를 표현하지 못한다.", "point": "주제 about(~에 관한)"}, {"id": "U08-D30", "stem": "The cafeteria on the fifth floor is open to all staff every day _______ Sunday, when the building is closed.", "ch": ["unless", "except", "otherwise", "nor"], "a": 1, "ex": "해석  5층 구내식당은 건물이 문을 닫는 일요일을 제외하고 매일 전 직원에게 개방된다.\n해설  every day 뒤에서 명사 Sunday를 이끌어 '~을 제외하고'를 나타내므로 전치사 (B) except가 정답. (A) unless와 (D) nor는 접속사, (C) otherwise는 부사라 명사를 목적어로 취할 수 없다.", "point": "제외 except(~을 제외하고)"}, {"id": "U08-D31", "stem": "The outdoor product launch was postponed _______ a severe weather warning for the coastal region.", "ch": ["because", "although", "due to", "so"], "a": 2, "ex": "해석  야외 제품 출시 행사는 해안 지역에 내려진 악천후 경보 때문에 연기되었다.\n해설  빈칸 뒤에 명사구 a severe weather warning이 오고 연기의 이유를 나타내므로 전치사 (C) due to가 정답. (A) because와 (B) although는 접속사라 절이 필요하고, (D) so는 결과를 잇는 접속사다.", "point": "이유 due to(~ 때문에)"}, {"id": "U08-D32", "stem": "Ticket sales for the jazz festival rose steadily _______ the increase in admission prices announced in May.", "ch": ["although", "even though", "however", "despite"], "a": 3, "ex": "해석  5월에 발표된 입장료 인상에도 불구하고 재즈 페스티벌 입장권 판매는 꾸준히 증가했다.\n해설  빈칸 뒤 명사구 the increase ~ 를 이끌며 가격 인상에도 판매가 늘었다는 양보 관계를 나타내므로 (D) despite가 정답. (A) although와 (B) even though는 접속사라 절이 와야 하고, (C) however는 부사다.", "point": "양보 despite + 명사"}, {"id": "U08-D33", "stem": "Overtime hours will now be paid at a higher rate _______ the revised policy announced by the human resources department.", "ch": ["according to", "according", "accordingly", "accordance"], "a": 0, "ex": "해석  인사부가 발표한 개정 정책에 따라 초과 근무 시간은 이제 더 높은 요율로 지급된다.\n해설  빈칸 뒤 명사구 the revised policy를 이끌어 '~에 따라'를 나타내는 구전치사 (A) according to가 정답. (B) according은 to 없이 전치사로 쓸 수 없고, (C) accordingly는 부사, (D) accordance는 명사로 in accordance with 형태로 써야 한다.", "point": "구전치사 according to"}, {"id": "U08-D34", "stem": "The committee decided to hold the awards ceremony in the auditorium _______ the smaller banquet hall.", "ch": ["instead", "instead of", "rather", "otherwise"], "a": 1, "ex": "해석  위원회는 시상식을 더 작은 연회장 대신 강당에서 열기로 결정했다.\n해설  빈칸 뒤 명사구 the smaller banquet hall을 이끌어 '~ 대신에'를 나타내는 구전치사 (B) instead of가 정답. (A) instead와 (D) otherwise는 부사이고, (C) rather는 than과 함께 rather than으로 써야 명사구를 이끌 수 있다.", "point": "구전치사 instead of"}, {"id": "U08-D35", "stem": "Guests at the Lindqvist Resort receive a complimentary breakfast _______ free access to the fitness center.", "ch": ["in addition", "additionally", "in addition to", "also"], "a": 2, "ex": "해석  Lindqvist 리조트 투숙객은 피트니스 센터 무료 이용에 더해 무료 조식을 제공받는다.\n해설  빈칸 뒤 명사구 free access ~ 를 이끌어 '~에 더하여'를 나타내는 구전치사 (C) in addition to가 정답. (A) in addition은 to 없이는 부사구로 쓰이고, (B) additionally와 (D) also는 부사라 명사구를 목적어로 취할 수 없다.", "point": "구전치사 in addition to"}, {"id": "U08-D36", "stem": "All applications will be reviewed in the order received, _______ the position for which the candidate has applied.", "ch": ["regardless", "even though", "nevertheless", "regardless of"], "a": 3, "ex": "해석  모든 지원서는 지원자가 지원한 직책과 관계없이 접수된 순서대로 검토될 것이다.\n해설  빈칸 뒤 명사구 the position ~ 을 이끌어 '~와 관계없이'를 나타내므로 구전치사 (D) regardless of가 정답. (A) regardless는 of 없이 부사로만 쓰이고, (B) even though는 접속사, (C) nevertheless는 부사다.", "point": "구전치사 regardless of"}, {"id": "U08-D37", "stem": "Employees should use the stairs rather than the elevators _______ fire or any other emergency in the building.", "ch": ["in case of", "in case", "if", "unless"], "a": 0, "ex": "해석  화재나 그 밖의 비상 상황 시 직원들은 엘리베이터 대신 계단을 이용해야 한다.\n해설  빈칸 뒤 명사구 fire or any other emergency를 이끌어 '~의 경우에'를 나타내므로 (A) in case of가 정답. (B) in case, (C) if, (D) unless는 접속사라 뒤에 <주어+동사>가 와야 한다.", "point": "구전치사 in case of(= in the event of)"}, {"id": "U08-D38", "stem": "The training package covers all essential topics, _______ customer data protection and workplace safety.", "ch": ["include", "including", "includes", "inclusion"], "a": 1, "ex": "해석  이 교육 패키지는 고객 정보 보호와 작업장 안전을 포함한 모든 필수 주제를 다룬다.\n해설  콤마 뒤에서 명사구 customer data protection ~ 을 이끌어 '~을 포함하여'라는 예시를 덧붙이는 전치사 (B) including이 정답. (A) include와 (C) includes는 동사라 이미 동사 covers가 있는 문장에 다시 올 수 없고, (D) inclusion은 명사다.", "point": "-ing 형태 전치사 including"}, {"id": "U08-D39", "stem": "A brief reception will be held in the lobby _______ the keynote address by Dr. Amara Sethi.", "ch": ["follows", "followed", "following", "follow"], "a": 2, "ex": "해석  Amara Sethi 박사의 기조연설 후에 로비에서 간단한 환영회가 열릴 것이다.\n해설  빈칸 뒤 명사구 the keynote address를 이끌어 '~ 후에'라는 시간 관계를 나타내는 전치사 (C) following이 정답. (A) follows와 (D) follow는 동사라 이미 동사 will be held가 있는 문장에 올 수 없고, (B) followed는 과거분사로 by 없이 명사구를 바로 이끌 수 없다.", "point": "-ing 형태 전치사 following(~ 후에)"}, {"id": "U08-D40", "stem": "Mr. Delacroix will send an e-mail to all staff _______ the changes to the reimbursement procedure.", "ch": ["regard", "regards", "regarded", "regarding"], "a": 3, "ex": "해석  Delacroix 씨는 경비 환급 절차의 변경 사항에 관해 전 직원에게 이메일을 보낼 것이다.\n해설  빈칸 뒤 명사구 the changes ~ 를 이끌어 '~에 관하여'를 나타내는 전치사 (D) regarding이 정답. (A) regard와 (B) regards는 명사·동사이고, (C) regarded는 과거분사로 이미 동사 will send가 있는 문장에 어울리지 않는다.", "point": "-ing 형태 전치사 regarding(= concerning)"}]}, {"id": "U09", "name": "U09 접속사", "items": [{"id": "U09-D01", "stem": "Our technicians will inspect the heating system _______ replace any worn parts during the visit on Tuesday.", "ch": ["and", "but also", "nor", "either"], "a": 0, "ex": "해석  저희 기술자들이 화요일 방문 때 난방 시스템을 점검하고 마모된 부품을 교체해 드릴 것입니다.\n해설  빈칸은 동사구 inspect the heating system과 replace any worn parts를 대등하게 잇는 자리이므로 등위접속사 (A) and가 정답이다. (B) but also는 앞에 not only가, (C) nor는 앞에 neither가, (D) either는 뒤에 or가 있어야 쓸 수 있다.", "point": "등위접속사 and — 동사구와 동사구 연결"}, {"id": "U09-D02", "stem": "Applicants may send their application forms by e-mail _______ drop them off at the front desk before Friday.", "ch": ["nor", "or", "neither", "whether"], "a": 1, "ex": "해석  지원자들은 금요일 전에 지원서를 이메일로 보내거나 안내 데스크에 직접 제출할 수 있다.\n해설  조동사 may 뒤의 두 동사구 send ~ by e-mail과 drop them off를 선택의 뜻으로 연결해야 하므로 (B) or가 정답이다. (A) nor는 neither와, (C) neither는 nor와 짝을 이루어야 하고, (D) whether는 명사절 접속사라 동사구를 이을 수 없다.", "point": "등위접속사 or — 구와 구 연결"}, {"id": "U09-D03", "stem": "The shipment from Larkin Textiles arrived on schedule, _______ several boxes were damaged in transit.", "ch": ["despite", "however", "but", "nor"], "a": 2, "ex": "해석  라킨 텍스타일에서 온 화물은 제때 도착했지만, 상자 몇 개가 운송 중에 파손되었다.\n해설  완전한 두 절을 대조의 뜻으로 잇는 자리이므로 등위접속사 (C) but이 정답이다. (A) despite는 전치사라 뒤에 절이 올 수 없고, (B) however는 부사라 두 절을 쉼표만으로 이을 수 없으며, (D) nor는 앞에 부정어가 있어야 한다.", "point": "등위접속사 but — 절과 절 대조"}, {"id": "U09-D04", "stem": "The Dalton Cafe raised its prices twice last year, _______ it still attracts a steady stream of loyal customers.", "ch": ["in spite of", "nevertheless", "either", "yet"], "a": 3, "ex": "해석  달튼 카페는 작년에 가격을 두 번 올렸지만, 여전히 꾸준히 단골손님을 끌어들이고 있다.\n해설  앞뒤 절의 내용이 대조되므로 '그렇지만'의 등위접속사 (D) yet이 정답이다. (A) in spite of는 전치사구, (B) nevertheless는 부사라 절을 직접 이을 수 없고, (C) either는 or와 짝을 이루어야 한다.", "point": "등위접속사 yet — 절과 절 대조"}, {"id": "U09-D05", "stem": "The updated safety manual is available in _______ English and Spanish for all warehouse employees.", "ch": ["either", "both", "neither", "not only"], "a": 1, "ex": "해석  개정된 안전 매뉴얼은 모든 창고 직원을 위해 영어와 스페인어 두 언어로 제공된다.\n해설  뒤에 and가 있으므로 짝을 이루는 상관접속사 (B) both가 정답이다. (A) either는 or, (C) neither는 nor, (D) not only는 but (also)와 짝을 이루므로 and와 함께 쓸 수 없다.", "point": "상관접속사 both A and B"}, {"id": "U09-D06", "stem": "Guests may pay for the banquet _______ by credit card or by bank transfer before the event.", "ch": ["both", "neither", "either", "and"], "a": 2, "ex": "해석  손님들은 행사 전에 신용카드나 계좌 이체 중 한 가지 방법으로 연회 비용을 지불할 수 있다.\n해설  뒤에 or가 있으므로 either A or B 구조를 만드는 (C) either가 정답이다. (A) both는 and와, (B) neither는 nor와 짝을 이루고, (D) and는 or 앞에 놓일 수 없다.", "point": "상관접속사 either A or B"}, {"id": "U09-D07", "stem": "Unfortunately, _______ the sales director nor her assistant will be able to attend the trade fair in Lyon.", "ch": ["neither", "either", "both", "not only"], "a": 0, "ex": "해석  안타깝게도 영업 이사도 그녀의 비서도 리옹 무역 박람회에 참석할 수 없을 것이다.\n해설  뒤에 nor가 있으므로 짝이 되는 (A) neither가 정답이다. (B) either는 or, (C) both는 and, (D) not only는 but also와 짝을 이루므로 nor와 함께 쓸 수 없다.", "point": "상관접속사 neither A nor B — 앞 짝 고르기"}, {"id": "U09-D08", "stem": "The rental agreement for the office suite covers neither routine maintenance _______ replacement of damaged furniture.", "ch": ["or", "and", "nor", "but"], "a": 2, "ex": "해석  사무실 임대 계약은 정기 유지보수도, 파손된 가구의 교체도 보장하지 않는다.\n해설  앞에 neither가 있으므로 짝을 이루는 (C) nor가 정답이다. neither A nor B는 고정된 짝이므로 (A) or, (B) and, (D) but은 neither 뒤에 올 수 없다.", "point": "상관접속사 neither A nor B — 뒤 짝 고르기"}, {"id": "U09-D09", "stem": "The redesigned Web site _______ loads faster but also offers a simpler checkout process for shoppers.", "ch": ["both", "neither", "either", "not only"], "a": 3, "ex": "해석  새로 디자인된 웹사이트는 더 빨리 로딩될 뿐 아니라 쇼핑객에게 더 간단한 결제 과정도 제공한다.\n해설  뒤에 but also가 있으므로 짝을 이루는 (D) not only가 정답이다. (A) both는 and, (B) neither는 nor, (C) either는 or와 짝을 이루므로 but also와 함께 쓸 수 없다.", "point": "상관접속사 not only A but also B"}, {"id": "U09-D10", "stem": "The safety inspector confirmed on Monday _______ the factory's ventilation system meets all current regulations.", "ch": ["about", "that", "what", "of"], "a": 1, "ex": "해석  안전 검사관은 월요일에 그 공장의 환기 시스템이 현행 규정을 모두 충족한다는 것을 확인했다.\n해설  동사 confirmed의 목적어로 완전한 절이 이어지므로 명사절 접속사 (B) that이 정답이다. (A) about과 (D) of는 전치사라 뒤에 절이 올 수 없고, (C) what은 뒤에 불완전한 절이 와야 하는데 빈칸 뒤는 주어와 목적어를 모두 갖춘 완전한 절이다.", "point": "명사절 접속사 that — 동사의 목적어"}, {"id": "U09-D11", "stem": "The final budget for next year depends on _______ the merger with Ostrand Logistics is approved.", "ch": ["if", "whether", "unless", "what"], "a": 1, "ex": "해석  내년 최종 예산은 오스트랜드 로지스틱스와의 합병이 승인되는지 여부에 달려 있다.\n해설  전치사 on의 목적어 자리에 절이 오므로 '~인지 아닌지'의 명사절 접속사 (B) whether가 정답이다. (A) if 명사절은 동사의 목적어 자리에만 쓸 수 있어 전치사 뒤에는 올 수 없고, (C) unless는 부사절 접속사, (D) what은 뒤에 불완전한 절이 와야 한다.", "point": "명사절 whether — 전치사 뒤 자리(if 불가)"}, {"id": "U09-D12", "stem": "Please let the caterer know _______ you would like included on the menu for the awards dinner.", "ch": ["that", "whether", "if", "what"], "a": 3, "ex": "해석  시상식 만찬 메뉴에 무엇을 포함하고 싶은지 케이터링 업체에 알려 주십시오.\n해설  빈칸 뒤 절은 would like의 목적어가 빠진 불완전한 절이므로 그 목적어 역할을 겸하는 의문사 (D) what이 정답이다. (A) that, (B) whether, (C) if 뒤에는 완전한 절이 와야 하므로 쓸 수 없다.", "point": "의문사 명사절 what — 불완전한 절"}, {"id": "U09-D13", "stem": "The auditor recommended that the accounting department _______ its expense reports on a monthly basis.", "ch": ["submit", "submits", "submitted", "submitting"], "a": 0, "ex": "해석  감사관은 회계 부서가 지출 보고서를 매달 제출할 것을 권고했다.\n해설  recommend 뒤의 that절에는 <(should) + 동사원형>을 쓰므로 (A) submit이 정답이다. 주어가 3인칭 단수라도 (B) submits처럼 수 일치를 하지 않으며, (C) submitted와 (D) submitting은 should 뒤에 올 수 없는 형태다.", "point": "recommend + that절 — (should) 동사원형"}, {"id": "U09-D14", "stem": "Employees should notify the front desk _______ they expect a visitor so that a badge can be prepared.", "ch": ["when", "during", "upon", "then"], "a": 0, "ex": "해석  직원들은 방문객이 올 예정이면 출입증을 준비할 수 있도록 안내 데스크에 알려야 한다.\n해설  빈칸 뒤에 <주어 + 동사>의 완전한 절이 오므로 시간 부사절 접속사 (A) when이 정답이다. (B) during과 (C) upon은 전치사라 뒤에 명사가 와야 하고, (D) then은 부사라 절을 이끌 수 없다.", "point": "시간 부사절 접속사 when"}, {"id": "U09-D15", "stem": "Please read the enclosed warranty terms carefully _______ you sign the purchase agreement for the equipment.", "ch": ["prior", "before", "ahead", "previously"], "a": 1, "ex": "해석  장비 구매 계약서에 서명하기 전에 동봉된 보증 조건을 주의 깊게 읽어 주십시오.\n해설  빈칸 뒤에 절 you sign ~이 오므로 시간 부사절 접속사 (B) before가 정답이다. (A) prior와 (C) ahead는 각각 to, of를 붙여 전치사구로만 쓰이고, (D) previously는 부사라 절을 이끌 수 없다.", "point": "시간 부사절 접속사 before"}, {"id": "U09-D16", "stem": "Ms. Kowalski joined the marketing division shortly _______ she completed her degree in graphic design.", "ch": ["following", "afterward", "after", "later"], "a": 2, "ex": "해석  코왈스키 씨는 그래픽 디자인 학위를 마친 직후에 마케팅 부서에 합류했다.\n해설  빈칸 뒤에 완전한 절 she completed ~가 이어지므로 접속사 (C) after가 정답이다. (A) following은 전치사라 뒤에 명사가 와야 하고, (B) afterward와 (D) later는 부사라 절을 이끌 수 없다.", "point": "시간 부사절 접속사 after"}, {"id": "U09-D17", "stem": "Visitors must wait in the lobby _______ a staff member arrives to escort them to the laboratory.", "ch": ["by", "during", "meanwhile", "until"], "a": 3, "ex": "해석  방문객은 직원이 도착해 실험실로 안내할 때까지 로비에서 기다려야 한다.\n해설  '~할 때까지'의 뜻으로 뒤에 절 a staff member arrives를 이끄는 접속사 (D) until이 정답이다. (A) by와 (B) during은 전치사라 절 앞에 쓸 수 없고, (C) meanwhile은 부사다.", "point": "시간 부사절 접속사 until"}, {"id": "U09-D18", "stem": "All warehouse staff will receive a two-hour training session _______ the new inventory software has been installed.", "ch": ["once", "upon", "soon", "then"], "a": 0, "ex": "해석  새 재고 관리 소프트웨어가 설치되면 모든 창고 직원이 두 시간짜리 교육을 받게 될 것이다.\n해설  빈칸 뒤에 완전한 절이 오고 '일단 ~하면'의 뜻이므로 접속사 (A) once가 정답이다. (B) upon은 전치사라 명사가 와야 하고, (C) soon과 (D) then은 부사라 절을 이끌 수 없다.", "point": "시간 부사절 접속사 once"}, {"id": "U09-D19", "stem": "The technician will call you _______ the replacement part for your printer becomes available.", "ch": ["upon", "as soon as", "instantly", "at once"], "a": 1, "ex": "해석  프린터 교체 부품이 입고되는 대로 기술자가 전화를 드릴 것입니다.\n해설  빈칸 뒤에 <주어 + 동사>의 절이 오므로 '~하자마자'의 접속사 (B) as soon as가 정답이다. 같은 뜻의 (A) upon은 전치사라 명사(구)가 와야 하고, (C) instantly와 (D) at once는 부사(구)라 절을 이끌 수 없다.", "point": "as soon as(접속사) vs upon(전치사)"}, {"id": "U09-D20", "stem": "The finance team will have organized all of the receipts _______ the auditors arrive next Monday.", "ch": ["by", "by then", "by the time", "in time"], "a": 2, "ex": "해석  다음 주 월요일에 감사관들이 도착할 때쯤이면 재무팀은 영수증을 모두 정리해 두었을 것이다.\n해설  빈칸 뒤에 절 the auditors arrive가 오므로 '~할 때쯤'의 접속사 (C) by the time이 정답이다. (A) by는 전치사, (B) by then과 (D) in time은 부사구라 절을 이끌 수 없다.", "point": "시간 부사절 접속사 by the time"}, {"id": "U09-D21", "stem": "Customers will receive a full refund _______ they return the item in its original packaging within thirty days.", "ch": ["in case of", "otherwise", "therefore", "if"], "a": 3, "ex": "해석  고객이 30일 이내에 원래 포장 상태로 제품을 반품하면 전액 환불을 받게 된다.\n해설  빈칸 뒤에 조건을 나타내는 완전한 절이 오므로 조건 접속사 (D) if가 정답이다. (A) in case of는 전치사구라 명사가 와야 하고, (B) otherwise와 (C) therefore는 부사라 절을 이끌 수 없다.", "point": "조건 부사절 접속사 if"}, {"id": "U09-D22", "stem": "The outdoor product launch will take place as planned _______ severe weather makes the venue unsafe.", "ch": ["without", "except for", "unless", "otherwise"], "a": 2, "ex": "해석  악천후로 행사장이 안전하지 않게 되지 않는 한 야외 제품 출시 행사는 예정대로 열린다.\n해설  '~하지 않는다면'의 뜻으로 뒤에 절 severe weather makes ~를 이끄는 접속사 (C) unless가 정답이다. (A) without과 (B) except for는 전치사(구)라 절 앞에 쓸 수 없고, (D) otherwise는 부사다.", "point": "조건 부사절 접속사 unless"}, {"id": "U09-D23", "stem": "Staff members may work from home two days a week _______ they remain reachable during regular business hours.", "ch": ["as long as", "in case of", "regardless of", "according to"], "a": 0, "ex": "해석  직원들은 정규 근무 시간에 연락이 닿기만 하면 주 2일 재택근무를 할 수 있다.\n해설  빈칸 뒤에 절이 오고 '~하기만 하면'의 조건을 나타내므로 접속사 (A) as long as가 정답이다. (B) in case of, (C) regardless of, (D) according to는 모두 전치사구라 뒤에 명사가 와야 한다.", "point": "조건 부사절 접속사 as long as"}, {"id": "U09-D24", "stem": "Keep a printed copy of your boarding pass _______ the airline's mobile application stops working.", "ch": ["in case of", "in case", "in the event of", "during"], "a": 1, "ex": "해석  항공사 모바일 앱이 작동하지 않을 경우에 대비해 탑승권을 인쇄한 사본을 소지하십시오.\n해설  빈칸 뒤에 완전한 절이 오므로 '~할 경우에 대비하여'의 접속사 (B) in case가 정답이다. (A) in case of와 (C) in the event of는 전치사구, (D) during도 전치사라 절을 이끌 수 없다.", "point": "in case(접속사) vs in case of(전치사)"}, {"id": "U09-D25", "stem": "Tenants may install additional shelving in their units _______ they restore the
