<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>YBM 토익 550+ Part 5·6 변형문제 시험</title>
<style>
:root{
  --bg:#f5f6f3; --card:#fff; --ink:#15181d; --dim:#5b6472; --line:#dfe3ea;
  --acc:#1d4ed8; --acc2:#eef2ff; --ok:#15803d; --ok2:#ecfdf5; --no:#b91c1c; --no2:#fef2f2;
  --warn:#b45309; --warn2:#fffbeb;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{background:var(--bg);color:var(--ink);font-family:'Apple SD Gothic Neo',-apple-system,BlinkMacSystemFont,'Segoe UI',system-ui,sans-serif;
  font-size:16px;line-height:1.6;-webkit-text-size-adjust:100%}
.wrap{max-width:720px;margin:0 auto;padding:16px 16px 120px}
h1{font-size:19px;margin:0}
h1 small{display:block;font-size:13px;color:var(--dim);font-weight:400;margin-top:3px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;margin:12px 0}
.card.warn{border-color:#fcd34d;background:var(--warn2)}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
input[type=text],input[type=password],select{flex:1;min-width:120px;font:inherit;padding:11px 12px;border:1px solid var(--line);
  border-radius:10px;background:#fff;color:var(--ink)}
input.code{font-family:ui-monospace,Menlo,monospace;font-size:22px;letter-spacing:3px;text-align:center;text-transform:uppercase}
button{font:inherit;font-weight:600;padding:12px 16px;border:0;border-radius:10px;background:var(--acc);color:#fff;cursor:pointer}
button:disabled{background:#c7cdd8;cursor:default}
button.ghost{background:#fff;color:var(--ink);border:1px solid var(--line)}
button.small{padding:8px 12px;font-size:14px}
.muted{color:var(--dim);font-size:14px}
.logo{display:block;height:34px;width:auto;margin:0 0 10px}
.by{margin-top:7px;padding-top:7px;border-top:1px solid var(--line);font-size:13px;color:var(--dim)}
.by b{color:var(--ink);font-weight:600}
.bar{position:fixed;left:0;right:0;bottom:0;background:rgba(245,246,243,.95);backdrop-filter:blur(6px);
  border-top:1px solid var(--line);padding:10px 16px calc(10px + env(safe-area-inset-bottom));z-index:5}
.bar .wrap{padding:0;display:flex;gap:8px;align-items:center}
.bar button{flex:1}
.clockbar{position:sticky;top:0;z-index:4;background:var(--card);border:1px solid var(--line);border-radius:12px;
  padding:10px 14px;margin:0 0 12px;display:flex;justify-content:space-between;align-items:center;gap:10px}
.clock{font-family:ui-monospace,Menlo,monospace;font-size:24px;font-weight:700;letter-spacing:1px}
.clock.hot{color:var(--no)}
.q{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin:12px 0}
.qh{display:flex;gap:8px;align-items:center;margin-bottom:8px}
.no{background:var(--acc);color:#fff;border-radius:999px;font-size:12.5px;font-weight:700;padding:2px 10px}
.tag{font-size:12.5px;color:var(--dim)}
.stem{font-family:'Times New Roman',Georgia,serif;font-size:19px;line-height:1.7;margin:2px 0 12px}
.stem u{text-decoration:none;border-bottom:2px solid var(--ink);padding:0 22px}
label.opt{display:flex;gap:10px;align-items:flex-start;padding:11px 12px;border:1px solid var(--line);border-radius:10px;
  margin:6px 0;background:#fff;cursor:pointer;font-family:'Times New Roman',Georgia,serif;font-size:17px}
label.opt input{margin:4px 0 0}
label.opt.pick{border-color:var(--acc);background:var(--acc2)}
label.opt.right{border-color:var(--ok);background:var(--ok2)}
label.opt.wrong{border-color:var(--no);background:var(--no2)}
.mark{font-weight:700;font-size:14px;font-family:system-ui}
.mark.o{color:var(--ok)} .mark.x{color:var(--no)}
.ex{margin-top:8px;padding:10px 12px;background:#f8fafc;border-left:3px solid var(--acc);border-radius:0 8px 8px 0;
  font-size:14px;color:#334155}
.big{text-align:center;padding:22px 16px}
.big .n{font-size:44px;font-weight:800;letter-spacing:-1px}
.big.pass .n{color:var(--ok)} .big.fail .n{color:var(--no)}
.big .m{font-size:15px;color:var(--dim);margin-top:4px}
.codebox{text-align:center;padding:16px;background:#0f172a;color:#fff;border-radius:14px;margin:12px 0}
.codebox .c{font-family:ui-monospace,Menlo,monospace;font-size:38px;font-weight:800;letter-spacing:4px;line-height:1.25}
.codebox .s{font-size:13px;color:#94a3b8;margin-top:6px}
pre.msg{white-space:pre-wrap;word-break:break-all;background:#0f172a;color:#e2e8f0;border-radius:10px;padding:12px;
  font-size:14px;font-family:ui-monospace,Menlo,monospace;margin:10px 0 0}
textarea{width:100%;min-height:110px;font:inherit;font-size:14px;padding:10px;border:1px solid var(--line);border-radius:10px}
table{width:100%;border-collapse:collapse;font-size:14px;margin-top:8px}
th,td{border:1px solid var(--line);padding:6px 8px;text-align:left}
th{background:#f1f5f9}
tr.bad td{background:var(--no2)}
tr.absent td{background:#f8fafc;color:var(--dim)}
.tabs{display:flex;gap:6px;margin-bottom:4px}
.tabs button{flex:1;background:#fff;color:var(--dim);border:1px solid var(--line)}
.tabs button.on{background:var(--acc);color:#fff;border-color:var(--acc)}
.hide{display:none!important}
a.link{color:var(--acc);font-size:13px;cursor:pointer;text-decoration:underline}
.kpi{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.kpi div{flex:1;min-width:84px;background:#f8fafc;border:1px solid var(--line);border-radius:10px;padding:8px 10px;text-align:center;font-size:13px}
.kpi b{display:block;font-size:22px}
</style>
</head>
<body>
<div class="wrap">
  <header class="card" style="padding:14px 16px">
    <img id="logo" class="logo hide" alt="">
    <h1 id="appTitle"><small id="appSub"></small></h1>
    <div class="by" id="appBy"></div>
  </header>

  <!-- ───────── 학생: 대기 화면 ───────── -->
  <section id="home">
    <div class="card warn">
      <b>대기 중입니다</b>
      <p class="muted" style="margin:6px 0 0">교수님이 <b>시험 코드</b>를 알려주시면 아래에 입력하세요.
        코드를 넣기 전에는 문제가 나오지 않습니다.</p>
    </div>
    <div class="card">
      <div class="row"><input type="text" id="name" placeholder="이름 (필수)" autocomplete="off"></div>
      <div class="row" style="margin-top:8px">
        <input type="text" id="code" class="code" placeholder="XXXX-XXXX" maxlength="9" autocomplete="off"
               autocapitalize="characters" spellcheck="false"></div>
      <p class="muted" id="codeMsg" style="margin:8px 0 0"></p>
    </div>
    <div class="card">
      <div class="row" style="justify-content:space-between">
        <b>내 응시 기록</b>
        <span></span>
      </div>
      <div id="myLog" class="muted" style="margin-top:6px">아직 기록이 없습니다.</div>
    </div>
  </section>

  <!-- ───────── 학생: 시험 ───────── -->
  <section id="quiz" class="hide">
    <div class="clockbar">
      <div><b id="quizWho"></b><div class="muted" id="quizSub"></div></div>
      <div class="clock" id="clock">--:--</div>
    </div>
    <div id="qs"></div>
  </section>

  <!-- ───────── 학생: 제출 완료(종료 대기) ───────── -->
  <section id="waitEnd" class="hide">
    <div class="card big"><div class="n" id="waitClock">--:--</div>
      <div class="m">제출되었습니다. <b>시험 종료 시각</b>이 되면 점수와 해설이 열립니다.<br>
        그때까지 이 화면을 그대로 두세요.</div></div>
    <div class="card"><div class="muted" id="waitInfo"></div></div>
  </section>

  <!-- ───────── 학생: 결과 ───────── -->
  <section id="result" class="hide">
    <div class="card big" id="scoreCard"><div class="n" id="scoreN"></div><div class="m" id="scoreM"></div></div>
    <div class="card"><p class="muted" style="margin:0">채점은 서버에서 이루어졌고, 결과는 <b>교수님께 자동으로 전송</b>되었습니다.
      따로 보내실 필요가 없습니다.</p></div>
    <div id="review"></div>
  </section>

  
</div>

}
const shuf = (arr, rnd) => { const a = arr.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(rnd() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
function hashNum(s) { let h = 2166136261 >>> 0; for (let i = 0; i < s.length; i++) { h ^= s.charCodeAt(i); h = Math.imul(h, 16777619) >>> 0; } return h; }
const B32 = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789';        // I O 0 1 은 뺐다 — 받아적기 좋게

/* ── 시험 코드: 단원·종료시각·시드·합격선을 8자에 담는다 ─────────── */
function packCode(unit, endMin, seed, passIdx) {
  let v = unit & 15;                                   // 4bit  단원
  v = v * 2048 + (endMin & 2047);                      // 11bit 종료 시각(0시부터 분)
  v = v * 65536 + (seed & 65535);                      // 16bit 문제 시드
  v = v * 4 + (passIdx & 3);                           // 2bit  합격선
  const full = v * 128 + (hashNum(v + '|' + D.salt) % 127);
  let x = full, out = '';
  for (let i = 0; i < 8; i++) { out = B32[x % 32] + out; x = Math.floor(x / 32); }
  return out.slice(0, 4) + '-' + out.slice(4);
}
function unpackCode(txt) {
  const s = String(txt || '').toUpperCase().replace(/[^A-Z2-9]/g, '');
  if (s.length !== 8) return null;
  let full = 0;
  for (const ch of s) { const k = B32.indexOf(ch); if (k < 0) return null; full = full * 32 + k; }
  const chk = full % 128, v = Math.floor(full / 128);
  if (hashNum(v + '|' + D.salt) % 127 !== chk) return null;
  const passIdx = v % 4, v1 = Math.floor(v / 4);
  const seed = v1 % 65536, v2 = Math.floor(v1 / 65536);
  const endMin = v2 % 2048, unit = Math.floor(v2 / 2048);
  if (!D.units.some(u => u.n === unit) || endMin > 1439 || passIdx >= PASS_OPTS.length) return null;
  return { unit, endMin, seed, passIdx, pass: PASS_OPTS[passIdx], code: s.slice(0, 4) + '-' + s.slice(4) };
}
/* 종료 시각(오늘 endMin분). 12시간 넘게 지난 코드는 지난 시험으로 본다. */
function endTime(endMin) {
  const d = new Date(); d.setHours(0, endMin, 0, 0);
  if (Date.now() - d.getTime() > 12 * 3600e3) return null;
  return d;
}
const mmss = ms => { ms = Math.max(0, ms); const s = Math.round(ms / 1000); return String(Math.floor(s / 60)).padStart(2, '0') + ':' + String(s % 60).padStart(2, '0'); };
const hhmm = d => String(d.getHours()).padStart(2, '0') + ':' + String(d.getMinutes()).padStart(2, '0');

/* ── 출제: 코드(단원·시드)만으로 정해진다 — 반 전체가 같은 N문제 ─── */
function examItems(unit, seed) {
  const rnd = mulberry32(hashNum('E|' + unit + '|' + seed + '|' + D.salt) >>> 0);
  const picked = [], usedFrame = new Set();
  const take = (cands, want) => {
    for (const it of shuf(cands, rnd)) {
      if (want <= 0 || picked.length >= N) break;
      if (usedFrame.has(frameOf(it.id)) || picked.includes(it)) continue;
      picked.push(it); usedFrame.add(frameOf(it.id)); want--;
    }
  };
  const today = D.items[unit], prev = rangeOf(unit).filter(n => n !== unit);
  const want = prev.length ? TODAY : N;                // 오늘 단원에서 낼 문제 수(Unit 1 시험이면 전부)
  const parts = [...new Set(today.map(x => x.part))].sort();     // 단원 안에 갈래가 여럿이면 고르게
  parts.forEach((p, i) => take(today.filter(x => x.part === p),
    Math.floor(want / parts.length) + (i < want % parts.length ? 1 : 0)));
  take(today, want - picked.length);                   // 갈래가 모자라면 같은 단원에서 마저 채운다
  if (prev.length) {
    const order = shuf(prev, rnd);                     // 앞 단원은 돌아가며 한 문제씩
    for (let i = 0; picked.length < N && i < order.length * 8; i++) take(D.items[order[i % order.length]], 1);
  }
  take(rangeOf(unit).flatMap(n => D.items[n]), N - picked.length);
  return picked.slice(0, N);
}
/* 문제 순서는 반 전체가 같고(교수님이 「3번」으로 설명하실 수 있게), 보기 순서만 학생마다 다르다 */
function paperFor(items, name, code) {
  const rnd = mulberry32(hashNum(name.trim() + '@' + code + '|' + D.salt) >>> 0);
  const qs = items.map(it => {
    const perm = shuf([0, 1, 2, 3], rnd);
    return { id: it.id, u: it.u, part: it.part, point: it.point, q: it.q, ex: it.ex,
             opts: perm.map(i => it.opts[i]), ans: perm.indexOf(it.ans) };
  });
  const cap = Math.ceil(qs.length / 4) + 1;            // 정답이 한 자리에 몰리지 않게
  for (let p = 0; p < 12; p++) {
    const h = [0, 0, 0, 0]; qs.forEach(q => h[q.ans]++);
    const hi = h.indexOf(Math.max(...h)), lo = h.indexOf(Math.min(...h));
    if (h[hi] <= cap) break;
    const q = qs.find(x => x.ans === hi);
    [q.opts[hi], q.opts[lo]] = [q.opts[lo], q.opts[hi]]; q.ans = lo;
  }
  return qs;
}

/* ── 채점 서버 (구글 Apps Script) ───────────────────────────────── */
const SRV = D.server_url || '';
async function post(act, body) {
  if (!SRV) throw new Error('채점 서버 주소가 설정되어 있지 않습니다.');
  const r = await fetch(SRV, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' },
                               body: JSON.stringify(Object.assign({ act: act }, body)) });
  const t = await r.text();
  let j; try { j = JSON.parse(t); } catch (e) { throw new Error('서버 응답을 읽지 못했습니다.'); }
  if (!j.ok) throw new Error(j.msg || '서버가 요청을 거절했습니다.');
  return j;
}

/* ── 화면 전환 ──────────────────────────────────────────────────── */
let view = 'home', cur = null, tick = null;
function show(v) {
  view = v;
  ['home', 'quiz', 'waitEnd', 'result', 'teacher', 'gate'].forEach(x => { const e = $('#' + x); if (e) e.classList.toggle('hide', x !== v); });
  window.scrollTo(0, 0); bar();
}
function bar() {
  const b = $('#barIn'); b.innerHTML = '';
  if (view === 'home') {
    const c = unpackCode($('#code').value), end = c && endTime(c.endMin);
    const done = c && store.get('done:' + c.code, null);
    const go = el('button', '', done ? '내 결과 보기' : '시험 시작');
    go.disabled = !($('#name').value.trim() && c && end && (done || Date.now() < end.getTime()));
    go.onclick = start; b.append(go);
  } else if (view === 'quiz') {
    const n = cur.pick.filter(x => x !== null).length;
    const g = el('button', '', `제출하기 (${n}/${N} 답함)`);
    g.disabled = n < N;
    g.onclick = () => { if (confirm('제출하면 고칠 수 없습니다. 제출할까요?')) submit('제출'); };
    b.append(g);
  } else if (view === 'waitEnd') {
    if (cur && store.get('pend:' + cur.code, null)) {
      const r = el('button', '', '다시 보내기'); r.onclick = () => { $('#waitInfo').textContent = '채점 서버로 보내는 중…'; sendPending(); };
      b.append(r);
    } else b.append(el('span', 'muted', '시험이 끝날 때까지 기다려 주세요.'));
  } else if (view === 'result') {
    const h = el('button', '', '처음 화면으로'); h.onclick = () => { cur = null; home(); show('home'); };
    b.append(h);
  } else {
    const h = el('button', 'ghost', '학생 화면으로'); h.onclick = () => { home(); show('home'); };
    b.append(h);
  }
}

/* ── 학생 ───────────────────────────────────────────────────────── */
function home() {
  const log = store.get('log', []);
  $('#myLog').innerHTML = log.length
    ? '<table><tr><th>단원</th><th>점수</th><th>결과</th><th>시각</th></tr>'
      + log.slice(-10).reverse().map(r => `<tr><td>U${r.u}</td><td>${r.score}/${r.n}</td>`
        + `<td style="color:${r.pass ? 'var(--ok)' : 'var(--no)'}">${r.pass ? '합격' : '불합격'}</td><td>${r.at}</td></tr>`).join('')
      + '</table>'
    : '아직 기록이 없습니다.';
  bar();
}
function codeCheck() {
  const raw = $('#code').value.trim(), m = $('#codeMsg');
  if (!raw) { m.textContent = ''; return bar(); }
  const c = unpackCode(raw);
  if (!c) { m.innerHTML = '<span style="color:var(--no)">코드가 올바르지 않습니다. 다시 확인하세요.</span>'; return bar(); }
  const end = endTime(c.endMin);
  if (!end) { m.innerHTML = '<span style="color:var(--no)">지난 시험 코드입니다.</span>'; return bar(); }
  if (Date.now() >= end.getTime() && !store.get('done:' + c.code, null)) {
    m.innerHTML = `<span style="color:var(--no)">이미 종료된 시험입니다(종료 ${hhmm(end)}). 응시할 수 없습니다.</span>`; return bar(); }
  if (!SRV) { m.innerHTML = '<span style="color:var(--no)">채점 서버가 아직 연결되지 않았습니다. 교수님께 알려 주세요.</span>'; return bar(); }
  m.innerHTML = store.get('done:' + c.code, null)
    ? '<span style="color:var(--warn)">이미 응시한 시험입니다. 「시험 시작」을 누르면 제출한 결과를 봅니다.</span>'
    : `Unit ${c.unit} · 범위 ${rangeLabel(c.unit)} · ${N}문제 · ${c.pass}문제 이상 합격 · 종료 ${hhmm(end)}`;
  bar();
}
function start() {
  const name = $('#name').value.trim(), c = unpackCode($('#code').value);
  if (!name || !c) return;
  store.set('name', name);
  const end = endTime(c.endMin);
  if (!end) return codeCheck();
  const pend = store.get('pend:' + c.code, null);
  if (pend) {                                          // 보내지 못한 답안이 있으면 먼저 보낸다
    cur = { ...c, name: pend.name || name, end: end.getTime(), pick: pend.pick || [], leave: pend.leave || 0,
            qs: paperFor(examItems(c.unit, c.seed), pend.name || name, c.code) };
    show('waitEnd'); $('#waitInfo').textContent = '채점 서버로 보내는 중…'; return sendPending();
  }
  const done = store.get('done:' + c.code, null);
  if (done) {                                          // 재응시 차단 — 제출본 결과만 보여준다
    cur = { ...done, end: end.getTime(), qs: paperFor(examItems(done.unit, done.seed), done.name, done.code) };
    show('waitEnd'); $('#waitInfo').textContent = '제출한 답안을 확인하는 중…'; return fetchResult();
  }
  if (Date.now() >= end.getTime()) return codeCheck();

  const saved = store.get('run:' + c.code, null);
  cur = { ...c, name, end: end.getTime(), qs: paperFor(examItems(c.unit, c.seed), name, c.code),
          pick: saved ? saved.pick : Array(N).fill(null), leave: saved ? saved.leave : 0 };
  paint(); show('quiz'); startTick();
}
const saveRun = () => store.set('run:' + cur.code, { pick: cur.pick, leave: cur.leave });

function paint() {
  const u = D.units.find(x => x.n === cur.unit);
  $('#quizWho').textContent = `Unit ${cur.unit} ${u.title}`;
  $('#quizSub').textContent = `범위 ${rangeLabel(cur.unit)} · ${N}문제 · ${cur.pass}문제 이상 합격`;
  const box = $('#qs'); box.innerHTML = '';
  cur.qs.forEach((q, i) => {
    const c = el('div', 'q');
    c.append(el('div', 'qh', `<span class="no">${i + 1}</span>`));   // 시험 중에는 문법 이름을 밝히지 않는다(답의 종류가 드러난다)
    c.append(el('div', 'stem', esc(q.q).replace(/_{3,}/, '<u></u>')));
    q.opts.forEach((o, k) => {
      const lb = el('label', 'opt' + (cur.pick[i] === k ? ' pick' : ''));
      lb.innerHTML = `<input type="radio" name="q${i}" value="${k}"${cur.pick[i] === k ? ' checked' : ''}><span>${CIRC[k]} ${esc(o)}</span>`;
      lb.querySelector('input').onchange = () => {
        cur.pick[i] = k; saveRun();
        [...c.querySelectorAll('label.opt')].forEach((x, j) => x.classList.toggle('pick', j === k));
        bar();
      };
      c.append(lb);
    });
    box.append(c);
  });
}

/* ── 시계: 종료 시각에 전원 자동 제출, 종료 뒤에만 결과 공개 ─────── */
function startTick() {
  clearInterval(tick);
  const upd = () => {
    if (!cur) return clearInterval(tick);
    const left = cur.end - Date.now();
    if (view === 'quiz') {
      const c = $('#clock'); c.textContent = mmss(left); c.classList.toggle('hot', left < 60e3);
      if (left <= 0) submit('시간 종료');
    } else if (view === 'waitEnd') {
      $('#waitClock').textContent = mmss(left);
      if (left <= 0) { clearInterval(tick); if (!store.get('pend:' + cur.code, null)) fetchResult(); }
    } else clearInterval(tick);
  };
  upd(); tick = setInterval(upd, 250);                  // 첫 화면부터 시계가 보이게 한 번 먼저
}
async function submit(how) {
  clearInterval(tick);
  const answers = cur.qs.map((q, i) => ({ id: q.id, pick: cur.pick[i] === null || cur.pick[i] === undefined ? '' : q.opts[cur.pick[i]] }));
  store.set('pend:' + cur.code, { name: cur.name, pick: cur.pick, answers: answers, leave: cur.leave, how: how,
                                  unit: cur.unit, seed: cur.seed, endMin: cur.endMin, pass: cur.pass, endAt: cur.end });
  show('waitEnd'); $('#waitInfo').textContent = '채점 서버로 보내는 중…';
  await sendPending();
}
/** 저장해 둔 답안을 서버로 보낸다. 실패하면 답안은 남고 「다시 보내기」가 뜬다. */
async function sendPending() {
  const p = store.get('pend:' + cur.code, null);
  if (!p) return afterSubmit({ ok: true, held: true });
  try {
    const res = await post('submit', { code: cur.code, name: p.name, answers: p.answers, leave: p.leave,
                                       how: p.how, endAt: p.endAt, pass: p.pass });
    store.del('pend:' + cur.code);
    store.set('done:' + cur.code, { code: cur.code, name: p.name, unit: p.unit, seed: p.seed,
                                    endMin: p.endMin, pass: p.pass, pick: p.pick, leave: p.leave });
    afterSubmit(res);
  } catch (e) {
    $('#waitInfo').innerHTML = `<span style="color:var(--no)">보내지 못했습니다 — ${esc(e.message)}</span><br>`
      + '답안은 이 기기에 저장되어 있습니다. 연결을 확인하고 「다시 보내기」를 누르세요.';
    bar();
  }
}
/** 종료 뒤 서버에서 점수·해설을 받아온다 */
async function fetchResult() {
  try {
    const res = await post('result', { code: cur.code, name: cur.name });
    afterSubmit(res);
  } catch (e) {
    $('#waitInfo').innerHTML = `<span style="color:var(--no)">결과를 받지 못했습니다 — ${esc(e.message)}</span>`;
  }
}
function afterSubmit(res) {
  if (res && res.held) {                                // 아직 시험 시간 — 점수는 알려주지 않는다
    if (res.endAt) cur.end = res.endAt;                 // 종료 시각은 서버 것이 정본
    $('#waitInfo').innerHTML = `${esc(cur.name || '')} · Unit ${cur.unit} · 제출 완료`
      + (res.dup ? ' <span style="color:var(--warn)">(이미 제출한 시험입니다)</span>' : '')
      + ` · 종료 예정 ${hhmm(new Date(cur.end))}<br>채점 결과는 교수님께 자동으로 전송되었습니다.`;
    show('waitEnd'); startTick(); return;
  }
  if (res && res.marks) return showResult(res);
  $('#waitInfo').textContent = '결과를 기다리는 중…';
}
function showResult(res) {
  const u = D.units.find(x => x.n === cur.unit);
  const marks = new Map(res.marks.map(m => [m.id, m]));
  cur.passed = res.pass;
  const log = store.get('log', []);
  if (!log.some(r => r.code === cur.code)) {
    log.push({ u: cur.unit, score: res.score, n: res.n, pass: res.pass, at: hhmm(new Date()), code: cur.code });
    store.set('log', log.slice(-100));
  }
  $('#scoreCard').className = 'card big ' + (res.pass ? 'pass' : 'fail');
  $('#scoreN').textContent = `${res.score} / ${res.n}`;
  $('#scoreM').innerHTML = res.pass
    ? `<b style="color:var(--ok)">합격</b> · Unit ${cur.unit} ${esc(u.title)} · 범위 ${rangeLabel(cur.unit)}`
    : `<b style="color:var(--no)">불합격</b> · ${res.passLine || cur.pass}문제 이상 맞혀야 합격입니다. 아래 해설을 확인하세요.`;
  const rv = $('#review'); rv.innerHTML = '';
  cur.qs.forEach((q, i) => {
    const m = marks.get(q.id) || { ok: false, a: '', ex: '' };
    const c = el('div', 'q');
    c.append(el('div', 'qh', `<span class="no">${i + 1}</span><span class="mark ${m.ok ? 'o' : 'x'}">${m.ok ? '○ 정답' : '✕ 오답'}</span>`));
    c.append(el('div', 'stem', esc(q.q).replace(/_{3,}/, '<u></u>')));
    q.opts.forEach((o, k) => {
      const cls = o === m.a ? 'opt right' : (k === cur.pick[i] ? 'opt wrong' : 'opt');
      c.append(el('label', cls, `<span>${CIRC[k]} ${esc(o)}</span>`));
    });
    if (m.ex) c.append(el('div', 'ex', '▸ ' + esc(m.ex)));
    rv.append(c);
  });
  show('result');
}
/* 시험 중 다른 앱·탭으로 나간 횟수를 센다 (결과에 함께 보고된다) */
document.addEventListener('visibilitychange', () => {
  if (document.hidden && view === 'quiz' && cur) { cur.leave++; saveRun(); }
});



/* ── 시작 ───────────────────────────────────────────────────────── */
$('#appTitle').insertAdjacentText('afterbegin', D.title);
$('#appSub').textContent = D.sub;
if (D.logo) { const g = $('#logo'); g.src = D.logo; g.alt = D.school || ''; g.classList.remove('hide'); }
$('#appBy').innerHTML = [D.school ? esc(D.school) : '', D.teacher ? '교수 <b>' + esc(D.teacher) + '</b>' : '']
  .filter(Boolean).join(' &nbsp;·&nbsp; ');
document.title = D.title;
$('#name').value = store.get('name', '');
$('#name').oninput = bar;
$('#code').oninput = () => {
  const v = $('#code').value.toUpperCase().replace(/[^A-Z2-9]/g, '').slice(0, 8);
  $('#code').value = v.length > 4 ? v.slice(0, 4) + '-' + v.slice(4) : v;
  codeCheck();
};

const qp = new URLSearchParams(location.search);
if (qp.get('c')) { $('#code').value = qp.get('c').toUpperCase(); codeCheck(); }
home();
if (D.role === 'teacher') { if (store.get('auth', false)) teacher(); else gateOpen(); }
else show('home');
</script>
