o와 (C) so as to는 뒤에 동사원형이 와야 하고, (D) in order for는 뒤에 <명사 + to부정사>가 와야 한다.", "point": "목적 접속사 so that"}, {"id": "U09-D30", "stem": "Demand for the new fitness tracker was _______ strong that the manufacturer had to open a second assembly line.", "ch": ["so", "such", "very", "too"], "a": 0, "ex": "해석  새 피트니스 트래커의 수요가 너무 많아서 제조사는 두 번째 조립 라인을 열어야 했다.\n해설  빈칸 뒤에 형용사 strong과 that절이 이어지는 <so + 형용사 + that> 구문이므로 (A) so가 정답이다. (B) such는 뒤에 명사가 와야 하고, (C) very와 (D) too는 that절과 짝을 이루지 못한다.", "point": "결과 so + 형용사 + that"}, {"id": "U09-D31", "stem": "The Marlowe Hotel remains popular with business travelers _______ it is located far from the city center.", "ch": ["despite", "although", "in spite of", "nevertheless"], "a": 1, "ex": "해석  말로우 호텔은 도심에서 멀리 떨어져 있는데도 출장객들에게 여전히 인기가 있다.\n해설  빈칸 뒤에 완전한 절이 오고 앞 절과 내용이 대조되므로 양보 접속사 (B) although가 정답이다. (A) despite와 (C) in spite of는 전치사(구)라 명사가 와야 하고, (D) nevertheless는 부사라 절을 이끌 수 없다.", "point": "양보 접속사 although vs 전치사 despite"}, {"id": "U09-D32", "stem": "Mr. Adeyemi accepted the position in Halifax _______ the salary was slightly lower than his previous one.", "ch": ["despite", "regardless of", "even though", "however"], "a": 2, "ex": "해석  아데예미 씨는 급여가 이전 직장보다 약간 낮았는데도 핼리팩스의 그 자리를 수락했다.\n해설  빈칸 뒤에 절이 오고 '~인데도'의 양보를 나타내므로 접속사 (C) even though가 정답이다. (A) despite와 (B) regardless of는 전치사(구)라 뒤에 명사가 와야 하고, (D) however는 부사다.", "point": "양보 접속사 even though"}, {"id": "U09-D33", "stem": "All orders placed before noon will be shipped the same day _______ the customer selects standard delivery.", "ch": ["even so", "regardless", "in spite of", "even if"], "a": 3, "ex": "해석  고객이 일반 배송을 선택하더라도 정오 이전에 접수된 모든 주문은 당일 발송된다.\n해설  빈칸 뒤에 완전한 절이 오고 '~하더라도'의 뜻이므로 양보 접속사 (D) even if가 정답이다. (A) even so와 (B) regardless는 부사(구)라 절을 이끌 수 없고, (C) in spite of는 전치사구다.", "point": "양보 접속사 even if"}, {"id": "U09-D34", "stem": "The Riverside branch is open seven days a week, _______ the Hillcrest branch closes on Sundays and public holidays.", "ch": ["whereas", "unlike", "instead of", "contrary to"], "a": 0, "ex": "해석  리버사이드 지점은 주 7일 영업하는 반면, 힐크레스트 지점은 일요일과 공휴일에 문을 닫는다.\n해설  두 절의 내용이 대조되고 빈칸 뒤에 완전한 절이 오므로 대조 접속사 (A) whereas가 정답이다. (B) unlike, (C) instead of, (D) contrary to는 모두 전치사(구)라 뒤에 명사가 와야 한다.", "point": "대조 접속사 whereas"}, {"id": "U09-D35", "stem": "Please silence your mobile phones _______ the keynote speaker is delivering her address in the main hall.", "ch": ["during", "meanwhile", "while", "throughout"], "a": 2, "ex": "해석  기조연설자가 대강당에서 연설하는 동안에는 휴대전화를 무음으로 해 주십시오.\n해설  빈칸 뒤에 <주어 + 동사>의 절이 오므로 '~하는 동안'의 접속사 (C) while이 정답이다. 같은 뜻의 (A) during과 (D) throughout은 전치사라 명사가 와야 하고, (B) meanwhile은 부사라 절을 이끌 수 없다.", "point": "while(접속사) vs during(전치사)"}, {"id": "U09-D36", "stem": "Access to the east stairwell will be restricted _______ the renovation of the third floor next month.", "ch": ["while", "when", "as long as", "during"], "a": 3, "ex": "해석  다음 달 3층 보수 공사 기간 동안 동쪽 계단 출입이 제한될 것이다.\n해설  빈칸 뒤에 명사구 the renovation of the third floor가 오므로 전치사 (D) during이 정답이다. (A) while, (B) when, (C) as long as는 접속사라 뒤에 <주어 + 동사>의 절이 와야 한다.", "point": "during(전치사) vs while(접속사)"}, {"id": "U09-D37", "stem": "Several morning flights to Oslo were delayed by nearly two hours _______ heavy fog over the airport.", "ch": ["because", "because of", "since", "now that"], "a": 1, "ex": "해석  공항 상공의 짙은 안개 때문에 오슬로행 오전 항공편 몇 편이 두 시간 가까이 지연되었다.\n해설  빈칸 뒤에 명사구 heavy fog가 오므로 전치사구 (B) because of가 정답이다. (A) because, (C) since, (D) now that은 접속사라 뒤에 절이 와야 한다.", "point": "because of(전치사) vs because(접속사)"}, {"id": "U09-D38", "stem": "The annual picnic has been postponed _______ a scheduling conflict with the regional sales conference.", "ch": ["due to", "because", "although", "so that"], "a": 0, "ex": "해석  지역 영업 회의와 일정이 겹쳐서 연례 야유회가 연기되었다.\n해설  빈칸 뒤에 명사구 a scheduling conflict가 오므로 '~ 때문에'의 전치사구 (A) due to가 정답이다. (B) because, (C) although, (D) so that은 접속사라 뒤에 <주어 + 동사>가 와야 한다.", "point": "due to(전치사) vs 이유·양보 접속사"}, {"id": "U09-D39", "stem": "More than two hundred people attended the grand opening of Verano Market _______ the heavy rain on Saturday.", "ch": ["although", "even though", "despite", "whereas"], "a": 2, "ex": "해석  토요일의 폭우에도 불구하고 200명이 넘는 사람들이 베라노 마켓 개장 행사에 참석했다.\n해설  빈칸 뒤에 명사구 the heavy rain이 오므로 '~에도 불구하고'의 전치사 (C) despite가 정답이다. (A) although, (B) even though, (D) whereas는 접속사라 뒤에 절이 와야 한다.", "point": "despite(전치사) vs although(접속사)"}, {"id": "U09-D40", "stem": "We will schedule the installation of the solar panels _______ receipt of your signed contract.", "ch": ["as soon as", "once", "when", "upon"], "a": 3, "ex": "해석  서명된 계약서를 받는 대로 태양광 패널 설치 일정을 잡아 드리겠습니다.\n해설  빈칸 뒤에 명사구 receipt of your signed contract가 오므로 '~하자마자'의 전치사 (D) upon이 정답이다. (A) as soon as, (B) once, (C) when은 접속사라 뒤에 <주어 + 동사>의 절이 와야 한다.", "point": "upon(전치사) vs as soon as(접속사)"}]}, {"id": "U10", "name": "U10 관계대명사", "items": [{"id": "U10-D01", "stem": "Ms. Delacroix will introduce the new accountant _______ joined the finance department at Harlow Textiles last Monday.", "ch": ["who", "which", "whose", "whom"], "a": 0, "ex": "해석  Delacroix 씨는 지난 월요일 Harlow Textiles 재무부에 합류한 신입 회계사를 소개할 것이다.\n해설  선행사가 사람(the new accountant)이고 빈칸 뒤에 동사 joined가 바로 오므로 주격 관계대명사 (A) who가 정답이다. (B) which는 사물 선행사에 쓰고, (C) whose 뒤에는 명사가 와야 하며, (D) whom은 목적격이라 주어 자리에 올 수 없다.", "point": "주격 관계대명사 — 사람 선행사 who"}, {"id": "U10-D02", "stem": "Brightway Logistics has installed a tracking system _______ allows customers to check the location of their parcels online.", "ch": ["who", "which", "whom", "whose"], "a": 1, "ex": "해석  Brightway Logistics는 고객이 온라인으로 소포 위치를 확인할 수 있게 해 주는 추적 시스템을 설치했다.\n해설  선행사가 사물(a tracking system)이고 빈칸 뒤에 동사 allows가 바로 오므로 주격 관계대명사 (B) which가 정답이다. (A) who와 (C) whom은 사람 선행사에만 쓰고, (D) whose 뒤에는 명사가 필요하다.", "point": "주격 관계대명사 — 사물 선행사 which"}, {"id": "U10-D03", "stem": "The conference room _______ Mr. Okafor reserved for the budget meeting is located on the fourth floor.", "ch": ["who", "what", "that", "whom"], "a": 2, "ex": "해석  Okafor 씨가 예산 회의를 위해 예약한 회의실은 4층에 있다.\n해설  선행사가 사물(The conference room)이고 빈칸 뒤에 <주어 + 동사>(Mr. Okafor reserved)가 오므로 목적격 관계대명사 (C) that이 정답이다. (A) who와 (D) whom은 사람 선행사에 쓰고, (B) what은 선행사를 포함하는 말이라 앞에 명사가 있으면 쓸 수 없다.", "point": "목적격 관계대명사 — 사물 선행사 that"}, {"id": "U10-D04", "stem": "The sales representative to _______ you spoke yesterday is currently on vacation until the end of the month.", "ch": ["who", "whom", "whose", "which"], "a": 1, "ex": "해석  어제 당신이 이야기를 나눈 영업 담당자는 이달 말까지 휴가 중이다.\n해설  선행사가 사람(The sales representative)이고 전치사 to 바로 뒤의 자리이므로 목적격 (B) whom이 정답이다. (A) who는 전치사 바로 뒤에 쓸 수 없고, (D) which는 사물 선행사에 쓰며, (C) whose 뒤에는 명사가 필요하다.", "point": "목적격 관계대명사 — 전치사 뒤 whom"}, {"id": "U10-D05", "stem": "Employees _______ parking permits expire in October should renew them at the security office before the end of September.", "ch": ["who", "whom", "which", "whose"], "a": 3, "ex": "해석  주차 허가증이 10월에 만료되는 직원들은 9월 말 전에 보안 사무실에서 허가증을 갱신해야 한다.\n해설  빈칸 뒤에 명사 parking permits가 이어지고 '직원들의 주차 허가증'이라는 소유 관계이므로 소유격 (D) whose가 정답이다. (A) who는 뒤에 동사가, (B) whom은 뒤에 <주어 + 동사>가 와야 하며, (C) which는 사람 선행사에 쓸 수 없다.", "point": "소유격 관계대명사 whose"}, {"id": "U10-D06", "stem": "Tenants whose leases _______ ending in December must notify the building manager in writing at least sixty days in advance.", "ch": ["is", "are", "be", "being"], "a": 1, "ex": "해석  임대 계약이 12월에 끝나는 세입자들은 최소 60일 전에 건물 관리자에게 서면으로 통지해야 한다.\n해설  whose 뒤의 명사 leases가 관계절의 주어이고 복수이므로 진행형을 만드는 be동사 (B) are가 정답이다. (A) is는 단수 주어에 쓰고, (C) be와 (D) being은 주어 뒤 본동사 자리에 단독으로 올 수 없다.", "point": "whose + 명사 + 동사 — 복수 명사에 맞춘 동사"}, {"id": "U10-D07", "stem": "Grayson Foods is a family-owned company whose main factory _______ located just outside the city of Portland.", "ch": ["is", "are", "being", "to be"], "a": 0, "ex": "해석  Grayson Foods는 주 공장이 포틀랜드 시 바로 외곽에 있는 가족 소유 회사이다.\n해설  whose 뒤의 명사 main factory가 관계절의 주어이며 단수이므로 (A) is가 정답이다. (B) are는 복수 주어에 쓰고, (C) being과 (D) to be는 문장의 본동사 역할을 할 수 없다.", "point": "whose + 명사 + 동사 — 단수 명사에 맞춘 동사"}, {"id": "U10-D08", "stem": "The auditorium _______ the annual shareholders meeting will be held can accommodate up to five hundred guests.", "ch": ["which", "in which", "in that", "whose"], "a": 1, "ex": "해석  연례 주주총회가 열릴 강당은 최대 500명의 손님을 수용할 수 있다.\n해설  빈칸 뒤 the annual shareholders meeting will be held는 주어와 동사를 모두 갖춘 완전한 절이므로 <전치사 + 관계대명사>인 (B) in which가 정답이다. (A) which만 쓰면 관계절에 빈자리가 없어 틀리고, (C) that은 전치사 뒤에 쓸 수 없으며, (D) whose 뒤에는 명사가 바로 와야 한다.", "point": "전치사 + 관계대명사 — 뒤에 완전한 절"}, {"id": "U10-D09", "stem": "Please confirm the time _______ the delivery truck is expected to arrive so that the loading dock can be cleared.", "ch": ["at which", "which", "at that", "whom"], "a": 0, "ex": "해석  하역장을 비워 둘 수 있도록 배송 트럭이 도착할 예정인 시각을 확인해 주십시오.\n해설  빈칸 뒤 the delivery truck is expected to arrive가 완전한 절이므로 <전치사 + 관계대명사> (A) at which가 정답이다(arrive at the time). (B) which만 쓰면 관계절에 빈자리가 없고, (C) that은 전치사 뒤에 올 수 없으며, (D) whom은 사람 선행사에 쓴다.", "point": "전치사 + 관계대명사 — 뒤에 완전한 절"}, {"id": "U10-D10", "stem": "The position _______ Ms. Lindqvist applied requires at least three years of experience in international sales.", "ch": ["which", "whom", "for which", "for that"], "a": 2, "ex": "해석  Lindqvist 씨가 지원한 직책은 국제 영업 분야 경력 3년 이상을 요구한다.\n해설  빈칸 뒤 Ms. Lindqvist applied는 완전한 절이며 apply for(~에 지원하다)의 전치사가 필요하므로 (C) for which가 정답이다. (A) which만 쓰면 applied 뒤에 전치사가 없어 틀리고, (B) whom은 사람 선행사에 쓰며, (D) that은 전치사 뒤에 쓸 수 없다.", "point": "전치사 + 관계대명사 — 뒤에 완전한 절"}, {"id": "U10-D11", "stem": "The date _______ the new safety regulations take effect has been moved from early April to the middle of June.", "ch": ["on that", "which", "whose", "on which"], "a": 3, "ex": "해석  새 안전 규정이 시행되는 날짜가 4월 초에서 6월 중순으로 변경되었다.\n해설  빈칸 뒤 the new safety regulations take effect가 완전한 절이므로 <전치사 + 관계대명사> (D) on which가 정답이다(on the date). (A) that은 전치사 뒤에 쓸 수 없고, (B) which만 쓰면 관계절에 빈자리가 없으며, (C) whose 뒤에는 명사가 바로 와야 한다.", "point": "전치사 + 관계대명사 — 뒤에 완전한 절"}, {"id": "U10-D12", "stem": "Kessler Automotive offers a two-year warranty period _______ all repairs are performed free of charge.", "ch": ["during which", "which", "during that", "whom"], "a": 0, "ex": "해석  Kessler Automotive는 모든 수리가 무료로 이루어지는 2년의 보증 기간을 제공한다.\n해설  빈칸 뒤 all repairs are performed free of charge가 완전한 절이므로 <전치사 + 관계대명사> (A) during which가 정답이다(during the period). (B) which만 쓰면 관계절에 빈자리가 없고, (C) that은 전치사 뒤에 올 수 없으며, (D) whom은 사람 선행사에 쓴다.", "point": "전치사 + 관계대명사 — 뒤에 완전한 절"}, {"id": "U10-D13", "stem": "The deadline _______ all expense reports must be submitted has been extended to the last Friday of the month.", "ch": ["which", "by which", "by that", "whose"], "a": 1, "ex": "해석  모든 경비 보고서를 제출해야 하는 마감일이 이달 마지막 금요일로 연장되었다.\n해설  빈칸 뒤 all expense reports must be submitted가 완전한 절이므로 <전치사 + 관계대명사> (B) by which가 정답이다(by the deadline). (A) which만 쓰면 관계절에 빈자리가 없고, (C) that은 전치사 뒤에 쓸 수 없으며, (D) whose 뒤에는 명사가 바로 와야 한다.", "point": "전치사 + 관계대명사 — 뒤에 완전한 절"}, {"id": "U10-D14", "stem": "The warehouse _______ most of our orders are shipped will close for inventory during the first week of July.", "ch": ["from that", "whom", "from which", "which"], "a": 2, "ex": "해석  우리 주문 대부분이 발송되는 창고는 7월 첫째 주에 재고 조사를 위해 문을 닫을 것이다.\n해설  빈칸 뒤 most of our orders are shipped가 완전한 절이므로 <전치사 + 관계대명사> (C) from which가 정답이다(shipped from the warehouse). (A) that은 전치사 뒤에 쓸 수 없고, (B) whom은 사람 선행사에 쓰며, (D) which만 쓰면 관계절에 빈자리가 없다.", "point": "전치사 + 관계대명사 — 뒤에 완전한 절"}, {"id": "U10-D15", "stem": "Fenwick Bank has launched an online portal _______ customers can apply for a loan without visiting a branch.", "ch": ["which", "through that", "whom", "through which"], "a": 3, "ex": "해석  Fenwick Bank는 고객이 지점을 방문하지 않고도 대출을 신청할 수 있는 온라인 포털을 출시했다.\n해설  빈칸 뒤 customers can apply for a loan이 완전한 절이므로 <전치사 + 관계대명사> (D) through which가 정답이다(through the portal). (A) which만 쓰면 관계절에 빈자리가 없고, (B) that은 전치사 뒤에 올 수 없으며, (C) whom은 사람 선행사에 쓴다.", "point": "전치사 + 관계대명사 — 뒤에 완전한 절"}, {"id": "U10-D16", "stem": "The accounting software _______ the monthly reports are generated will be upgraded over the weekend.", "ch": ["with whom", "which", "with which", "with that"], "a": 2, "ex": "해석  월간 보고서를 만드는 데 쓰는 회계 소프트웨어가 주말 동안 업그레이드될 것이다.\n해설  빈칸 뒤 the monthly reports are generated가 완전한 절이므로 <전치사 + 관계대명사>가 필요하고, 선행사가 사물(software)이므로 (C) with which가 정답이다. (A) with whom은 사람 선행사에 쓰고, (B) which만 쓰면 관계절에 빈자리가 없으며, (D) that은 전치사 뒤에 올 수 없다.", "point": "전치사 + 관계대명사 — 사물 선행사 which"}, {"id": "U10-D17", "stem": "The committee members _______ the survey results were sent last week will discuss them at the next meeting.", "ch": ["to whom", "whom", "to that", "which"], "a": 0, "ex": "해석  지난주에 설문 결과를 받은 위원회 위원들은 다음 회의에서 그것을 논의할 것이다.\n해설  빈칸 뒤 the survey results were sent last week가 완전한 절이고 선행사가 사람(committee members)이므로 <전치사 + 목적격> (A) to whom이 정답이다(sent to the members). (B) whom만 쓰면 관계절에 빈자리가 없고, (C) that은 전치사 뒤에 쓸 수 없으며, (D) which는 사물 선행사에 쓴다.", "point": "전치사 + 관계대명사 — 사람 선행사 whom"}, {"id": "U10-D18", "stem": "Dr. Alvarado is the researcher _______ our laboratory has collaborated on several projects over the past five years.", "ch": ["whom", "with whom", "with which", "whose"], "a": 1, "ex": "해석  Alvarado 박사는 우리 연구소가 지난 5년 동안 여러 프로젝트에서 협업해 온 연구자이다.\n해설  빈칸 뒤 our laboratory has collaborated on several projects가 완전한 절이고 collaborate with의 전치사가 필요하며 선행사가 사람이므로 (B) with whom이 정답이다. (A) whom만 쓰면 with가 없어 틀리고, (C) with which는 사물 선행사에 쓰며, (D) whose 뒤에는 명사가 와야 한다.", "point": "전치사 + 관계대명사 — 사람 선행사 whom"}, {"id": "U10-D19", "stem": "The consultant _______ hired last spring has already reduced our monthly shipping costs by nearly twelve percent.", "ch": ["we", "who", "whom", "whose"], "a": 0, "ex": "해석  우리가 지난봄에 고용한 컨설턴트는 이미 월 배송비를 거의 12퍼센트 줄였다.\n해설  빈칸 뒤 동사 hired 앞에 주어가 없고 hired 뒤에 목적어도 없으므로, 목적격 관계대명사가 생략되고 관계절의 주어 (A) we가 바로 온 구조이다. (B) who를 넣으면 hired의 목적어가 없어 틀리고, (C) whom을 넣으면 관계절에 주어가 없으며, (D) whose 뒤에는 명사가 와야 한다.", "point": "목적격 관계대명사 생략 — 선행사 뒤에 주어가 바로 온다"}, {"id": "U10-D20", "stem": "Ms. Nakamura said that the software program _______ recommended at the workshop is now available at a discounted price.", "ch": ["which", "she", "whom", "whose"], "a": 1, "ex": "해석  Nakamura 씨는 자신이 워크숍에서 추천한 소프트웨어 프로그램을 지금 할인된 가격에 살 수 있다고 말했다.\n해설  빈칸 뒤 recommended 앞에 주어가 없고 뒤에 목적어도 없으므로, 목적격 관계대명사가 생략되고 관계절의 주어 (B) she가 바로 온 형태이다. (A) which를 넣으면 recommended의 목적어가 없어 틀리고, (C) whom은 사람 선행사에 쓰며 주어 역할도 못 하고, (D) whose 뒤에는 명사가 필요하다.", "point": "목적격 관계대명사 생략 — 선행사 뒤에 주어가 바로 온다"}, {"id": "U10-D21", "stem": "The interns were asked to present the marketing ideas _______ had put together during the two-week training session.", "ch": ["that", "which", "they", "whose"], "a": 2, "ex": "해석  인턴들은 2주간의 교육 기간 동안 자신들이 만든 마케팅 아이디어를 발표하라는 요청을 받았다.\n해설  빈칸 뒤 had put together 앞에 주어가 없고 뒤에 목적어도 없으므로, 목적격 관계대명사가 생략되고 주어 (C) they가 바로 온 구조이다(ideas [that] they had put together). (A) that과 (B) which를 넣으면 put together의 목적어가 없어 틀리고, (D) whose 뒤에는 명사가 와야 한다.", "point": "목적격 관계대명사 생략 — 선행사 뒤에 주어가 바로 온다"}, {"id": "U10-D22", "stem": "The quarterly figures _______ requested from the accounting department will be ready by Wednesday afternoon.", "ch": ["which", "whose", "whom", "you"], "a": 3, "ex": "해석  당신이 회계부에 요청한 분기 수치는 수요일 오후까지 준비될 것이다.\n해설  빈칸 뒤 requested 앞에 주어가 없고 뒤에 목적어도 없으므로, 목적격 관계대명사가 생략되고 관계절의 주어 (D) you가 바로 온 형태이다. (A) which를 넣으면 requested의 목적어가 없어 틀리고, (B) whose 뒤에는 명사가 와야 하며, (C) whom은 사람 선행사에 쓴다.", "point": "목적격 관계대명사 생략 — 선행사 뒤에 주어가 바로 온다"}, {"id": "U10-D23", "stem": "Mr. Castellanos will demonstrate the inventory management tool _______ designed for the retail division at the staff meeting.", "ch": ["he", "which", "that", "whose"], "a": 0, "ex": "해석  Castellanos 씨는 직원 회의에서 자신이 소매 부문을 위해 설계한 재고 관리 도구를 시연할 것이다.\n해설  빈칸 뒤 designed 앞에 주어가 없고 뒤에 목적어도 없으므로, 목적격 관계대명사가 생략되고 주어 (A) he가 바로 온 구조이다(the tool [which] he designed). (B) which와 (C) that을 넣으면 designed의 목적어가 없어 틀리고, (D) whose 뒤에는 명사가 필요하다.", "point": "목적격 관계대명사 생략 — 선행사 뒤에 주어가 바로 온다"}, {"id": "U10-D24", "stem": "The training materials _______ compiled for the new hires are stored in the shared folder on the company server.", "ch": ["which", "I", "whose", "whom"], "a": 1, "ex": "해석  내가 신입 사원을 위해 정리한 교육 자료는 회사 서버의 공유 폴더에 저장되어 있다.\n해설  빈칸 뒤 compiled 앞에 주어가 없고 뒤에 목적어도 없으므로, 목적격 관계대명사가 생략되고 관계절의 주어 (B) I가 바로 온 형태이다. (A) which를 넣으면 compiled의 목적어가 없어 틀리고, (C) whose 뒤에는 명사가 와야 하며, (D) whom은 사람 선행사에 쓴다.", "point": "목적격 관계대명사 생략 — 선행사 뒤에 주어가 바로 온다"}, {"id": "U10-D25", "stem": "We are looking for a technician who _______ experience with industrial refrigeration units and a valid driver's license.", "ch": ["has", "have", "having", "to have"], "a": 0, "ex": "해석  우리는 산업용 냉동 장치 경험과 유효한 운전면허가 있는 기술자를 찾고 있다.\n해설  주격 관계대명사 who 뒤의 동사 자리이며, 관계절 동사의 수는 선행사에 맞춘다. 선행사 a technician이 단수이므로 (A) has가 정답이다. (B) have는 복수 선행사에 쓰고, (C) having과 (D) to have는 본동사 자리에 올 수 없다.", "point": "주격 관계대명사 뒤 동사 — 선행사와 수 일치(단수)"}, {"id": "U10-D26", "stem": "Applicants who _______ completed the online safety course will be contacted for an interview within ten business days.", "ch": ["has", "having", "have", "to have"], "a": 2, "ex": "해석  온라인 안전 교육을 이수한 지원자들은 영업일 기준 10일 이내에 면접 연락을 받을 것이다.\n해설  주격 관계대명사 who 뒤의 동사 자리이며 선행사 Applicants가 복수이므로 (C) have가 정답이다. (A) has는 단수 선행사에 쓰고, (B) having과 (D) to have는 본동사가 될 수 없다.", "point": "주격 관계대명사 뒤 동사 — 선행사와 수 일치(복수)"}, {"id": "U10-D27", "stem": "The keynote speaker who _______ scheduled to open the conference last Tuesday canceled because of a family emergency.", "ch": ["were", "being", "be", "was"], "a": 3, "ex": "해석  지난 화요일 콘퍼런스 개회를 맡기로 예정되어 있던 기조연설자가 가족의 급한 일로 취소했다.\n해설  주격 관계대명사 who 뒤의 동사 자리이며 선행사 The keynote speaker가 단수이고 last Tuesday라는 과거 시점이 있으므로 (D) was가 정답이다. (A) were는 복수 선행사에 쓰고, (B) being과 (C) be는 단독으로 본동사가 될 수 없다.", "point": "주격 관계대명사 뒤 동사 — 선행사와 수 일치(단수)"}, {"id": "U10-D28", "stem": "The three vendors that _______ chosen for the food festival last year have all been invited to participate again.", "ch": ["was", "being", "to be", "were"], "a": 3, "ex": "해석  지난해 음식 축제에 선정되었던 세 업체가 모두 다시 참가하도록 초대받았다.\n해설  주격 관계대명사 that 뒤의 동사 자리이며 선행사 The three vendors가 복수이고 last year라는 과거 시점이 있으므로 (D) were가 정답이다. (A) was는 단수 선행사에 쓰고, (B) being과 (C) to be는 본동사 역할을 할 e new conference room at Halvorsen Consulting is as _______ as the main auditorium on the third floor.", "ch": ["spacious", "spaciously", "spaciousness", "more spacious"], "a": 0, "ex": "해석  핼보슨 컨설팅의 새 회의실은 3층의 대강당만큼 넓다.\n해설  as ~ as 원급 비교이고 빈칸은 be동사 is 뒤 주격 보어 자리이므로 형용사 원급 (A) spacious가 정답이다. (B)는 부사, (C)는 명사이며, (D) more spacious는 비교급이라 as ~ as 사이에 올 수 없다.", "point": "as + 형용사 원급 + as (be동사 뒤 보어)"}, {"id": "U11-D02", "stem": "Mr. Delacroix has handled the merger negotiations as _______ as anyone on the legal team could have expected.", "ch": ["skillful", "skillfully", "skill", "skillfulness"], "a": 1, "ex": "해석  델라크루아 씨는 법무팀의 누구라도 기대했을 만큼 능숙하게 합병 협상을 처리해 왔다.\n해설  as와 as 사이를 지우고 읽으면 has handled the merger negotiations라는 완전한 문장이 남으므로 빈칸은 동사 handled를 수식하는 부사 자리다. 따라서 (B) skillfully가 정답이다. (A)는 형용사라 동사를 꾸밀 수 없고, (C)·(D)는 명사다.", "point": "as + 부사 원급 + as (일반동사 수식)"}, {"id": "U11-D03", "stem": "The redesigned Pelham 200 vacuum cleaner is _______ than the model it replaced, according to the laboratory tests.", "ch": ["quiet", "quietly", "quieter", "quietest"], "a": 2, "ex": "해석  실험실 테스트에 따르면 새로 설계된 펠럼 200 진공청소기는 이전 모델보다 더 조용하다.\n해설  빈칸 뒤에 than이 있으므로 비교급이 필요하고, be동사 is 뒤 보어 자리이므로 형용사의 비교급 (C) quieter가 정답이다. (A)는 원급, (D)는 최상급이라 than과 함께 쓸 수 없고, (B)는 부사다.", "point": "비교급 + than (형용사)"}, {"id": "U11-D04", "stem": "Wexford Tower is the _______ office building in the city's financial district, with fifty-two floors.", "ch": ["tall", "taller", "tallness", "tallest"], "a": 3, "ex": "해석  웩스포드 타워는 52층으로 시 금융가에서 가장 높은 사무용 건물이다.\n해설  앞에 정관사 the가 있고 뒤에 in the city's financial district라는 범위가 있으므로 최상급 (D) tallest가 정답이다. (B) taller는 than과 함께 쓰는 비교급이고, (A) 원급은 in 범위 앞의 최상급 자리에 맞지 않으며, (C)는 명사다.", "point": "the + 최상급 + in + 범위"}, {"id": "U11-D05", "stem": "Please return the signed contract to Ms. Yamashita as soon as _______ so that the project can begin on schedule.", "ch": ["possible", "possibly", "possibility", "can"], "a": 0, "ex": "해석  프로젝트가 일정대로 시작될 수 있도록 서명한 계약서를 가능한 한 빨리 야마시타 씨에게 돌려보내 주십시오.\n해설  as soon as _______ 는 '가능한 한 빨리'라는 뜻의 관용 표현 as soon as possible이므로 (A) possible이 정답이다. (D) can을 쓰려면 as soon as you can처럼 주어가 필요하고, (B)는 부사, (C)는 명사라 이 자리에 올 수 없다.", "point": "as + 원급 + as possible"}, {"id": "U11-D06", "stem": "The Kestrel 5 laptop is _______ lighter than its predecessor, making it ideal for frequent travelers.", "ch": ["very", "far", "so", "too"], "a": 1, "ex": "해석  케스트렐 5 노트북은 이전 모델보다 훨씬 가벼워서 자주 출장을 다니는 사람에게 이상적이다.\n해설  빈칸은 비교급 lighter를 강조하는 자리이므로 '훨씬'이라는 뜻의 (B) far가 정답이다. (A) very, (C) so, (D) too는 원급만 수식할 수 있고 비교급 앞에는 쓸 수 없다.", "point": "비교급 강조 부사 (very 함정)"}, {"id": "U11-D07", "stem": "Guests who wish to attend the gala dinner must confirm their reservations no _______ than Friday, 12 June.", "ch": ["longer", "less", "later", "more"], "a": 2, "ex": "해석  갈라 디너에 참석하고자 하는 손님은 늦어도 6월 12일 금요일까지 예약을 확정해야 한다.\n해설  no _______ than 뒤에 날짜가 오므로 '늦어도 ~까지'라는 뜻의 관용 표현 no later than이 알맞아 (C) later가 정답이다. (A) no longer는 '더 이상 ~ 아닌'이라는 뜻이고, (B)·(D)는 수량과 함께 쓰는 표현이라 날짜와 어울리지 않는다.", "point": "no later than (늦어도 ~까지)"}, {"id": "U11-D08", "stem": "Vantera Foods hired as _______ seasonal workers as it did last summer to keep up with holiday orders.", "ch": ["much", "more", "most", "many"], "a": 3, "ex": "해석  밴테라 푸드는 연휴 주문을 감당하기 위해 지난여름만큼 많은 계절 근로자를 고용했다.\n해설  as ~ as 원급 비교이고 빈칸 뒤에 복수명사 workers가 있으므로 (D) many가 정답이다. (A) much는 불가산명사 앞에 쓰며, (B)·(C)는 비교급·최상급이라 as ~ as 사이에 올 수 없다.", "point": "as many + 복수명사 + as"}, {"id": "U11-D09", "stem": "Since the software upgrade, the Marbury call center has been processing refund requests _______ than before.", "ch": ["faster", "fast", "fastest", "fastness"], "a": 0, "ex": "해석  소프트웨어 업그레이드 이후 마베리 콜센터는 이전보다 더 빠르게 환불 요청을 처리하고 있다.\n해설  빈칸 뒤에 than이 있으므로 비교급이 필요하고, 동사 has been processing을 수식하므로 부사의 비교급 (A) faster가 정답이다. (B)는 원급, (C)는 최상급이라 than과 어울리지 않고, (D)는 명사다.", "point": "비교급 + than (부사)"}, {"id": "U11-D10", "stem": "Of all the applicants interviewed last week, Mr. Faraday was the most _______ about the company's history.", "ch": ["knowledge", "knowledgeable", "knowledgeably", "knew"], "a": 1, "ex": "해석  지난주에 면접을 본 모든 지원자 중에서 패러데이 씨가 회사 역사에 대해 가장 잘 알고 있었다.\n해설  Of all the applicants라는 범위와 the most가 있는 최상급 구문이며, be동사 was 뒤 보어 자리이므로 형용사 (B) knowledgeable이 정답이다. (A)는 명사, (C)는 부사, (D)는 동사의 과거형이라 the most 뒤 보어 자리에 올 수 없다.", "point": "the + 최상급 + of + 복수명사"}, {"id": "U11-D11", "stem": "According to the survey, Brightline's customer support staff are not as _______ as those of its main rival.", "ch": ["help", "helpfully", "helpful", "helpfulness"], "a": 2, "ex": "해석  설문조사에 따르면 브라이트라인의 고객 지원 직원들은 주요 경쟁사 직원들만큼 도움이 되지 않는다.\n해설  not as ~ as 원급 비교이고 빈칸은 be동사 are 뒤 주격 보어 자리이므로 형용사 (C) helpful이 정답이다. (A)·(D)는 명사, (B)는 부사라 보어 자리에 올 수 없다.", "point": "as + 형용사 원급 + as (be동사 뒤 보어)"}, {"id": "U11-D12", "stem": "The Orion Fund's third-quarter return was the _______ result that the investment firm has ever recorded.", "ch": ["impressive", "impressively", "more impressive", "most impressive"], "a": 3, "ex": "해석  오리온 펀드의 3분기 수익률은 그 투자회사가 지금까지 기록한 것 중 가장 인상적인 결과였다.\n해설  the _______ result that ~ has ever recorded는 '~가 지금까지 …한 것 중 가장 ~한'이라는 최상급 구문이므로 (D) most impressive가 정답이다. (C) more impressive는 than과 함께 쓰는 비교급이고, (A) 원급은 ever와 어울리는 최상급을 만들지 못하며, (B)는 부사라 명사 result를 꾸밀 수 없다.", "point": "the + 최상급 + that + 주어 + have ever p.p."}, {"id": "U11-D13", "stem": "Technicians at Ridgeway Electric repaired the damaged transformer as quickly as they _______ after the storm.", "ch": ["could", "possible", "possibly", "able"], "a": 0, "ex": "해석  리지웨이 일렉트릭의 기술자들은 폭풍 후 손상된 변압기를 가능한 한 빨리 수리했다.\n해설  as quickly as they _______ 는 '가능한 한 빨리'라는 뜻의 as + 원급 + as + 주어 + can 구문이며, 주절 동사 repaired가 과거이므로 (A) could가 정답이다. (B) possible은 주어 없이 as quickly as possible로 써야 하고, (C)·(D)는 주어 they 뒤에 동사 없이 올 수 없다.", "point": "as + 원급 + as + 주어 + can"}, {"id": "U11-D14", "stem": "The Aldon Street parking garage is _______ than the one on Bexley Avenue, but it closes earlier.", "ch": ["cheap", "cheaper", "cheapest", "cheaply"], "a": 1, "ex": "해석  앨던 스트리트 주차장은 벡슬리 애비뉴의 주차장보다 저렴하지만 더 일찍 문을 닫는다.\n해설  빈칸 뒤에 than이 보이므로 무조건 비교급이 와야 하며, be동사 is 뒤 보어 자리이므로 (B) cheaper가 정답이다. (C) cheapest는 in/of 범위와 함께 쓰는 최상급이고, (A)는 원급, (D)는 부사다.", "point": "형태 판별: than → 비교급"}, {"id": "U11-D15", "stem": "Granville Logistics has become one of the most _______ freight carriers in the northern provinces.", "ch": ["dependability", "depend", "dependable", "dependably"], "a": 2, "ex": "해석  그랜빌 로지스틱스는 북부 지방에서 가장 믿을 만한 화물 운송업체 중 하나가 되었다.\n해설  one of the most _______ + 복수명사(freight carriers)는 '가장 ~한 것들 중 하나'라는 최상급 구문이고, 빈칸은 명사를 꾸미는 형용사 자리이므로 (C) dependable이 정답이다. (A)는 명사, (B)는 동사, (D)는 부사라 명사 carriers를 꾸밀 수 없다.", "point": "one of the + 최상급 + 복수명사"}, {"id": "U11-D16", "stem": "Because of the merger, Pinecrest Bank will _______ longer offer free checking accounts to new customers.", "ch": ["not", "never", "none", "no"], "a": 3, "ex": "해석  합병으로 인해 파인크레스트 은행은 신규 고객에게 더 이상 무료 당좌예금 계좌를 제공하지 않을 것이다.\n해설  _______ longer는 '더 이상 ~ 아닌'이라는 뜻의 관용 표현 no longer이므로 (D) no가 정답이다. (A) not, (B) never, (C) none은 longer와 결합해 이 뜻을 만들지 못한다.", "point": "no longer (더 이상 ~ 아닌)"}, {"id": "U11-D17", "stem": "The Marlowe Hotel staff cleaned the banquet hall as _______ as they did after last year's awards ceremony.", "ch": ["thoroughly", "thorough", "thoroughness", "more thoroughly"], "a": 0, "ex": "해석  말로 호텔 직원들은 지난해 시상식 후에 그랬던 것만큼 철저하게 연회장을 청소했다.\n해설  as와 as 사이를 지우면 cleaned the banquet hall이라는 완전한 문장이 남으므로 빈칸은 동사 cleaned를 수식하는 부사 자리이며, (A) thoroughly가 정답이다. (B)는 형용사, (C)는 명사이고, (D) more thoroughly는 비교급이라 as ~ as 사이에 쓸 수 없다.", "point": "as + 부사 원급 + as (일반동사 수식)"}, {"id": "U11-D18", "stem": "Ms. Lindqvist is widely regarded as the most _______ negotiator in the entire purchasing department.", "ch": ["experience", "experienced", "experiencing", "experiences"], "a": 1, "ex": "해석  린드크비스트 씨는 구매 부서 전체에서 가장 경험이 많은 협상가로 널리 여겨진다.\n해설  the most _______ negotiator in the entire purchasing department는 '~에서 가장 …한'이라는 최상급 구문이고, 빈칸은 명사 negotiator를 꾸미는 형용사 자리이므로 (B) experienced가 정답이다. (A)·(D)는 명사, (C)는 현재분사로 '경험하고 있는'이라는 뜻이 되어 어색하다.", "point": "the + 최상급 + in + 범위"}, {"id": "U11-D19", "stem": "The Greenfield branch did not generate as _______ revenue as the downtown location during the first quarter.", "ch": ["many", "more", "much", "most"], "a": 2, "ex": "해석  그린필드 지점은 1분기 동안 도심 지점만큼 많은 수익을 내지 못했다.\n해설  as ~ as 원급 비교이고 빈칸 뒤에 불가산명사 revenue가 있으므로 (C) much가 정답이다. (A) many는 복수명사 앞에 쓰며, (B)·(D)는 비교급·최상급이라 as ~ as 사이에 올 수 없다.", "point": "as much + 불가산명사 + as"}, {"id": "U11-D20", "stem": "Although both candidates were qualified, Ms. Brennan's presentation was _______ more persuasive than Mr. Holt's.", "ch": ["very", "ever", "so", "even"], "a": 3, "ex": "해석  두 후보 모두 자격을 갖추었지만, 브레넌 씨의 발표는 홀트 씨의 발표보다 훨씬 더 설득력이 있었다.\n해설  빈칸은 비교급 more persuasive를 강조하는 자리이므로 '훨씬'이라는 뜻의 (D) even이 정답이다. (A) very와 (C) so는 원급만 수식하고, (B) ever는 최상급이나 완료 시제와 함께 쓴다.", "point": "비교급 강조 부사 (very 함정)"}, {"id": "U11-D21", "stem": "Shipping costs for international orders are _______ than those for domestic deliveries because of customs fees.", "ch": ["higher", "high", "highest", "highly"], "a": 0, "ex": "해석  관세 때문에 국제 주문의 배송비는 국내 배송비보다 더 높다.\n해설  빈칸 뒤에 than이 있으므로 비교급이 필요하며, be동사 are 뒤 보어 자리이므로 형용사의 비교급 (A) higher가 정답이다. (B)는 원급, (C)는 최상급이라 than과 쓸 수 없고, (D)는 부사다.", "point": "비교급 + than (형용사)"}, {"id": "U11-D22", "stem": "All visitors to the Danforth manufacturing plant must be accompanied by at _______ one authorized employee.", "ch": ["less", "least", "little", "lesser"], "a": 1, "ex": "해석  댄포스 제조 공장의 모든 방문객은 적어도 한 명의 승인된 직원과 동행해야 한다.\n해설  at _______ one은 '적어도 한 명'이라는 뜻의 최상급 관용 표현 at least이므로 (B) least가 정답이다. (A) less는 less than처럼 비교급으로 쓰며, (C)·(D)는 at과 결합해 이런 뜻을 만들지 못한다.", "point": "at least (적어도)"}, {"id": "U11-D23", "stem": "Of all the sales representatives at Corvid Pharmaceuticals, Mr. Nakamura travels the _______ frequently.", "ch": ["more", "much", "most", "mostly"], "a": 2, "ex": "해석  코비드 제약의 모든 영업 담당자 중에서 나카무라 씨가 가장 자주 출장을 다닌다.\n해설  Of all the sales representatives라는 범위가 있고 정관사 the가 있으므로 부사 frequently의 최상급 the most frequently가 알맞아 (C) most가 정답이다. (A) more는 than과 함께 쓰는 비교급이고, (B) much와 (D) mostly는 부사 frequently 앞에 놓여 최상급을 만들 수 없다.", "point": "부사의 최상급"}, {"id": "U11-D24", "stem": "The updated version of the Nordquist accounting software is just as _______ as the original release.", "ch": ["rely", "reliably", "reliability", "reliable"], "a": 3, "ex": "해석  노드퀴스트 회계 소프트웨어의 업데이트 버전은 최초 출시 버전만큼 신뢰할 수 있다.\n해설  as ~ as 원급 비교이고 빈칸은 be동사 is 뒤 주격 보어 자리이므로 형용사 (D) reliable이 정답이다. (A)는 동사, (B)는 부사, (C)는 명사라 보어 자리에 올 수 없다.", "point": "as + 형용사 원급 + as (be동사 뒤 보어)"}, {"id": "U11-D25", "stem": "Employees who attended the training session completed the safety checklist more _______ than those who did not.", "ch": ["consistently", "consistent", "consistency", "consistencies"], "a": 0, "ex": "해석  교육 세션에 참석한 직원들은 참석하지 않은 직원들보다 안전 점검표를 더 일관되게 작성했다.\n해설  more _______ than은 비교급 구문이며, 빈칸은 동사 completed를 수식하는 부사 자리이므로 (A) consistently가 정답이다. (B)는 형용사라 동사를 꾸밀 수 없고, (C)·(D)는 명사다.", "point": "비교급 + than (부사)"}, {"id": "U11-D26", "stem": "The Zephyr X1 is the _______ of the four printers that the procurement team tested this month.", "ch": ["durable", "most durable", "more durable", "durably"], "a": 1, "ex": "해석  제퍼 X1은 조달팀이 이번 달에 테스트한 네 대의 프린터 중 가장 내구성이 좋다.\n해설  the _______ of the four printers는 '~ 중에서 가장 …한'이라는 최상급 구문이므로 (B) most durable이 정답이다. (C) more durable은 than과 함께 쓰는 비교급이고, (A)는 원급, (D)는 부사라 정관사 the 뒤 보어 자리에 맞지 않는다.", "point": "the + 최상급 + of + 복수명사"}, {"id": "U11-D27", "stem": "To avoid delays at customs, exporters should complete the declaration forms as _______ as possible.", "ch": ["accurate", "accuracy", "accurately", "most accurately"], "a": 2, "ex": "해석  세관에서의 지연을 피하려면 수출업자는 신고서를 가능한 한 정확하게 작성해야 한다.\n해설  as ~ as possible은 '가능한 한 ~하게'라는 관용 표현이며, 빈칸은 동사 complete를 수식하는 부사 자리이므로 (C) accurately가 정답이다. (A)는 형용사, (B)는 명사이고, (D)는 최상급이라 as ~ as 사이에 올 수 없다.", "point": "as + 원급 + as possible (부사)"}, {"id": "U11-D28", "stem": "Candidates with _______ than two years of accounting experience are not eligible for the senior auditor position at Solvane Financial.", "ch": ["least", "little", "lesser", "less"], "a": 3, "ex": "해석  회계 경력이 2년 미만인 지원자는 솔베인 파이낸셜의 선임 감사 직책에 지원할 자격이 없다.\n해설  _______ than two years는 '2년 미만'이라는 뜻의 비교급 관용 표현 less than이므로 (D) less가 정답이다. (A) least는 최상급이라 than과 쓸 수 없고, (B) little은 원급, (C) lesser는 명사 앞에서만 쓰는 형용사다.", "point": "less than (~ 미만)"}, {"id": "U11-D29", "stem": "The Bluewater Resort has the _______ swimming pool in the region, measuring nearly sixty meters in length.", "ch": ["largest", "larger", "largely", "largeness"], "a": 0, "ex": "해석  블루워터 리조트에는 길이가 거의 60미터에 달하는, 이 지역에서 가장 큰 수영장이 있다.\n해설  정관사 the와 범위를 나타내는 in the region이 있으므로 최상급 (A) largest가 정답이다. (B) larger는 than과 함께 쓰는 비교급이고, (C)는 부사, (D)는 명사라 명사 swimming pool을 꾸밀 수 없다.", "point": "the + 최상급 + in + 범위"}, {"id": "U11-D30", "stem": "Attendance at this year's Crestwood Trade Expo was _______ higher than organizers had predicted.", "ch": ["significant", "significantly", "significance", "signify"], "a": 1, "ex": "해석  올해 크레스트우드 무역 박람회의 참석자 수는 주최 측이 예상했던 것보다 훨씬 더 많았다.\n해설  빈칸은 비교급 higher를 강조하는 자리이므로 '상당히, 훨씬'이라는 뜻의 부사 (B) significantly가 정답이다. (A)는 형용사, (C)는 명사, (D)는 동사라 비교급을 수식할 수 없다.", "point": "비교급 강조 부사 (품사 판별)"}, {"id": "U11-D31", "stem": "All part-time employees at Coralux Designs receive the _______ hourly rate as their full-time colleagues.", "ch": ["similar", "equal", "same", "like"], "a": 2, "ex": "해석  코럴럭스 디자인의 모든 시간제 직원은 정규직 동료와 같은 시급을 받는다.\n해설  the _______ hourly rate as는 '~와 같은 …'이라는 뜻의 원급 관용 표현 the same + 명사 + as이므로 (C) same이 정답이다. (A) similar와 (B) equal은 as가 아니라 to와 함께 쓰며, (D) like는 the와 명사 사이에서 as와 짝을 이루지 못한다.", "point": "the same + 명사 + as"}, {"id": "U11-D32", "stem": "Reviewers agree that the Sable 7 is the _______ smartphone that Tessara Electronics has ever produced.", "ch": ["thin", "thinly", "thinner", "thinnest"], "a": 3, "ex": "해석  평론가들은 세이블 7이 테사라 일렉트로닉스가 지금까지 생산한 것 중 가장 얇은 스마트폰이라는 데 동의한다.\n해설  the _______ smartphone that ~ has ever produced는 '지금까지 …한 것 중 가장 ~한'이라는 최상급 구문이므로 (D) thinnest가 정답이다. (C) thinner는 than과 쓰는 비교급이고, (A) 원급은 ever와 어울리는 최상급을 만들지 못하며, (B)는 부사라 명사 smartphone을 꾸밀 수 없다.", "point": "the + 최상급 + that + 주어 + have ever p.p."}, {"id": "U11-D33", "stem": "The Sandoval Group's new accountant works as _______ as her predecessor did, despite having joined only last month.", "ch": ["efficiently", "efficient", "efficiency", "more efficiently"], "a": 0, "ex": "해석  샌도벌 그룹의 새 회계사는 지난달에 막 입사했는데도 전임자만큼 효율적으로 일한다.\n해설  as와 as 사이를 지우면 works라는 일반동사만 남으므로 빈칸은 동사 works를 수식하는 부사 자리이며, (A) efficiently가 정답이다. (B)는 형용사, (C)는 명사이고, (D) more efficiently는 비교급이라 as ~ as 사이에 쓸 수 없다.", "point": "as + 부사 원급 + as (일반동사 수식)"}, {"id": "U11-D34", "stem": "The revised benefits package from Lorimer Tech is more _______ to recent graduates than the previous one was.", "ch": ["appeal", "appealing", "appealingly", "appeals"], "a": 1, "ex": "해석  로리머 테크의 개정된 복리후생 패키지는 이전 것보다 최근 졸업생들에게 더 매력적이다.\n해설  more _______ than은 비교급 구문이며, 빈칸은 be동사 is 뒤 주격 보어 자리이므로 형용사 (B) appealing이 정답이다. (A)·(D)는 명사나 동사 형태, (C)는 부사라 보어 자리에 올 수 없다.", "point": "비교급 + than (형용사)"}, {"id": "U11-D35", "stem": "Sales of the Nimbus tablet were _______ during the holiday season than at any other time of the year.", "ch": ["strong", "strongest", "stronger", "strongly"], "a": 2, "ex": "해석  님버스 태블릿의 판매량은 연중 다른 어느 때보다 연휴 기간에 더 높았다.\n해설  문장 뒤쪽에 than이 보이므로 무조건 비교급이 와야 하며, be동사 were 뒤 보어 자리이므로 (C) stronger가 정답이다. (B) strongest는 in/of 범위와 함께 쓰는 최상급이고, (A)는 원급, (D)는 부사다.", "point": "형태 판별: than → 비교급"}, {"id": "U11-D36", "stem": "Among the five regional managers, Ms. Achebe received the _______ customer satisfaction ratings this year.", "ch": ["good", "well", "better", "best"], "a": 3, "ex": "해석  다섯 명의 지역 관리자 중에서 아체베 씨가 올해 가장 좋은 고객 만족도 평가를 받았다.\n해설  Among the five regional managers라는 범위와 정관사 the가 있으므로 최상급 (D) best가 정답이다. (C) better는 than과 함께 쓰는 비교급이고, (A) 원급은 among 범위의 최상급 자리에 맞지 않으며, (B)는 부사라 명사를 꾸밀 수 없다.", "point": "the + 최상급 + among + 복수명사"}, {"id" const fmtDur = sec => { const m = Math.round(sec / 60); return m < 1 ? '1분 미만' : `${m}분`; };
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;'}[c]));
const shuffle = a => { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.random() * (i + 1) | 0; [a[i], a[j]] = [a[j], a[i]]; } return a; };
const cleanName = s => s.replace(/\s+/g, ' ').trim();
const DEVICE = (() => { let d = store.get('device', ''); if (!d) { d = (crypto.randomUUID ? crypto.randomUUID() : Date.now() + '-' + Math.random()).slice(0, 8); store.set('device', d); } return d; })();
let drill = store.get('drill', {});     // {U01: {seen: [id…], pass: n, tries: n}} — 단원별로 이미 나온 문항(재시험 제외용)·합격 횟수
let dlog = store.get('drillLog', []);   // 회차 기록 {at, unit, pass, correct, tries}
let selU = null, cur = null;

function report(event, extra) {
  if (!D.reportUrl) return;
  try {
    const body = JSON.stringify(Object.assign({event, device: DEVICE, app: D.title, time: fmtTime(new Date()), ua: navigator.userAgent.slice(0, 120)}, extra || {}));
    fetch(D.reportUrl, {method: 'POST', mode: 'no-cors', keepalive: true, headers: {'Content-Type': 'text/plain;charset=utf-8'}, body});
  } catch (e) {}
}
async function gate(name, range) {     // 세트 연습 앱과 같은 시작 판정(이름·기기ID 짝, apps_script checkDevice)
  if (!D.reportUrl) return {allow: true};
  const ctl = new AbortController(), t = setTimeout(() => ctl.abort(), 20000);
  try {
    const r = await fetch(D.reportUrl, {method: 'POST', signal: ctl.signal, headers: {'Content-Type': 'text/plain;charset=utf-8'},
      body: JSON.stringify({event: 'start', name, range, device: DEVICE, app: D.title, time: fmtTime(new Date()), ua: navigator.userAgent.slice(0, 120)})});
    const txt = await r.text();
    try { const j = JSON.parse(txt); return typeof j.allow === 'boolean' ? j : {allow: true}; } catch (e) { return {allow: true, legacy: true}; }
  } catch (e) { return {allow: false, offline: true}; }
  finally { clearTimeout(t); }
}
const certCode = s => { let h = 5381; for (const c of s + '|' + D.salt) h = ((h << 5) + h + c.charCodeAt(0)) >>> 0; return h.toString(36).padStart(7, '0').slice(-8); };

// ---- 홈 ----
const uState = u => drill[u.id] || (drill[u.id] = {seen: [], pass: 0, tries: 0});
function renderHome() {
  const box = $('#units'); box.innerHTML = '';
  D.units.forEach(u => {
    const s = uState(u), left = u.items.length - s.seen.length;
    const b = document.createElement('button');
    b.innerHTML = `${esc(u.name)}<span class="n">새 문제 ${left}/${u.items.length}${s.pass ? ` · 합격 ${s.pass}회` : ''}</span>`;
    if (s.pass) b.classList.add('done');
    if (selU === u.id) b.classList.add('on');
    b.onclick = () => { selU = selU === u.id ? null : u.id; renderHome(); };
    box.appendChild(b);
  });
  const passed = D.units.filter(u => uState(u).pass).length;
  $('#unitStat').textContent = `합격 ${passed} / ${D.units.length}단원`;
  $('#go').disabled = !selU;
  $('#go').textContent = selU ? `${D.units.find(u => u.id === selU).name} 시험 시작 (${PER}문제)` : `시험 시작 (${PER}문제)`;
  const lg = $('#myLog');
  lg.innerHTML = dlog.length ? `<b>내 기록</b><div class="log" style="margin-top:8px">${dlog.slice(-10).reverse().map(r =>
    `<div>${esc(r.at)} · ${esc(r.unit)} · ${r.tries}회차 · <span class="${r.pass ? 'ok' : 'ng'}">${r.pass ? '합격' : `불합격 (${r.correct}/${PER})`}</span></div>`).join('')}</div>` : '<b>내 기록</b><div class="muted" style="margin-top:6px">아직 없음</div>';
}
$('#go').onclick = () => {
  if (!nameOk() || !selU) return;
  if (!store.get('consent', '')) { $('#consentCard').hidden = false; $('#consentCard').scrollIntoView({behavior: 'smooth'}); return; }
  start();
};
function nameOk() {
  const name = cleanName($('#name').value);
  if (!name) { $('#msg').textContent = '이름을 입력하세요.'; $('#name').focus(); return false; }
  store.set('name', name); $('#msg').textContent = ''; return true;
}
$('#consentOk').onclick = () => { if (!nameOk()) { $('#consentCard').hidden = true; return; } store.set('consent', fmtTime(new Date())); $('#consentCard').hidden = true; report('consent', {name: store.get('name', '')}); start(); };
$('#consentNo').onclick = () => { $('#consentCard').hidden = true; $('#msg').textContent = '동의하지 않으면 이 앱을 이용할 수 없습니다.'; };

// ---- 출제: 이 단원에서 아직 안 나온 문항만, 정답 문자가 한쪽에 몰리지 않게(문자당 최대 2개) ----
function makeRound(u) {
  const s = uState(u);
  let pool = u.items.filter(it => !s.seen.includes(it.id));
  let reset = false;
  if (pool.length < PER) { s.seen = []; pool = u.items.slice(); reset = true; }   // 은행을 다 돌았으면 처음부터
  const picked = [], cnt = [0, 0, 0, 0, 0];
  for (const it of shuffle(pool)) { if (picked.length >= PER) break; if (cnt[it.a] < 2) { picked.push(it); cnt[it.a]++; } }
  for (const it of shuffle(pool)) { if (picked.length >= PER) break; if (!picked.includes(it)) picked.push(it); }
  return {qs: picked, reset};
}
async function start() {
  if (!nameOk() || !selU) return;
  const u = D.units.find(x => x.id === selU), name = store.get('name', '');
  $('#go').disabled = true; $('#msg').textContent = '시작 확인 중…';
  const g = await gate(name, u.name + ' 변형문제');
  $('#go').disabled = false;
  if (!g.allow) { $('#msg').textContent = g.offline ? '서버에 연결하지 못했습니다. 통신 상태를 확인한 뒤 다시 시도하세요.' : (g.msg || '이 기기에서는 시작할 수 없습니다. 선생님께 문의하세요.'); return; }
  $('#msg').textContent = '';
  cur = {u, name, tries: 0};
  $('#home').hidden = true; $('#test').hidden = false; $('#who').textContent = name + ' 학생';
  newRound();
}
function newRound() {
  const {qs, reset} = makeRound(cur.u);
  const s = uState(cur.u); s.tries++; store.set('drill', drill);
  cur.qs = qs; cur.tries = s.tries; cur.t0 = Date.now(); cur.ansd = qs.map(() => null);
  $('#tNo').textContent = cur.u.name + ' 변형문제';
  $('#tTry').textContent = `${s.tries}회차 · ${PER}문제 · 모두 맞아야 합격` + (reset ? ' · 새 문제를 다 풀어 처음부터 다시 냅니다' : '');
  $('#result').hidden = true; $('#certBox').hidden = true; $('#retry').hidden = true; $('#submit').hidden = false;
  const box = $('#qs'); box.innerHTML = '';
  qs.forEach((it, qi) => {
    const c = document.createElement('div'); c.className = 'card q';
    c.innerHTML = `<h3><span class="pill">${qi + 1}</span><span class="mark"></span></h3>
      <div class="stem">${esc(it.stem).replace(/_{5,}/g, m => `<b>${m}</b>`)}</div>
      <div class="opts">${it.ch.map((o, i) => `<label class="opt en"><input type="radio" name="q${qi}" value="${i}"><span>${LAB(i)}${esc(o)}</span></label>`).join('')}</div>`;
    c.querySelectorAll('input').forEach(inp => inp.onchange = () => {
      cur.ansd[qi] = +inp.value;
      c.querySelectorAll('.opt').forEach(l => l.classList.toggle('sel', l.contains(inp)));
      updateSubmit();
    });
    box.appendChild(c);
  });
  updateSubmit(); window.scrollTo(0, 0);
}
function updateSubmit() {
  const done = cur.ansd.filter(x => x !== null).length;
  $('#submit').disabled = done < PER; $('#submit').textContent = done < PER ? `채점하기 (${done}/${PER} 답함)` : '채점하기';
}
$('#submit').onclick = () => {
  const cards = [...$('#qs').children], s = uState(cur.u); let correct = 0; const wrong = [];
  cur.qs.forEach((it, qi) => {
    const v = cur.ansd[qi], ok = v === it.a, c = cards[qi];
    if (ok) correct++; else wrong.push(`${it.id} 내 답 ${LAB(v).trim()} / 정답 ${LAB(it.a).trim()}`);
    c.querySelectorAll('input').forEach(i => i.disabled = true);
    c.querySelectorAll('.opt').forEach((l, li) => { l.classList.remove('sel'); if (li === it.a) l.classList.add('right'); else if (li === v) l.classList.add('wrong'); });
    const m = c.querySelector('.mark'); m.textContent = ok ? '정답' : '오답'; m.className = 'mark ' + (ok ? 'o' : 'x');
    c.insertAdjacentHTML('beforeend', `<div class="ex">${it.point ? `[${esc(it.point)}]\n` : ''}${esc(it.ex)}</div>`);
    if (!s.seen.includes(it.id)) s.seen.push(it.id);          // 이번 회차 문항은 다음 재시험에서 제외
  });
  const pass = correct === PER, at = fmtTime(new Date()), sec = Math.min(3600, Math.round((Date.now() - cur.t0) / 1000));
  if (pass) s.pass++;
  store.set('drill', drill);
  dlog.push({at, unit: cur.u.name, pass, correct, tries: cur.tries}); if (dlog.length > 60) dlog = dlog.slice(-60); store.set('drillLog', dlog);
  const r = $('#result'); r.hidden = false; r.className = 'card banner ' + (pass ? 'pass' : 'fail');
  r.innerHTML = pass
    ? `<div class="big">합격</div><div>${cur.u.name} · ${PER}문제 모두 정답 · ${cur.tries}회차</div>`
    : `<div class="big">불합격</div><div>${PER}문제 중 ${correct}문제 정답 · 틀린 문제의 해설을 확인하고 재시험을 보세요. 재시험은 새 문제로만 나옵니다.</div>`;
  $('#submit').hidden = true; $('#retry').hidden = pass;
  if (pass) {
    const code = certCode(`${cur.name}|${cur.u.id}|${cur.tries}|${at}`);
    $('#cert').value = `[${D.title} 합격]\n이름: ${cur.name}\n단원: ${cur.u.name}\n${cur.tries}회차 만에 합격 · ${at}\n코드: ${code}`;
    $('#certBox').hidden = false;
  }
  report('grade', {name: cur.name, range: cur.u.name + ' 변형문제', score: pass ? 100 : correct * Math.floor(100 / PER), correct, total: PER, tries: cur.tries,
    dur: fmtDur(sec), wrong: pass ? '합격' : `불합격 ${correct}/${PER}`, wrongItems: wrong.join('\n')});
  r.scrollIntoView({behavior: 'smooth'});
};
$('#retry').onclick = () => newRound();
$('#home2').onclick = () => { cur = null; $('#test').hidden = true; $('#home').hidden = false; renderHome(); window.scrollTo(0, 0); };
$('#copyCert').onclick = async () => { try { await navigator.clipboard.writeText($('#cert').value); $('#copyCert').textContent = '복사됨'; } catch (e) { $('#cert').select(); document.execCommand('copy'); $('#copyCert').textContent = '복사됨'; } };

// ---- 초기화 ----
document.title = D.title; $('#title').firstChild ? null : 0;
$('#title').insertAdjacentText('afterbegin', D.title); $('#sub').textContent = D.sub || '';
$('#introP').innerHTML = D.intro || `단원을 하나 고르면 그 단원의 <b>문법 변형문제 ${PER}문제</b>가 나옵니다. <b>${PER}문제를 모두 맞혀야 합격</b>, 하나라도 틀리면 불합격이며 재시험은 <b>이전 회차에 나온 문제를 빼고 새 문제로만</b> 냅니다. 단원의 새 문제를 다 풀면 처음부터 다시 나옵니다.`;
if (D.consent) $('#consentP').innerHTML = D.consent;
if (D.notice) { $('#notice').textContent = D.notice; $('#notice').hidden = false; }
if (D.main) $('#toMain').href = D.main;
$('#name').value = store.get('name', '');
$('#name').oninput = () => { const v = cleanName($('#name').value); if (v) store.set('name', v); };
{ const today = fmtTime(new Date()).slice(0, 10); if (store.get('openDayDrill', '') !== today) { store.set('openDayDrill', today); report('open', {name: store.get('name', ''), range: '변형문제'}); } }
renderHome();
</script>
</body>
</html>
